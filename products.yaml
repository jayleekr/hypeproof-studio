# Product / module registry.
#
# One entry per thing that lives inside the Studio vessel. An entry is the
# record that the four admission gates were answered — see
# docs/plan/vessel-and-modules.md §5.
#
# Gates, and the field that records each:
#   1. Layer declaration   -> layer, tag_prefix
#   2. Contract            -> contract          (exactly one; a DATA FORMAT)
#   3. Drift lock          -> drift_lock        (a test file that actually runs)
#   4. Exit plan           -> exit_plan         (a doc, not "flip a flag")
#
# CI (.github/workflows/registry-check.yml) enforces exactly two things:
#   - a new top-level directory has an entry here
#   - every declared drift_lock file exists and is reachable from a test script
#
# Layer judgment and contract design are not things CI can evaluate. The
# artifact of this process is that a human wrote the page.

version: 1

layers:
  v: app        # Studio binary. Reinstall to reach. Most expensive layer.
  w: service    # Worker runtime. Everyone, instantly.
  c: surface    # Instructor surface (Chalk). Instructors only.
  m: module     # Data. Distributed, not deployed.

# Top-level directories that are NOT products. Anything at the repo root that is
# neither listed here nor claimed by an entry below fails CI — that is the
# "nothing slips in without passing the gates" check. Adding a name here is a
# deliberate act: you are asserting it is infrastructure, not a tenant.
non_product_directories:
  - assets
  - config
  - docs
  - e2e
  - scripts
  - skills
  - tests
  - vscodium-base      # submodule — upstream VSCodium fork
  - proxy-poc          # pre-SDK proxy; superseded, kept for reference
  - extensions         # container dir; the product is extensions/hypeproof-chat

entries:
  - name: hypeproof-chat
    layer: v
    tag_prefix: v
    directory: extensions/hypeproof-chat
    deploys_to: github-release
    contract:
      # The extension talks to the worker over the OpenAI-compatible and
      # Anthropic-compatible HTTP surfaces. That is the format.
      format: "HTTP — POST /v1/chat/completions, POST /v1/messages, GET /v1/profile"
    drift_lock: worker/test/logs-upload.test.mjs
    exit_plan: null          # TODO — the vessel itself; exit plan is n/a but say so explicitly
    owner: jay
    notes: >-
      Grandfathered. Predates the gates. Listed so the registry describes
      reality; exit_plan is intentionally null because this IS the vessel.

  - name: worker
    layer: w
    tag_prefix: w
    directory: worker
    deploys_to: cloudflare://hypeproof-studio-api
    contract:
      format: "HTTP — see hypeproof-chat entry (same surface, other side)"
    drift_lock: worker/test/quest-result-contract.test.mjs
    exit_plan: null
    owner: jay
    notes: >-
      Grandfathered. The runtime. Version identifier lands with plan task C.

  - name: chalk
    layer: c
    tag_prefix: c
    directory: chalk
    deploys_to: cloudflare://hypeproof-chalk
    admitted: 2026-09-04     # plan task F — moved from `planned` in the PR that created chalk/
    contract:
      # The ONE contract is read-only cohort JSON under GET /admin/cohorts/:id/*.
      # /state landed with task F, /board with task G — same format, same
      # drift-lock file, still one contract. Operational metadata only — no
      # prompt text, no member handles (spec §4).
      format: "read-only cohort JSON — GET /admin/cohorts/:id/{state,board}"
    drift_lock: chalk/test/board-contract.test.mjs
    exit_plan: docs/exit/chalk.md
    owner: jay
    notes: >-
      Gate 1: Surface — code, no local resources, consumed by instructors.
      Gate 2: instructor WRITES (session open/close, roster append, token mint)
      are NOT a Chalk contract — Chalk forwards them to the Service's existing
      /admin/* HTTP surface as one more client of it (same as the hype-session
      skill); the Service stays byte-identical on those paths. Instructor
      token verification is RE-EXPORTED from worker/src/lib (chalk/src/shared.ts),
      never reimplemented; chalk/test/instructor-auth-drift.test.mjs runs the
      same fixtures through both workers. Until task H the profile registry is
      imported from worker/src/profiles for display names only.
      Task G added GET /admin/cohorts/:id/board under the same contract. Its
      thresholds are SERVED in the response rather than compiled into any
      client (spec §1) and are calibrated by replaying the labelled 2026-08-22
      session in chalk/test/board-threshold.test.mjs.

  - name: curriculum-module
    layer: m
    tag_prefix: m
    # No directory of its own: the module is DATA in KV, not a tree in this
    # repo. `worker/src/prompts/<cohort>.md` is the compiled-in FALLBACK copy
    # of the same text (the floor the worker serves when nothing is pinned or
    # the pin is unservable); the Module layer proper is what
    # `worker/scripts/publish-module.ts` writes.
    directory: worker/src/prompts
    deploys_to: kv://HPS_KV/module:curriculum:<profile_id>:{v:<version>,pin}
    contract:
      # One JSON document shape, shared by the publisher and the worker
      # (worker/src/lib/modules.ts makeModuleDoc / validateModuleDoc). The
      # envelope is kind-agnostic; kind "session-design" (Chalk) reuses it.
      format: "JSON — hps-module/1 {format, kind, profile_id, version m*, sha256, published_at, content:{system_prompt}}"
    drift_lock: worker/test/module-distribution.test.mjs
    exit_plan: >-
      `npm run module -- unpin <profile>` for every profile returns the worker
      to its compiled text with zero code change (that path is the tested
      floor). Then delete worker/src/lib/modules.ts, the resolveProfile call in
      lib/chat-gate.ts and routes/chat.ts /profile, the module_* fields on
      ChatLog, and this entry. Nothing else knows the module exists.
    owner: jay
    notes: >-
      dag task H. Curriculum is the experimental condition of philosophy §11's
      loop; this is what gives it a name (`m2026.09.04-1`, or
      `compiled:<hash>` before anything is published) on every turn record.

