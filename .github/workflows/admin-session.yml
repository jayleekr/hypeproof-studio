name: admin-session

# Thin dispatcher over the #293 composite endpoints. One workflow_dispatch,
# authenticated by the already-wired HPS_ADMIN_PASSWORD CI secret, lets an
# operator with merge rights open/close a workshop session WITHOUT holding the
# admin password or signing secret in plaintext. Partially serves #191 (강사
# 자율 세션); unblocks the copyclone homepage rehearsal (#290).
#
# `open`  : POST /admin/cohorts/:id/session/open  (server does guard→mint→
#           roster→start atomically; 409 unless force). The minted student
#           token is delivered to a PRIVATE Discord channel — never the public
#           job summary. Summary shows only jti/user/window.
# `close` : POST /admin/cohorts/:id/session/close (end session + revoke jti).
#
# Requires #293 to be DEPLOYED to prod first (endpoints are merged to main but
# ship on the next `wrangler deploy`).

on:
  workflow_dispatch:
    inputs:
      action:
        description: "open | close"
        type: choice
        options: [open, close]
        default: open
      cohort:
        description: "cohort id"
        default: boah-dental-2026-a
      profile:
        description: "profile id (open)"
        default: boah-dental-director-copyclone-2026-s1
      user_handle:
        description: "student handle to mint + add to roster (open)"
        default: rehearsal-director
      token_hours:
        description: "student token lifetime, 1..24 (open)"
        default: "6"
      session_hours:
        description: "session window length, 1..24 (open)"
        default: "3"
      force:
        description: "replace a live session (open)"
        type: boolean
        default: false
      jti:
        description: "token jti to revoke (close)"
        default: ""

permissions:
  contents: read

concurrency:
  group: admin-session-${{ github.event.inputs.cohort }}
  cancel-in-progress: false

jobs:
  admin-session:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      PROD: https://api.hypeproof-ai.xyz
      PW: ${{ secrets.HPS_ADMIN_PASSWORD }}
      DISCORD: ${{ secrets.DISCORD_WEBHOOK_HYPEPROOF_STUDIO }}
      ACTION: ${{ github.event.inputs.action }}
      COHORT: ${{ github.event.inputs.cohort }}
      PROFILE: ${{ github.event.inputs.profile }}
      UHANDLE: ${{ github.event.inputs.user_handle }}
      THOURS: ${{ github.event.inputs.token_hours }}
      SHOURS: ${{ github.event.inputs.session_hours }}
      FORCE: ${{ github.event.inputs.force }}
      JTI: ${{ github.event.inputs.jti }}
    steps:
      - name: run
        run: |
          set -euo pipefail
          [ -n "${PW:-}" ] || { echo "::error::HPS_ADMIN_PASSWORD secret is empty"; exit 1; }
          # --fail-with-body: non-2xx makes curl exit non-zero (so a guard/auth
          # error can never be misread as success) while still printing the body.
          a() { curl -sS --fail-with-body -u "admin:$PW" "$@"; }

          if [ "$ACTION" = "close" ]; then
            [ -n "${JTI:-}" ] || { echo "::error::close needs a jti input"; exit 1; }
            RESP=$(a -X POST "$PROD/admin/cohorts/$COHORT/session/close" \
              -H 'content-type: application/json' -d "{\"jti\":\"$JTI\"}")
            echo "### admin-session: close ($COHORT) — revoked $JTI" >> "$GITHUB_STEP_SUMMARY"
            echo "$RESP"
            exit 0
          fi

          # ---- open ----
          case "$UHANDLE" in *[!a-zA-Z0-9_-]*) echo "::error::user_handle must be [a-zA-Z0-9_-]"; exit 1;; esac
          case "$THOURS" in ''|*[!0-9]*) echo "::error::token_hours must be an integer"; exit 1;; esac
          case "$SHOURS" in ''|*[!0-9]*) echo "::error::session_hours must be an integer"; exit 1;; esac
          [ -n "${DISCORD:-}" ] || { echo "::error::DISCORD_WEBHOOK_HYPEPROOF_STUDIO empty — refusing to open (token would have nowhere private to go)"; exit 1; }
          FORCE_JSON=false; [ "$FORCE" = "true" ] && FORCE_JSON=true

          # Server does guard(409-unless-force) → mint → roster append → start,
          # and returns the token ONLY in this HTTPS response body.
          RESP=$(a -X POST "$PROD/admin/cohorts/$COHORT/session/open" \
            -H 'content-type: application/json' \
            -d "{\"profile_id\":\"$PROFILE\",\"user\":\"$UHANDLE\",\"token_hours\":$THOURS,\"session_hours\":$SHOURS,\"force\":$FORCE_JSON}")

          TOKEN=$(printf '%s' "$RESP" | python3 -c "import sys,json;print(json.load(sys.stdin).get('token',''))")
          JTI_OUT=$(printf '%s' "$RESP" | python3 -c "import sys,json;print(json.load(sys.stdin).get('jti',''))")
          [ -n "$TOKEN" ] || { echo "::error::open returned no token"; exit 1; }

          # Deliver the token to the PRIVATE Discord channel (not the public log).
          # Token comes via env (never interpolated into the shell) and the JSON
          # is written to a file, so there is no quoting/injection surface.
          TOKEN="$TOKEN" JTI_OUT="$JTI_OUT" python3 -c "import json,os;open('/tmp/msg.json','w').write(json.dumps({'content':'admin-session open — cohort=%s profile=%s user=%s jti=%s — token(%sh): %s'%(os.environ['COHORT'],os.environ['PROFILE'],os.environ['UHANDLE'],os.environ['JTI_OUT'],os.environ['THOURS'],os.environ['TOKEN'])}))"
          curl -sS --fail-with-body -X POST "$DISCORD" -H 'content-type: application/json' -d @/tmp/msg.json >/dev/null
          echo "token delivered to Discord"

          {
            echo "### admin-session: open ✅"
            echo "- cohort: \`$COHORT\`  profile: \`$PROFILE\`  user: \`$UHANDLE\`"
            echo "- token: delivered to private Discord (#hypeproof-studio) — NOT logged here"
            echo "- jti (for close): \`$JTI_OUT\`"
          } >> "$GITHUB_STEP_SUMMARY"
