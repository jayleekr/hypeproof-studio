name: usage-report

# 프로덕션 D1 `usage_log` 의 집계를 Actions 요약으로 낸다.
#
# 왜 워크플로인가 — 팀이 토큰 사용량을 보려면 지금까지 Cloudflare 계정이 필요했고,
# 그 계정은 Jay 개인 계정이다. 사람마다 API 토큰을 발급하면 회수·순환·유출 관리가
# 생기고 감사 기록도 남지 않는다. 배포가 이미 그렇듯(deploy-worker.yml) 자격증명은
# repo 시크릿에 하나만 두고 **읽을 수 있는 사람 = repo write 를 가진 사람**으로 맞춘다.
#
# 나가는 것은 합계뿐이다. 자유 SQL 입력은 받지 않는다 — 같은 DB 에 수업 트레이스와
# 수강생 발화가 있어서, 그건 집계 권한이 아니라 대화 열람 권한이 된다.
# 질의문은 worker/scripts/usage-report.mjs 가 allowlist 로 만든다.

on:
  workflow_dispatch:
    inputs:
      days:
        description: "며칠치 (1-365)"
        required: false
        default: "7"
      by:
        description: "집계 차원"
        type: choice
        options: [model, cohort, profile, day]
        default: model
      cohort:
        description: "코호트 id 로 좁히기 (비우면 전체)"
        required: false
        default: ""

permissions:
  contents: read

concurrency:
  group: usage-report
  cancel-in-progress: true

jobs:
  report:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: worker/package-lock.json

      - name: Install worker dependencies
        working-directory: worker
        run: npm ci

      - name: Fail early when the token is missing
        # 토큰이 없으면 wrangler 는 대화형 로그인을 시도하다 알 수 없는 형태로 죽는다.
        # "시크릿이 없다" 와 "쿼리가 실패했다" 는 고치는 사람이 다르므로 갈라 놓는다.
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ]; then
            echo "::error::CLOUDFLARE_API_TOKEN 시크릿이 없습니다. repo Settings → Secrets 에서 설정하세요."
            exit 1
          fi

      - name: Query usage_log
        id: query
        working-directory: worker
        # 입력을 `${{ }}` 로 run 본문에 직접 박지 않는다 — 그건 셸 인젝션이고,
        # 이 러너에는 CLOUDFLARE_API_TOKEN 이 있다. env 로 넘기면 값이 셸에
        # 해석되지 않고 변수로만 들어간다. (스크립트가 값을 다시 검증한다 —
        # 방어선은 둘이다.)
        env:
          IN_DAYS: ${{ inputs.days }}
          IN_BY: ${{ inputs.by }}
          IN_COHORT: ${{ inputs.cohort }}
        run: |
          set -o pipefail
          if [ -n "$IN_COHORT" ]; then
            node scripts/usage-report.mjs --days "$IN_DAYS" --by "$IN_BY" --cohort "$IN_COHORT" \
              | tee "$GITHUB_STEP_SUMMARY"
          else
            node scripts/usage-report.mjs --days "$IN_DAYS" --by "$IN_BY" \
              | tee "$GITHUB_STEP_SUMMARY"
          fi

      - name: Explain a D1 permission failure
        if: failure()
        run: |
          echo "::notice::쿼리가 실패했다면 CLOUDFLARE_API_TOKEN 에 **D1 Read** 권한이 없을 수 있습니다."
          echo "::notice::이 토큰은 원래 배포용(Workers Scripts Edit)으로 만들어졌습니다 — D1 권한 추가는 계정 소유자만 할 수 있습니다."
