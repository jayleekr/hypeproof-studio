name: dental-reference
on:
  pull_request:
    paths:
      - 'docs/curriculum/dental-ownership/**'
      - 'e2e/dental-reference/**'
      - 'e2e/preview-viewport/**'
      - 'extensions/hypeproof-chat/src/liveServerHelpers.ts'
      - 'extensions/hypeproof-chat/src/nativeBrowser.ts'
      - 'e2e/chalk-authoring/**'
      - 'e2e/classroom/**'
      - 'worker/src/routes/classroom.ts'
      - 'worker/test/harness/classroom.mjs'
      - 'worker/src/lib/lesson-delivery.ts'
      - 'chalk/**'
      - 'worker/src/routes/authoring.ts'
      - 'worker/src/lib/session-design.ts'
      - 'e2e/package*.json'
      - '.github/workflows/dental-reference.yml'
permissions:
  contents: read
jobs:
  reference-browser:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: e2e/package-lock.json
      - run: npm ci
        working-directory: e2e
      - run: npx playwright install --with-deps chromium
        working-directory: e2e
      - run: npm ci
        working-directory: worker
      - run: npm ci
        working-directory: chalk
      - run: npm run test:chalk-authoring
        working-directory: e2e
      # 같은 폴더인데 목록에 없어서 안 돌던 둘. simple.mjs 는 실제로 #1115 에 깨진 채
      # 머지됐다. 추가 비용은 로컬 실측 3초 남짓이고, 무거운 chromium 설치는 이 잡이
      # 이미 치르고 있다. 이 폴더에 러너를 새로 만들면 여기에 한 줄을 더해야 돈다.
      - run: npm run test:chalk-simple
        working-directory: e2e
      - run: npm run test:chalk-step-keys
        working-directory: e2e
      - run: npm run test:classroom
        working-directory: e2e
      - run: npm run test:preview-viewport
        working-directory: e2e
      - run: npm run test:dental-reference
        working-directory: e2e
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: dental-reference-evidence
          path: |
            e2e/test-results/dental-reference/
            e2e/test-results/chalk-authoring/
            e2e/test-results/classroom/
          retention-days: 14
