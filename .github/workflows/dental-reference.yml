name: dental-reference
on:
  pull_request:
    paths:
      - 'docs/curriculum/dental-ownership/**'
      - 'e2e/dental-reference/**'
      - 'e2e/package*.json'
      - '.github/workflows/dental-reference.yml'
permissions:
  contents: read
jobs:
  reference-browser:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: e2e/package-lock.json
      - run: npm ci
        working-directory: e2e
      - run: npx playwright install --with-deps chromium
        working-directory: e2e
      - run: npm run test:dental-reference
        working-directory: e2e
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: dental-reference-evidence
          path: e2e/test-results/dental-reference/
          retention-days: 14
