# Soft enforcement of the PR-first policy (server-side branch protection needs
# a paid plan on private repos — see CONTRIBUTING.md). This cannot block a push;
# it makes a direct push to main a loud, visible CI failure.
#
# Pass conditions:
#   - the pushed head commit is associated with a merged PR, OR
#   - the pusher is the maintainer (jayleekr), OR
#   - the head commit message contains [skip-main-guard]
name: main-guard
on:
  push:
    branches: [main]
permissions:
  contents: read
  pull-requests: read
jobs:
  enforce-pr-first:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/github-script@v7
        with:
          script: |
            const actor = context.actor;
            const sha = context.payload.head_commit?.id || context.sha;
            const msg = context.payload.head_commit?.message || "";

            if (actor === "jayleekr") {
              core.notice(`Maintainer push by ${actor} — allowed.`);
              return;
            }
            if (msg.includes("[skip-main-guard]")) {
              core.notice("Override marker present — allowed.");
              return;
            }

            const { data: prs } =
              await github.rest.repos.listPullRequestsAssociatedWithCommit({
                owner: context.repo.owner,
                repo: context.repo.repo,
                commit_sha: sha,
              });
            const merged = prs.find(p => p.merged_at);
            if (merged) {
              core.notice(`Reached main via PR #${merged.number}.`);
              return;
            }

            core.setFailed(
              `Direct push to main by ${actor} (commit ${sha.slice(0,7)}). ` +
              `Policy is PR-first — open a PR from a feat/* or fix/* branch. ` +
              `If this was intentional, add [skip-main-guard] to the commit message.`
            );
