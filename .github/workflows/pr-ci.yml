name: studio-pr-ci

on:
  pull_request:
  push:
    branches: [main]
    paths:
      - 'worker/**'
      - 'chalk/**'
      - 'extensions/hypeproof-chat/**'
      - '.github/workflows/pr-ci.yml'

permissions:
  contents: read

jobs:
  dev-channel-tag-classifier:
    name: dev-channel / tag-is-prerelease
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # dag.yaml task A control: the --prerelease decision used by
      # build-mac.yml / build-windows.yml must be testable without cutting a
      # real tag. Runs in milliseconds, no build/app required.
      - name: Regression — tag-is-prerelease positive + negative controls
        run: bash scripts/test-tag-is-prerelease.sh

  live-session-freeze:
    name: deploy-freeze / live-session controls
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      # dag.yaml task D control (#676): the live-class freeze used by
      # deploy-worker.yml / build-mac.yml / build-windows.yml must be
      # exercisable with no live class and no real deploy. Fixtures + a
      # planted clock; milliseconds, no network. Includes the fail-closed
      # cases, which are the ones nobody would otherwise ever see run.
      - name: Regression — live-session freeze positive/negative/override controls
        run: node scripts/test-check-live-sessions.mjs

  worker-test:
    name: worker / test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: worker/package-lock.json
      - name: Install worker deps
        working-directory: worker
        run: npm ci
      - name: Run worker tests
        working-directory: worker
        run: npm test

  worker-typecheck:
    name: worker / typecheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: worker/package-lock.json
      - name: Install worker deps
        working-directory: worker
        run: npm ci
      - name: Typecheck worker
        working-directory: worker
        run: npm run typecheck

  # Chalk (chalk/) — the instructor surface, its own Worker on the c* train
  # (plan task F). It re-exports the Service's token verifier and its
  # drift-lock test boots the Service app in-process, so both dependency
  # trees are installed. `npm test` here includes the two task-F controls:
  # instructor-auth-drift (one verifier, two workers) and deploy-isolation
  # (a c* deploy cannot move the Service's version).
  chalk-test:
    name: chalk / test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: chalk/package-lock.json
      - name: Install worker deps (shared auth module)
        working-directory: worker
        run: npm ci
      - name: Install chalk deps
        working-directory: chalk
        run: npm ci
      - name: Run chalk tests
        working-directory: chalk
        run: npm test

  chalk-typecheck:
    name: chalk / typecheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: chalk/package-lock.json
      - name: Install chalk deps
        working-directory: chalk
        run: npm ci
      - name: Typecheck chalk
        working-directory: chalk
        run: npm run typecheck

  validate-profiles:
    name: worker / validate-profiles
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: worker/package-lock.json
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install worker deps
        working-directory: worker
        run: npm ci
      # Validator (validate.py + rules.yaml) is studio-local at
      # worker/scripts/cohort-harness/ — guardrails for cohort profiles
      # (7-asset enum, prompt↔profile coherence, child-safety). Real gate.
      - name: Validate cohort profiles
        working-directory: worker
        run: npm run validate-profiles
      # The step above proves the REAL profiles pass. This one proves the
      # validator still detects what it claims to — the inner loop. Without it
      # a guard can rot silently: #606 found the suite already red (a renamed
      # check and a fixture stale against #306) while the real gate stayed green,
      # and the #602 child upload_session_logs guard had no coverage at all.
      - name: Validator self-test (fixtures)
        run: bash worker/scripts/cohort-harness/test/run.sh

  extension-typecheck:
    name: extension / typecheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: extensions/hypeproof-chat/package-lock.json
      - name: Install extension deps
        # --omit=optional skips @anthropic-ai/claude-agent-sdk's ~250 MB native
        # `claude` binary package (#282) — typecheck/smoke never spawn it.
        working-directory: extensions/hypeproof-chat
        run: npm ci --omit=optional
      - name: Typecheck extension
        working-directory: extensions/hypeproof-chat
        run: npm run typecheck

  extension-test:
    name: extension / smoke
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: extensions/hypeproof-chat/package-lock.json
      - name: Install extension deps
        # --omit=optional skips @anthropic-ai/claude-agent-sdk's ~250 MB native
        # `claude` binary package (#282) — typecheck/smoke never spawn it.
        working-directory: extensions/hypeproof-chat
        run: npm ci --omit=optional
      # U-layer pure smoke tests (test/*.smoke.mjs) — no vscode host needed.
      - name: Run extension smoke tests
        working-directory: extensions/hypeproof-chat
        run: npm test
