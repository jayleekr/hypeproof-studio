name: Build Windows

on:
  workflow_dispatch:
    inputs:
      ref:
        description: "Branch or tag to build"
        required: false
        default: ""
      # dag.yaml task D / #676 — mirror of build-mac.yml. Only meaningful
      # when dispatching against a stable TAG ref, the one dispatch shape
      # that publishes a Release. Empty (i.e. never overridden) on the
      # `push: tags` path below.
      override_live_session:
        description: "Publish even if a class is live (stable tag refs only; recorded in the job summary)"
        type: boolean
        default: false
  push:
    tags:
      - "v*"

permissions:
  contents: write # create/upload the GitHub Release on tag builds
  actions: write # dispatch mirror-release.yml (#698 — see the dispatch step)

# Match build-mac.yml: never cancel an in-flight release build, and serialize
# runs for the same ref so a tag push + manual dispatch can't race on the
# shared GitHub Release upload.
concurrency:
  group: build-win-${{ github.event.inputs.ref || github.ref }}
  cancel-in-progress: false

jobs:
  build-win:
    runs-on: windows-2022
    timeout-minutes: 120

    env:
      OS_NAME: windows
      VSCODE_ARCH: x64
      VSCODE_QUALITY: stable
      CI_BUILD: "yes"
      SHOULD_BUILD: "yes"
      SHOULD_BUILD_REH: "no"
      SHOULD_BUILD_REH_WEB: "no"
      SHOULD_BUILD_MSI: "no"
      SHOULD_BUILD_MSI_NOUP: "no"
      SHOULD_BUILD_CLI: "no"
      DISABLE_UPDATE: "yes"
      VSCODE_PUBLISH_COUNTER: 0
      NODE_OPTIONS: "--max-old-space-size=12288"
      npm_config_arch: x64
      npm_config_target_arch: x64

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.ref || github.ref_name }}
          submodules: recursive
          fetch-depth: 0

      - name: Verify vscodium-base submodule
        shell: bash
        run: |
          set -euo pipefail
          git submodule status --recursive
          test -d vscodium-base/icons/stable
          test -f vscodium-base/build.sh

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          # Pin the exact version check-env.sh / build-mac.yml require (22.22.1),
          # not the floating "22.x", so Windows builds are reproducible against
          # the same toolchain as Mac.
          node-version: "22.22.1"

      # dag.yaml task D (#676) — live-class release freeze, fail-fast half.
      # Same contract as build-mac.yml: a stable `v*` tag publishes a
      # non-prerelease Release, which the in-app updater turns into a banner
      # in front of participants; `-rc` tags are exempt because task A made
      # them prereleases that reach nobody. Fails CLOSED — see the header of
      # scripts/check-live-sessions.mjs. Controls:
      # `node scripts/test-check-live-sessions.mjs`.
      - name: Live-session release freeze — pre-build (#676)
        shell: bash
        env:
          HPS_ADMIN_PASSWORD: ${{ secrets.HPS_ADMIN_PASSWORD }}
          HPS_FREEZE_OVERRIDE: ${{ inputs.override_live_session }}
          HPS_FREEZE_CONTEXT: >-
            Windows build of ${{ github.ref_name }} @ ${{ github.sha }} (pre-build gate)
        run: bash scripts/release-freeze-gate.sh "$GITHUB_REF"

      - name: Setup Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install jq
        run: choco install jq -y

      - name: Provision build env
        shell: bash
        run: |
          set -euo pipefail
          # hypeproof-studio.env is gitignored for local secrets. CI uses the
          # committed, secret-free defaults and overrides the Windows target in
          # the workflow env above.
          if [ ! -f hypeproof-studio.env ]; then
            cp hypeproof-studio.env.example hypeproof-studio.env
          fi

      - name: Load HypeProof env
        shell: bash
        run: |
          set -euo pipefail
          # shellcheck source=/dev/null
          source ./hypeproof-studio.env
          # The committed example defaults to macOS; keep this workflow's target
          # explicit after sourcing.
          export OS_NAME="windows"
          export VSCODE_ARCH="x64"
          export VSCODE_QUALITY="${VSCODE_QUALITY:-stable}"
          export CI_BUILD="yes"
          # Re-export to GITHUB_ENV so subsequent steps see them
          {
            echo "APP_NAME=$APP_NAME"
            echo "APP_NAME_LC=$APP_NAME_LC"
            echo "BINARY_NAME=$BINARY_NAME"
            echo "ORG_NAME=$ORG_NAME"
            echo "ASSETS_REPOSITORY=$ASSETS_REPOSITORY"
            echo "GH_REPO_PATH=$GH_REPO_PATH"
            echo "HPS_NAME_SHORT=$HPS_NAME_SHORT"
            echo "HPS_NAME_LONG=$HPS_NAME_LONG"
            echo "HPS_APPLICATION_NAME=$HPS_APPLICATION_NAME"
            echo "HPS_DATA_FOLDER_NAME=$HPS_DATA_FOLDER_NAME"
            echo "HPS_DARWIN_BUNDLE_ID=$HPS_DARWIN_BUNDLE_ID"
            echo "HPS_URL_PROTOCOL=$HPS_URL_PROTOCOL"
            echo "HPS_WIN32_DIR_NAME=$HPS_WIN32_DIR_NAME"
            echo "HPS_WIN32_NAME_VERSION=$HPS_WIN32_NAME_VERSION"
            echo "HPS_WIN32_MUTEX_NAME=$HPS_WIN32_MUTEX_NAME"
            echo "HPS_WIN32_APP_USER_MODEL_ID=$HPS_WIN32_APP_USER_MODEL_ID"
            echo "HPS_WIN32_REG_VALUE_NAME=$HPS_WIN32_REG_VALUE_NAME"
            echo "OS_NAME=$OS_NAME"
            echo "VSCODE_ARCH=$VSCODE_ARCH"
            echo "VSCODE_QUALITY=$VSCODE_QUALITY"
            echo "CI_BUILD=$CI_BUILD"
          } >> "$GITHUB_ENV"

      - name: Resolve release version
        shell: bash
        # On a tag build, the tag (v0.1.10) is the version source of truth and
        # must reach product.json + the bundled extension's package.json (#206).
        # Untagged builds fall back to the extension package.json version inside
        # resolve-version.sh.
        run: |
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            echo "HPS_VERSION=${GITHUB_REF#refs/tags/v}" >> "$GITHUB_ENV"
            echo "Tag build → HPS_VERSION=${GITHUB_REF#refs/tags/v}"
          else
            echo "Untagged build → HPS_VERSION unset, falling back to extension package.json"
          fi
          # Real commit for product.json.commit. This Windows job sources
          # version.sh directly (not run-build.sh), so without this it would hash
          # an empty RELEASE_VERSION to the adc83b19… placeholder (#206).
          echo "BUILD_SOURCEVERSION=$(git rev-parse HEAD)" >> "$GITHUB_ENV"
          echo "BUILD_SOURCEVERSION set to $(git rev-parse HEAD)"

      - name: Install brand assets
        shell: bash
        run: bash scripts/install-brand-assets.sh

      - name: Build icons
        shell: bash
        working-directory: vscodium-base
        run: bash icons/build_icons.sh

      - name: Fetch VS Code source
        shell: bash
        working-directory: vscodium-base
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -eo pipefail
          . ./get_repo.sh
          . ./version.sh

      - name: Prepare VS Code source
        shell: bash
        working-directory: vscodium-base
        run: |
          set -euo pipefail
          bash prepare_vscode.sh

      - name: Apply product.json overrides
        shell: bash
        working-directory: vscodium-base
        run: bash ../scripts/apply-product-overrides.sh

      - name: Inject hypeproof-chat
        shell: bash
        run: bash scripts/inject-builtin-extensions.sh

      - name: Limit extension bundle concurrency
        shell: bash
        env:
          HPS_EXTENSION_BUNDLE_CONCURRENCY: "2"
        run: node scripts/limit-vscode-extension-build-concurrency.mjs

      - name: Apply HP editor watermark before compilation
        shell: bash
        run: node scripts/install-shell-brand.mjs vscodium-base/vscode/src/vs/workbench/browser/parts/editor/media

      - name: Compile Windows source
        shell: bash
        working-directory: vscodium-base
        run: |
          set -euo pipefail
          cd vscode
          export NODE_OPTIONS="--max-old-space-size=8192"
          export VSCODE_PUBLISH_COUNTER=1
          npm run gulp vscode-min-prepack

      - name: Package Windows
        shell: bash
        working-directory: vscodium-base
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          # Keep the hand-vendored Agent SDK JS (dist/vendor/node_modules) through
          # the tar strip. The generic `*/node_modules/*` exclusion would drop it
          # from BOTH the source extension AND its compiled copy under
          # .build/extensions — and min-packing ships from .build, so the packaged
          # app ends up with dist/vendor/package.json but no node_modules/sdk.mjs,
          # and the coach silently degrades to proxy-only (#343). Mac never hit
          # this: build.sh works in-place with no tar/re-extract. The
          # `*/hypeproof-chat/dist/vendor/*` exception rescues both locations
          # file-by-file (no reliance on tar -T dir recursion, which left only the
          # two non-node_modules files last run).
          find vscode -type f \( -path "*/hypeproof-chat/dist/vendor/*" -o -not -path "*/node_modules/*" \) -not -path "vscode/.build/node/*" -not -path "vscode/.git/*" > vscode.txt
          echo "vscode/.build/extensions/node_modules" >> vscode.txt
          echo "vscode/.git" >> vscode.txt
          tar -czf vscode.tar.gz -T vscode.txt
          rm -rf vscode
          bash build/windows/package.sh
          # Diagnostic: confirm the vendored SDK entry survived into the packaged
          # app (the smoke step asserts the same path; this makes a failure obvious
          # here, right after packaging, rather than 3 steps later).
          VENDOR_SDK="VSCode-win32-${VSCODE_ARCH}/resources/app/extensions/hypeproof-chat/dist/vendor/node_modules/@anthropic-ai/claude-agent-sdk/sdk.mjs"
          if [ -f "$VENDOR_SDK" ]; then echo "vendor sanity: sdk.mjs present in packaged app"; else echo "::warning::vendor sanity: sdk.mjs MISSING from packaged app ($VENDOR_SDK)"; fi
          # Re-stamp product.json.version on the PACKAGED app before it is zipped
          # + turned into installers. Parity with build-mac.yml #361: VS Code's
          # gulp re-derives product.json.version from vscode/package.json (the
          # engine version, e.g. 1.116.x) during packaging, reverting the 0.1.x
          # apply-product-overrides.sh set pre-build. Without this the shipped
          # Windows zip + installers carry the engine version on the About screen
          # instead of the HPS release version. Must run before prepare_assets.sh
          # so the stamp is inside every artifact.
          PKG_PRODUCT="VSCode-win32-${VSCODE_ARCH}/resources/app/product.json"
          HPS_VER="${HPS_VERSION:-$(bash ../scripts/resolve-version.sh)}"
          if [ -n "$HPS_VER" ] && [ -f "$PKG_PRODUCT" ]; then
            tmp=$(mktemp)
            jq --arg v "$HPS_VER" '.version = $v' "$PKG_PRODUCT" > "$tmp" && mv "$tmp" "$PKG_PRODUCT"
            echo "Stamped packaged product.json.version → $HPS_VER"
          else
            echo "::warning::skipped Windows version stamp (HPS_VER='$HPS_VER', product='$PKG_PRODUCT')"
          fi
          bash prepare_assets.sh

      - name: Locate artifacts
        id: artifacts
        shell: bash
        working-directory: vscodium-base
        run: |
          set -euo pipefail
          shopt -s nullglob
          mkdir -p ../dist
          while IFS= read -r -d '' f; do
            cp -v "$f" ../dist/
          done < <(find . -maxdepth 4 -type f \( -name '*.exe' -o -name '*.zip' \) -print0)
          ls -la ../dist || true
          if ! find ../dist -type f \( -name '*.exe' -o -name '*.zip' \) | grep -q .; then
            echo "::error::Windows build produced no .exe or .zip artifacts"
            exit 1
          fi

      - name: Verify installer .exe present
        shell: bash
        run: |
          set -euo pipefail
          # The user-facing installer (scripts/install-win.ps1) resolves a
          # *Setup*x64*.exe release asset. The portable-zip smoke and the
          # exe-OR-zip "Locate artifacts" check both pass on the zip alone, so
          # an installer-less build (inno-updater hiccup, a SHOULD_BUILD_EXE_*
          # regression, a failed mv) would go green and publish — then every
          # end-user install fails with "No Windows x64 installer .exe found".
          # Assert at least one Setup installer actually reached dist/.
          shopt -s nullglob
          setups=(dist/*Setup*x64*.exe)
          if [ "${#setups[@]}" -eq 0 ]; then
            echo "::error::No *Setup*x64*.exe installer in dist/ — install-win.ps1 would fail for users"
            ls -la dist || true
            exit 1
          fi
          printf 'Installer present: %s\n' "${setups[@]##*/}"

      - name: Smoke portable Windows build
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"

          $zip = Get-ChildItem -Path dist -Filter "HypeProof Studio-win32-x64-*.zip" | Select-Object -First 1
          if (-not $zip) {
            throw "Portable Windows zip artifact was not found in dist/"
          }

          $smokeRoot = Join-Path $env:RUNNER_TEMP "hps-smoke"
          if (Test-Path $smokeRoot) {
            Remove-Item -Recurse -Force $smokeRoot
          }
          New-Item -ItemType Directory -Path $smokeRoot | Out-Null
          Expand-Archive -Path $zip.FullName -DestinationPath $smokeRoot -Force

          $productPath = Join-Path $smokeRoot "resources/app/product.json"
          if (-not (Test-Path $productPath)) {
            throw "resources/app/product.json was not found in portable zip"
          }

          $product = Get-Content $productPath -Raw | ConvertFrom-Json
          if ($product.nameShort -ne "HypeProof Studio") {
            throw "Unexpected nameShort: $($product.nameShort)"
          }
          if ($product.applicationName -ne "hypeproof-studio") {
            throw "Unexpected applicationName: $($product.applicationName)"
          }
          if ($product.win32DirName -ne "HypeProof Studio") {
            throw "Unexpected win32DirName: $($product.win32DirName)"
          }
          if ($product.win32AppUserModelId -ne "HypeProofLab.HypeProofStudio") {
            throw "Unexpected win32AppUserModelId: $($product.win32AppUserModelId)"
          }

          $extensionPath = Join-Path $smokeRoot "resources/app/extensions/hypeproof-chat/package.json"
          if (-not (Test-Path $extensionPath)) {
            throw "hypeproof-chat built-in extension was not bundled"
          }

          # Version parity (mirrors the verify-branding.sh / #206 gate + the
          # #361 restamp): the packaged product.json.version must be the HPS
          # release version, not the reverted VS Code engine version. On tag
          # builds HPS_VERSION is authoritative; otherwise it must match the
          # bundled extension's version (resolve-version.sh's fallback source).
          $prodVer = $product.version
          if (-not $prodVer) { throw "product.json.version is empty (#206 updater gate)" }
          $extPkg = Get-Content $extensionPath -Raw | ConvertFrom-Json
          $expectedVer = if ($env:HPS_VERSION) { $env:HPS_VERSION -replace '^v','' } else { $extPkg.version }
          if ($prodVer -ne $expectedVer) {
            throw "product.json.version '$prodVer' != expected '$expectedVer' — VS Code engine version leaked in? (see build-mac.yml #361 restamp)"
          }
          Write-Host "product.json.version = $prodVer (matches expected release version)."

          # Vendored Agent SDK JS must have survived into the shipped bundle.
          # verify-branding.sh asserts this on Mac (REQUIRE_SDK_VENDOR=1) but is
          # macOS-only; without a Windows equivalent a build whose vendor tree
          # dropped out silently degrades the coach to proxy-only (#282/#343).
          $sdkEntry = Join-Path $smokeRoot "resources/app/extensions/hypeproof-chat/dist/vendor/node_modules/@anthropic-ai/claude-agent-sdk/sdk.mjs"
          if (-not (Test-Path $sdkEntry)) {
            throw "Vendored Agent SDK JS missing from packaged build (dist/vendor/.../claude-agent-sdk/sdk.mjs) — coach would silently run proxy-only (#343)"
          }
          Write-Host "Vendored Agent SDK JS present in packaged build."

          # The 229 MB per-platform native binary packages reach students via the
          # W4a seed, never the app bundle — fail if one leaked into the vendor tree.
          $vendorAnthropic = Join-Path $smokeRoot "resources/app/extensions/hypeproof-chat/dist/vendor/node_modules/@anthropic-ai"
          if (Test-Path $vendorAnthropic) {
            $leakedBin = Get-ChildItem -Path $vendorAnthropic -Directory -Filter "claude-agent-sdk-*" -ErrorAction SilentlyContinue
            if ($leakedBin) {
              throw "Platform-binary SDK package leaked into shipped vendor tree: $($leakedBin.Name -join ', ') — must be seeded (W4a), not shipped"
            }
          }

          # Residual VSCodium/codium leakage in the shipped bundle — the Windows
          # counterpart of verify-branding.sh check 5 (REQ-J4). Same exclusions:
          # skip node_modules / dist/vendor / policies paths and license/notice
          # files, extract ~100-char windows around each 'codium' hit, then drop
          # the known-benign contexts. Anything left is a real, never-before-seen
          # leak → hard fail. The upstream reload toast (#356) is warn-only.
          $appResources = Join-Path $smokeRoot "resources/app"
          $knownToast = "reload VSCodium to enable"
          $leaks = @()
          $toastLeaks = @()
          Get-ChildItem -Path $appResources -Recurse -File -ErrorAction SilentlyContinue | Where-Object {
            $_.FullName -notmatch '[\\/](node_modules|vendor|policies)[\\/]' -and
            $_.Name -notmatch '(?i)(license|notice|attribution|third.?party|credits)' -and
            $_.FullName -notmatch '[\\/]resources[\\/]app[\\/]package\.json$'
          } | ForEach-Object {
            $file = $_.FullName
            $content = Get-Content -Path $file -Raw -ErrorAction SilentlyContinue
            if (-not $content -or $content.Contains([char]0)) { return }  # skip binary
            if ($content -notmatch '(?i)codium') { return }
            foreach ($w in [regex]::Matches($content, '(?is).{0,50}codium.{0,50}')) {
              $ctx = $w.Value
              if ($ctx -match '(?i)sourcemaps') { continue }
              if ($ctx -match '(?i)@vscodium/') { continue }
              if ($ctx -match '"author":\{"name":"VSCodium"\}') { continue }
              if ($ctx -match 'VSCodium",this\.productName') { continue }
              if ($ctx -match [regex]::Escape($knownToast)) { $toastLeaks += $file; continue }
              $leaks += $file
              break
            }
          }
          if ($toastLeaks.Count -gt 0) {
            Write-Host "! Known reload-toast leak (#356, non-blocking) in:" -ForegroundColor Yellow
            ($toastLeaks | Sort-Object -Unique) | ForEach-Object { Write-Host "    $_" }
          }
          $leaks = $leaks | Sort-Object -Unique
          if ($leaks.Count -gt 0) {
            Write-Host "Residual 'codium'/'VSCodium' found in shipped bundle:" -ForegroundColor Red
            $leaks | ForEach-Object { Write-Host "    $_" }
            throw "Residual VSCodium/codium branding in shipped bundle (REQ-J4)"
          }
          Write-Host "No residual VSCodium/codium branding in resources/app."

          $exe = Join-Path $smokeRoot "HypeProof Studio.exe"
          if (-not (Test-Path $exe)) {
            throw "HypeProof Studio.exe was not found in portable zip"
          }

          $args = @(
            "--user-data-dir", (Join-Path $env:RUNNER_TEMP "hps-user-data"),
            "--extensions-dir", (Join-Path $env:RUNNER_TEMP "hps-extensions"),
            "--disable-extensions",
            "--disable-gpu",
            "--no-sandbox"
          )

          $proc = Start-Process -FilePath $exe -ArgumentList $args -PassThru
          Start-Sleep -Seconds 20
          $proc.Refresh()
          if (-not $proc.HasExited) {
            Stop-Process -Id $proc.Id -Force
            Write-Host "HypeProof Studio.exe launched and stayed alive for 20 seconds."
            exit 0
          }
          if ($proc.ExitCode -ne 0) {
            throw "HypeProof Studio.exe exited early with exit code $($proc.ExitCode)"
          }

          Write-Host "HypeProof Studio.exe exited cleanly during launch smoke."

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: hypeproof-studio-windows-x64
          path: dist/
          if-no-files-found: error
          retention-days: 14

      # dag.yaml task D (#676) — the half that actually protects the class.
      # The pre-build copy only proved no class was running 1–2 h ago; this is
      # the last moment before the Release (and therefore the update banner)
      # exists. The assets are already in the workflow artifact above, so a
      # block here costs only the publish, not the build.
      - name: Live-session release freeze — pre-publish (#676)
        if: startsWith(github.ref, 'refs/tags/v')
        shell: bash
        env:
          HPS_ADMIN_PASSWORD: ${{ secrets.HPS_ADMIN_PASSWORD }}
          HPS_FREEZE_OVERRIDE: ${{ inputs.override_live_session }}
          HPS_FREEZE_CONTEXT: >-
            Windows release ${{ github.ref_name }} @ ${{ github.sha }} (pre-publish gate)
        run: bash scripts/release-freeze-gate.sh "$GITHUB_REF"

      - name: Publish to GitHub Release (tag builds only)
        if: startsWith(github.ref, 'refs/tags/v')
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          TAG="${GITHUB_REF#refs/tags/}"
          shopt -s nullglob
          assets=(dist/*.exe dist/*.zip)
          if [ "${#assets[@]}" -eq 0 ]; then
            echo "::error::No Windows release assets found in dist/"
            exit 1
          fi
          # dag.yaml task A / vessel-and-modules.md §6 stage 2: a hyphenated
          # tag (v9.9.9-rc.1) is a dev-channel prerelease. The in-app updater
          # (updateCheckerHelpers.ts:169) already skips draft/prerelease
          # releases and GitHub's /releases/latest excludes them by
          # definition — actually marking the release is the only missing
          # piece. Decision lives in scripts/tag-is-prerelease.sh so it can be
          # unit-tested without cutting a real tag (scripts/test-tag-is-prerelease.sh).
          PRERELEASE_FLAG="$(bash scripts/tag-is-prerelease.sh "$TAG")"
          # build-mac.yml may have created the release for the same tag;
          # create-if-absent then clobber-upload is race-safe across both jobs.
          gh release create "$TAG" --title "HypeProof Studio $TAG" \
            --generate-notes --verify-tag $PRERELEASE_FLAG 2>/dev/null || true
          gh release upload "$TAG" "${assets[@]}" --clobber

      # #698 — dispatch the mirror from HERE TOO, not only from build-mac.
      #
      # task K put this on mac alone, reasoning that dispatching from both
      # would queue duplicate runs in the same concurrency group and that the
      # mirror's 150-minute wait loop (#632) already handles late Windows
      # assets. That reasoning is sound about duplicates and wrong about
      # failure: it assumed mac reaches this point.
      #
      # v0.0.0-rc.1 proved otherwise. build-mac died at "Import signing
      # certificate" (#697), so Publish and Trigger were both skipped and the
      # mirror never ran — the exact outage #663 was written to prevent, with
      # the automation hanging off the one build that does code signing and so
      # has the wider failure surface.
      #
      # A duplicate mirror run is cheap: the concurrency group serializes them
      # and the second finds the work already done. An absent mirror run is
      # what silently shipped nothing on 2026-08-21.
      - name: Trigger release mirror (tag builds only)
        if: startsWith(github.ref, 'refs/tags/v')
        # shell: bash is REQUIRED here and is not decoration. This file's steps
        # default to pwsh, and the body below was lifted from build-mac.yml,
        # where bash is the default. Without this line pwsh parses `--repo` as a
        # unary operator and the step dies with:
        #   ParserError: Missing expression after unary operator '--'
        # v0.0.0-rc.2 shipped exactly that: the release published and the mirror
        # dispatch immediately failed.
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          TAG="${GITHUB_REF#refs/tags/}"
          gh workflow run mirror-release.yml \
            --repo "$GITHUB_REPOSITORY" \
            --ref "$(gh api "repos/$GITHUB_REPOSITORY" --jq .default_branch)" \
            -f tag="$TAG" \
            -f dry_run=false
          echo "mirror-release.yml 를 tag=$TAG dry_run=false 로 디스패치했다 (windows)."
