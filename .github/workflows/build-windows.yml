name: Build Windows

on:
  workflow_dispatch:
    inputs:
      ref:
        description: "Branch or tag to build"
        required: false
        default: ""
  push:
    tags:
      - "v*"

jobs:
  build-win:
    runs-on: windows-2022
    timeout-minutes: 120

    env:
      OS_NAME: windows
      VSCODE_ARCH: x64
      VSCODE_QUALITY: stable
      CI_BUILD: "yes"
      SHOULD_BUILD: "yes"
      SHOULD_BUILD_REH: "no"
      SHOULD_BUILD_REH_WEB: "no"
      SHOULD_BUILD_MSI: "no"
      SHOULD_BUILD_MSI_NOUP: "no"
      SHOULD_BUILD_CLI: "no"
      DISABLE_UPDATE: "yes"
      VSCODE_PUBLISH_COUNTER: 0
      NODE_OPTIONS: "--max-old-space-size=12288"
      npm_config_arch: x64
      npm_config_target_arch: x64

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.ref || github.ref_name }}
          submodules: recursive
          fetch-depth: 0

      - name: Verify vscodium-base submodule
        shell: bash
        run: |
          set -euo pipefail
          git submodule status --recursive
          test -d vscodium-base/icons/stable
          test -f vscodium-base/build.sh

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: "22.x"

      - name: Setup Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install jq
        run: choco install jq -y

      - name: Provision build env
        shell: bash
        run: |
          set -euo pipefail
          # hypeproof-studio.env is gitignored for local secrets. CI uses the
          # committed, secret-free defaults and overrides the Windows target in
          # the workflow env above.
          if [ ! -f hypeproof-studio.env ]; then
            cp hypeproof-studio.env.example hypeproof-studio.env
          fi

      - name: Load HypeProof env
        shell: bash
        run: |
          set -euo pipefail
          # shellcheck source=/dev/null
          source ./hypeproof-studio.env
          # The committed example defaults to macOS; keep this workflow's target
          # explicit after sourcing.
          export OS_NAME="windows"
          export VSCODE_ARCH="x64"
          export VSCODE_QUALITY="${VSCODE_QUALITY:-stable}"
          export CI_BUILD="yes"
          # Re-export to GITHUB_ENV so subsequent steps see them
          {
            echo "APP_NAME=$APP_NAME"
            echo "APP_NAME_LC=$APP_NAME_LC"
            echo "BINARY_NAME=$BINARY_NAME"
            echo "ORG_NAME=$ORG_NAME"
            echo "ASSETS_REPOSITORY=$ASSETS_REPOSITORY"
            echo "GH_REPO_PATH=$GH_REPO_PATH"
            echo "HPS_NAME_SHORT=$HPS_NAME_SHORT"
            echo "HPS_NAME_LONG=$HPS_NAME_LONG"
            echo "HPS_APPLICATION_NAME=$HPS_APPLICATION_NAME"
            echo "HPS_DATA_FOLDER_NAME=$HPS_DATA_FOLDER_NAME"
            echo "HPS_DARWIN_BUNDLE_ID=$HPS_DARWIN_BUNDLE_ID"
            echo "HPS_URL_PROTOCOL=$HPS_URL_PROTOCOL"
            echo "HPS_WIN32_DIR_NAME=$HPS_WIN32_DIR_NAME"
            echo "HPS_WIN32_NAME_VERSION=$HPS_WIN32_NAME_VERSION"
            echo "HPS_WIN32_MUTEX_NAME=$HPS_WIN32_MUTEX_NAME"
            echo "HPS_WIN32_APP_USER_MODEL_ID=$HPS_WIN32_APP_USER_MODEL_ID"
            echo "HPS_WIN32_REG_VALUE_NAME=$HPS_WIN32_REG_VALUE_NAME"
            echo "OS_NAME=$OS_NAME"
            echo "VSCODE_ARCH=$VSCODE_ARCH"
            echo "VSCODE_QUALITY=$VSCODE_QUALITY"
            echo "CI_BUILD=$CI_BUILD"
          } >> "$GITHUB_ENV"

      - name: Resolve release version
        shell: bash
        # On a tag build, the tag (v0.1.10) is the version source of truth and
        # must reach product.json + the bundled extension's package.json (#206).
        # Untagged builds fall back to the extension package.json version inside
        # resolve-version.sh.
        run: |
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            echo "HPS_VERSION=${GITHUB_REF#refs/tags/v}" >> "$GITHUB_ENV"
            echo "Tag build → HPS_VERSION=${GITHUB_REF#refs/tags/v}"
          else
            echo "Untagged build → HPS_VERSION unset, falling back to extension package.json"
          fi

      - name: Install brand assets
        shell: bash
        run: bash scripts/install-brand-assets.sh

      - name: Build icons
        shell: bash
        working-directory: vscodium-base
        run: bash icons/build_icons.sh

      - name: Fetch VS Code source
        shell: bash
        working-directory: vscodium-base
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -eo pipefail
          . ./get_repo.sh
          . ./version.sh

      - name: Prepare VS Code source
        shell: bash
        working-directory: vscodium-base
        run: |
          set -euo pipefail
          bash prepare_vscode.sh

      - name: Apply product.json overrides
        shell: bash
        working-directory: vscodium-base
        run: bash ../scripts/apply-product-overrides.sh

      - name: Inject hypeproof-chat
        shell: bash
        run: bash scripts/inject-builtin-extensions.sh

      - name: Limit extension bundle concurrency
        shell: bash
        env:
          HPS_EXTENSION_BUNDLE_CONCURRENCY: "2"
        run: node scripts/limit-vscode-extension-build-concurrency.mjs

      - name: Compile Windows source
        shell: bash
        working-directory: vscodium-base
        run: |
          set -euo pipefail
          cd vscode
          export NODE_OPTIONS="--max-old-space-size=8192"
          export VSCODE_PUBLISH_COUNTER=1
          npm run gulp vscode-min-prepack

      - name: Package Windows
        shell: bash
        working-directory: vscodium-base
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          find vscode -type f -not -path "*/node_modules/*" -not -path "vscode/.build/node/*" -not -path "vscode/.git/*" > vscode.txt
          echo "vscode/.build/extensions/node_modules" >> vscode.txt
          echo "vscode/.git" >> vscode.txt
          tar -czf vscode.tar.gz -T vscode.txt
          rm -rf vscode
          bash build/windows/package.sh
          bash prepare_assets.sh

      - name: Locate artifacts
        id: artifacts
        shell: bash
        working-directory: vscodium-base
        run: |
          set -euo pipefail
          shopt -s nullglob
          mkdir -p ../dist
          while IFS= read -r -d '' f; do
            cp -v "$f" ../dist/
          done < <(find . -maxdepth 4 -type f \( -name '*.exe' -o -name '*.zip' \) -print0)
          ls -la ../dist || true
          if ! find ../dist -type f \( -name '*.exe' -o -name '*.zip' \) | grep -q .; then
            echo "::error::Windows build produced no .exe or .zip artifacts"
            exit 1
          fi

      - name: Smoke portable Windows build
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"

          $zip = Get-ChildItem -Path dist -Filter "HypeProof Studio-win32-x64-*.zip" | Select-Object -First 1
          if (-not $zip) {
            throw "Portable Windows zip artifact was not found in dist/"
          }

          $smokeRoot = Join-Path $env:RUNNER_TEMP "hps-smoke"
          if (Test-Path $smokeRoot) {
            Remove-Item -Recurse -Force $smokeRoot
          }
          New-Item -ItemType Directory -Path $smokeRoot | Out-Null
          Expand-Archive -Path $zip.FullName -DestinationPath $smokeRoot -Force

          $productPath = Join-Path $smokeRoot "resources/app/product.json"
          if (-not (Test-Path $productPath)) {
            throw "resources/app/product.json was not found in portable zip"
          }

          $product = Get-Content $productPath -Raw | ConvertFrom-Json
          if ($product.nameShort -ne "HypeProof Studio") {
            throw "Unexpected nameShort: $($product.nameShort)"
          }
          if ($product.applicationName -ne "hypeproof-studio") {
            throw "Unexpected applicationName: $($product.applicationName)"
          }
          if ($product.win32DirName -ne "HypeProof Studio") {
            throw "Unexpected win32DirName: $($product.win32DirName)"
          }
          if ($product.win32AppUserModelId -ne "HypeProofLab.HypeProofStudio") {
            throw "Unexpected win32AppUserModelId: $($product.win32AppUserModelId)"
          }

          $extensionPath = Join-Path $smokeRoot "resources/app/extensions/hypeproof-chat/package.json"
          if (-not (Test-Path $extensionPath)) {
            throw "hypeproof-chat built-in extension was not bundled"
          }

          $exe = Join-Path $smokeRoot "HypeProof Studio.exe"
          if (-not (Test-Path $exe)) {
            throw "HypeProof Studio.exe was not found in portable zip"
          }

          $args = @(
            "--user-data-dir", (Join-Path $env:RUNNER_TEMP "hps-user-data"),
            "--extensions-dir", (Join-Path $env:RUNNER_TEMP "hps-extensions"),
            "--disable-extensions",
            "--disable-gpu",
            "--no-sandbox"
          )

          $proc = Start-Process -FilePath $exe -ArgumentList $args -PassThru
          Start-Sleep -Seconds 20
          $proc.Refresh()
          if (-not $proc.HasExited) {
            Stop-Process -Id $proc.Id -Force
            Write-Host "HypeProof Studio.exe launched and stayed alive for 20 seconds."
            exit 0
          }
          if ($proc.ExitCode -ne 0) {
            throw "HypeProof Studio.exe exited early with exit code $($proc.ExitCode)"
          }

          Write-Host "HypeProof Studio.exe exited cleanly during launch smoke."

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: hypeproof-studio-windows-x64
          path: dist/
          if-no-files-found: error
          retention-days: 14
