name: deploy-worker

on:
  workflow_dispatch:
    inputs:
      ref:
        description: "Branch, tag, or SHA to deploy"
        required: false
        default: "main"
      dry_run:
        description: "Run tests/typecheck but skip wrangler deploy"
        type: boolean
        default: true
      verify_prod:
        description: "Run scripts/verify-prod.sh after deploy"
        type: boolean
        default: true
      # dag.yaml task D / #676. Explicit, and never a default — the whole
      # point is that deploying over a live class has to be a decision
      # somebody made on purpose and left a record of.
      override_live_session:
        description: "Deploy even if a class is live (recorded in the job summary)"
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: deploy-worker-production
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      HPS_ADMIN_PASSWORD: ${{ secrets.HPS_ADMIN_PASSWORD }}
      PROD: https://api.hypeproof-ai.xyz
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref }}
          # Full history + tags — task C's version resolution below needs
          # `git describe --tags` to see w* tags, which the default shallow
          # (depth-1, no-tags) checkout would hide.
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: worker/package-lock.json

      - name: Install worker dependencies
        working-directory: worker
        run: npm ci

      - name: Worker smoke tests
        working-directory: worker
        run: npm test

      - name: Worker typecheck
        working-directory: worker
        run: npm run typecheck

      - name: Dry-run stop
        if: inputs.dry_run
        run: echo "dry_run=true; skipping wrangler deploy"

      # Task C (docs/plan/dag.yaml, worker/wrangler.toml) — Service-layer
      # release identifier, tag prefix w* (e.g. w2026.09.04-1). Deliberately
      # separate from scripts/resolve-version.sh, which resolves the App (v*)
      # version off a different tag train. An exact w* tag on HEAD wins;
      # anything else (a branch/SHA dispatch) still yields a real,
      # non-empty identifier so the fallback path stays exercised in CI too —
      # the runtime "unknown" (src/index.ts resolveWorkerVersion) is reserved
      # for the var being unset entirely (e.g. local wrangler dev).
      - name: Resolve worker version
        id: version
        run: |
          set -euo pipefail
          tag="$(git describe --tags --exact-match 2>/dev/null || true)"
          if [[ "$tag" =~ ^w[0-9] ]]; then
            version="$tag"
          else
            version="w0.0.0-dev+$(git rev-parse --short HEAD)"
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "Resolved worker version: $version"

      # dag.yaml task D (#676) — the live-class deploy freeze.
      #
      # 2026-08-22: #668 deployed one hour into a live class. The rule against
      # that existed only in prose, so nothing enforced it. This step asks the
      # worker — which already tracks every cohort's ActiveSession — instead of
      # maintaining a second calendar that only one of the two ever gets
      # updated.
      #
      # Placed AFTER "Resolve worker version" on purpose: the override record
      # carries task C's version, so afterwards the audit trail answers "what
      # was deployed over a live class", not just "something was".
      #
      # Fails CLOSED — an unreachable API, a rejected credential, an unset
      # secret or a garbage payload all block. Rationale lives in the header of
      # scripts/check-live-sessions.mjs; the short version is that a check
      # which fails open is indistinguishable in the log from a check that
      # passed, so it looks like protection while providing none.
      #
      # Controls: node scripts/test-check-live-sessions.mjs (no class, no
      # deploy, no network).
      - name: Live-session deploy freeze (#676)
        id: freeze
        if: ${{ !inputs.dry_run }}
        env:
          HPS_API_BASE: ${{ env.PROD }}
          HPS_FREEZE_OVERRIDE: ${{ inputs.override_live_session }}
          HPS_FREEZE_CONTEXT: >-
            worker ${{ steps.version.outputs.version }} from
            ${{ inputs.ref }} @ ${{ github.sha }}, dispatched by ${{ github.actor }}
        run: node scripts/check-live-sessions.mjs

      - name: Deploy Worker
        if: ${{ !inputs.dry_run }}
        working-directory: worker
        env:
          WORKER_VERSION: ${{ steps.version.outputs.version }}
        run: |
          set -euo pipefail
          [[ -n "${CLOUDFLARE_API_TOKEN:-}" ]] || { echo "::error::CLOUDFLARE_API_TOKEN is required"; exit 1; }
          npx wrangler deploy --var "HPS_WORKER_VERSION:${WORKER_VERSION}"

      - name: Verify production
        if: ${{ !inputs.dry_run && inputs.verify_prod }}
        run: bash scripts/verify-prod.sh

      # #406 — verify-prod.sh never makes a real model call (its chat layer
      # needs a TOKEN it has no way to mint), so a deploy could green-light a
      # gateway that 400s every agent-sdk turn. This step opens a short session
      # on the CANARY cohort (empty roster, console-hidden), replays the Agent
      # SDK's real request shape against the live upstream, and closes it again.
      # Skips itself when the admin secret is absent.
      - name: SDK request-shape contract (R7)
        if: ${{ !inputs.dry_run && inputs.verify_prod }}
        env:
          # Least-privilege credential: an issuer scoped to the canary cohort +
          # profile only. Falls back to the job-level HPS_ADMIN_PASSWORD when
          # absent, and skips (exit 0) when neither is configured — see #412.
          HPS_CANARY_ISSUER: ${{ secrets.HPS_CANARY_ISSUER }}
        run: bash scripts/run-sdk-contract.sh
