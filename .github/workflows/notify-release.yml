# Discord notification on release published.
#
# Listens to GH's native release.published event — fires AFTER build-mac.yml
# (or build-windows.yml) creates the release. Single-purpose workflow so we
# never accidentally couple Discord availability to the build's success.
#
# Uses the vendored scripts/notify/ module from hypeproof-harness (synced
# via that repo's sync.sh).
#
# SECURITY: every GH expression flows through `env:` (not direct ${{ }}
# textual substitution in the run line). Release bodies are user-controlled
# text — `$(...)` or backticks in the body would otherwise be re-evaluated
# by bash on the runner. Lifting to env vars + referencing as "$VAR" inside
# bash makes the values literal strings.

name: notify-release

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag to notify about (e.g. v0.1.2)"
        required: true

permissions:
  contents: read

concurrency:
  group: notify-release-${{ github.event.release.tag_name || github.event.inputs.tag }}
  cancel-in-progress: false

jobs:
  notify:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    env:
      TAG: ${{ github.event.release.tag_name || github.event.inputs.tag }}
      REPO: ${{ github.repository }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: pip install --quiet httpx jinja2 pyyaml
      - name: Resolve release info
        id: rel
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # All variables here come from env (set above) — no inline ${{ }}
          # in the bash body, so user-controlled release content can't break
          # out via $(...) or backticks.
          R=$(gh release view "$TAG" --json name,body,assets,htmlUrl --repo "$REPO")
          URL=$(echo "$R" | jq -r .htmlUrl)
          COUNT=$(echo "$R" | jq '.assets | length')
          BODY=$(echo "$R" | jq -r .body | head -c 800)
          # Multi-line env passing (heredoc) — bash $(...) results are literal
          # text, no re-evaluation. Setting these on $GITHUB_ENV makes them
          # visible to the next step as $URL / $ASSET_COUNT / $CHANGELOG.
          echo "URL=$URL" >> "$GITHUB_ENV"
          echo "ASSET_COUNT=$COUNT" >> "$GITHUB_ENV"
          {
            echo "CHANGELOG<<__EOF__"
            echo "$BODY"
            echo "__EOF__"
          } >> "$GITHUB_ENV"
      - name: Send notify
        env:
          DISCORD_WEBHOOK_HYPEPROOF_STUDIO: ${{ secrets.DISCORD_WEBHOOK_HYPEPROOF_STUDIO }}
          DISCORD_WEBHOOK_SEDIMENT: ${{ secrets.DISCORD_WEBHOOK_SEDIMENT }}
        run: |
          python scripts/notify/notify.py send release.published \
            --routes config/notify_routes.yaml \
            --data "version=$TAG" \
            --data product=hypeproof-studio \
            --data "url=$URL" \
            --data "asset_count=$ASSET_COUNT" \
            --data "changelog=$CHANGELOG"
