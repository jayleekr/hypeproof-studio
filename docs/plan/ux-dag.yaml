# Execution DAG for the "학습 경험 우선 Studio" plan (SX).
#
# Read by the orchestrator (the overnight session). The orchestrator MUST NOT
# infer ordering. `depends_on` here is the only source of truth for sequence.
#
# Spec: docs/plan/studio-learning-experience.md · Requirements: docs/requirements/studio-learning-experience.md
# Tests: docs/testing/studio-learning-experience.md · Rubric: .claude/evals/STUDIO_UX_EVAL.md
# Governance: .claude/hypeproof/ux/{MASTER_PROMPT,STATE,PROJECT_RULES,AUTONOMY_POLICY,GIT_POLICY}.md
#
# Field contract (same as dag.yaml)
#   layer         v* app | w* service | c* surface | m* module  (vessel-and-modules §1)
#   model         implementer model
#   depends_on    task ids that must be plan:passed first
#   human_gate    non-empty => orchestrator STOPS that task, records it in STATE.md, moves on
#   machine_gate  commands that must exit 0 before any model-judged eval runs
#   control       the planted answer. Gate 2. Written BEFORE implementation.
#   acceptance    prose criteria. Gate 3, judged by a fresh evaluator with the rubric.
#
# Gate order is always: machine_gate -> control -> acceptance.
# Failure classification (from dag.yaml): harness_fixable | harness_undecided | product | spec | flake.
# Rule out the instrument first.

version: 1
spec: docs/plan/studio-learning-experience.md

limits:
  max_attempts_per_task: 3
  stop_on_repeated_identical_failure: 2
  task_wallclock_minutes: 90
  phase_wallclock_hours: 4

# No deploy-touching task exists in this DAG. The deploy freeze check is not needed.

results: {}

tasks:
