    title: "hps-session-design/1에 learning 확장 + 3주차(Underlying magic) 예시"
    layer: m
    model: opus
    issue: null
    depends_on: []
    human_gate: null
    spec_section: "SX-55, SX-56, SX-57, SX-58; design §세션 설계 파일"
    files:
      - worker/src/lib/session-design.ts
      - worker/test/
      - chalk/
    machine_gate:
      - "cd worker && npx tsc --noEmit"
      - "cd worker && npm test"
      - "(cd chalk && npm ci && npm test && npm run typecheck)"
    control:
      description: >-
        The existing validator in worker/src/lib/session-design.ts has a strict
        key allowlist (REQUIRED_KEYS / OPTIONAL_KEYS / STEP_KEYS), so today the
        week-03 example is REJECTED. Write that rejection as a failing test
        first, then add `learning` to OPTIONAL_KEYS and `ui`/`evidence`/`gate`
        to the step allowlist. Do not bump the schema id: required keys do not
        change, so it stays hps-session-design/1.
      positive: "week-03 example with learning{week,mission,completion,observe,never,evidence_types,reflection} => valid; a design without `learning` still valid (today's behaviour byte-for-byte)"
      negative: "learning.completion[].event not in the event kind list => invalid; any numeric score/level key anywhere => invalid; unknown step key => still invalid"
    acceptance:
      - "The six-week content lives only in session design data; no week or mission string is a code constant (SX-56, C9)."
      - "Extends the existing hps-session-design/1 schema through optional keys; no second format and no new schema id (design §세션 설계 파일)."
      - "learning.never[] is present in the example and reachable by the coach prompt path (SX-58)."
      - "Existing authoring fixtures and chalk/src/ui/authoring.html keep working unchanged."
    notes: >-
        Confirmed on origin/main 2026-09-18: worker/src/lib/session-design.ts
        defines SessionDesign with schema "hps-session-design/1", steps
        [{id,title,instructions,hint,acceptance,help?}], and exact-key
        validation. Chalk /authoring edits the same fields and freezes versions
        as m2026.09.18-N. Read both before editing.

