  - id: L
    title: "outbound-blocked turns render as healthy seats — #684 survives on one path"
    layer: w
    model: opus-5
    issue: null
    depends_on: [B]
    human_gate: null   # cleared 2026-09-04 — see `decision` below
    spec_section: "§3"
    files:
      - worker/src/routes/chat.ts
      - worker/src/routes/messages.ts
      - worker/src/lib/analytics.ts
    machine_gate:
      - "cd worker && npx tsc --noEmit && npm test"
    decision: >-
      SETTLED 2026-09-04 by Jay: option (c). Decouple the predicates — bill on
      "were tokens spent", judge health on status.

      This also settles B's open question, which was raised as a separate
      decision and turns out to be the same defect. Under (c) a mid-stream
      interruption IS billed (tokens were genuinely spent upstream) and still
      renders as a failure on the board (status 502). B currently excludes it
      from billing; L reverts that half. Both answers become correct because
      neither has to stand in for the other.

      Consequences L must carry:
        - USAGE_BILLABLE stops meaning "status < 400"
        - mid-stream interruptions return to being billed
        - outbound moderation blocks stop reading as healthy seats
        - both moderation directions get tests; today neither is asserted
    decision_required_was: >-
      `USAGE_BILLABLE = "status < 400"` makes one column answer two unrelated
      questions: "did we spend money" (billing) and "did this turn help the
      student" (the board). Outbound moderation is where they diverge, and the
      two answers conflict. Options:
        (a) outbound block writes a non-200 status, tokens retained on the row.
            Board correct; those genuinely-spent tokens stop being billed.
        (b) leave status 200, add a separate blocked/unusable signal in D1.
            Needs a migration — the only option that keeps both answers right.
        (c) decouple the predicates: bill on "tokens were spent", judge health
            on status. No migration; changes what `USAGE_BILLABLE` means.
      Recommendation: (c). The defect is the conflation, not either value.
    control:
      description: >-
        The planted answer is the seat that must stop being invisible.
      positive: >-
        A turn blocked on the OUTBOUND path is distinguishable, in D1 alone,
        from a turn that completed normally — without consulting Analytics
        Engine, which is not the per-seat ledger.
      negative: >-
        Tokens genuinely spent upstream remain visible in the row and are not
        silently zeroed to make the board look right.
      also: >-
        Inbound and outbound blocks render as the SAME seat state on the board.
        The student experience is identical: "I typed something and the coach
        refused me."
    acceptance:
      - "A seat whose every turn is outbound-blocked does not render as healthy."
      - "The billing answer and the board answer are each independently correct."
      - "Tests pin BOTH moderation directions — today neither is asserted."
    notes: >-
      Found by task B's evaluator, not by review. chat.ts:633 and
      messages.ts:531 call record(mkLog(...)) with the default 200 BEFORE the
      outbound screen, then return 400. Inbound calls recordFailure(400,
      MODERATION_BLOCK).

      Why this is worse than neutral: the outbound-blocked seat emits billable
      200s at a normal cadence, so it looks MORE active than a quiet seat. An
      instructor scanning for red walks straight past a child whose lesson is
      completely broken. That is exactly the failure #684 exists to eliminate,
      surviving on one of the two moderation paths.

      MUST be settled before task G calibrates thresholds, or G will tune
      against data in which one moderation direction is invisible.

  - id: M
    title: "the autonomous task router has never once started the solver"
    layer: v
    model: opus-5
    issue: null
    depends_on: []
    human_gate: >-
      The remedy is a product decision, not an implementation one: fix the
      router, delete it, or accept that a human typing @claude is the real path.
      Do not implement before Jay picks one.
    spec_section: null
    files:
      - .github/workflows/autonomous-task-runner.yml
      - .github/workflows/claude-solver.yml
    machine_gate:
      - "python3 -c \"import yaml; yaml.safe_load(open('.github/workflows/autonomous-task-runner.yml'))\""
    control:
      description: >-
        Third instance of the defect class task K was filed for, found while
        evaluating K. Same mechanism, different pipeline.
      evidence: >-
        autonomous-task-runner.yml routes work using secrets.GITHUB_TOKEN: it
        adds the `solver:ready` label and posts a comment. claude-solver.yml
        fires on exactly `issues: [labeled]` and `issue_comment: [created]` —
        both GITHUB_TOKEN-authored events, therefore both blocked.
        Empirically: across the last 100 claude-solver runs the triggering actor
        is a HUMAN in every single case (jayleekr 44, J3llyBe4n 28, ico1036 11,
        +4 others). Zero runs by github-actions[bot]. The router has never
        started the solver.
      positive: >-
        Whatever remedy is chosen, a routed issue must demonstrably reach the
        solver without a human — or the file must stop claiming it does.
      false_green: >-
        autonomous-task-runner.yml has run exactly ONCE, ever: 2026-06-04T10:15Z,
        workflow_dispatch by jayleekr, conclusion SUCCESS. That success is the
        reason nobody looked — the routing step labels, comments, exits 0, and
        nothing downstream starts. A green run that proves nothing.
      scope_is_narrower_than_it_looks: >-
        Only the `solver` mode is broken. `goal-comment` posts a /goal prompt for
        a human to copy and deliberately contains no @claude, so it was never
        meant to trigger anything; `verify-only` is a jq summary with no event
        dependency. Two of three modes work as designed. The one mode whose
        entire purpose is handoff is the one that cannot hand off.
      why_K_fix_does_not_transfer: >-
        claude-solver.yml has no workflow_dispatch trigger to dispatch to, and
        its `authorize` job reads context.payload.sender.login and requires write
        permission — the guard that stops mass-labeling from burning API budget.
        A workflow_dispatch event has no payload.sender in that shape, so adding
        the trigger makes authorize fail or need its own branch. Fixing this
        means deciding what "authorized" means when the caller is a workflow,
        not a person. Design question, not plumbing.
      sweep_completeness: >-
        Established over all 17 workflow files, two passes: every `on:` block
        parsed to enumerate consumable events, and a producer grep for
        gh issue/pr/release writes, git push/tag, github-script,
        repository_dispatch and workflow run. Eight producer hits, each read.
        Result: two LIVE instances (mirror — fixed by K; solver routing — this
        task) and one LATENT in the Phase 6 upstream-sync placeholder, which is
        still a 14-line stub. claude-solver.yml and main-guard.yml use
        github-script read-only and emit no events.
    acceptance:
      - "No file claims automation it does not have (same rule as K)."
      - "If kept: a routed issue starts the solver, proven by an actual run."
      - "If removed: the removal says why, so it is not rebuilt in six months."
    resolved_2026_09_04: >-
      DECISION: delete the router (Jay).

      One adjacent worry raised during implementation is CLOSED, negatively —
      recorded so nobody "fixes" a working path later. The concern was that
      `.claude/skills/report-ui/file-issue.sh` applies `solver:ready` via
      `gh issue create --label`, and it was unclear whether labelling at
      CREATION time emits `issues: labeled` or folds into `opened`.

      It fires. Issue #669 was created 2026-08-22T03:17:17Z and a claude-solver
      run with event=issues started 03:17:21Z — four seconds later. Across the
      last 100 solver runs the split is issue_comment 45 / issues 55, so both
      human paths work. report-ui's handoff is sound; it uses a personal token,
      so the GITHUB_TOKEN suppression never applied to it.
    priority: >-
      Below K. K was shipping the wrong build to participants; this is an
      unattended path that never ran and has been invoked once in three months.
    cheapest_honest_step: >-
      Costs nothing and closes K's acceptance rule immediately: strip the
      "Routed to Claude Solver" claim from autonomous-task-runner.yml:68 and
      rename the step, so the file stops asserting automation it does not have.
      Do this whether or not the capability is later rebuilt — the false claim
      is the part that caused three months of nobody checking.
    notes: >-
      This is a pattern, not a bad commit, and that is the finding worth acting
      on. The rule was documented CORRECTLY in this repo on 2026-06-04, in
      notify-release-published.yml's header:

        "CI-created releases that use the default GITHUB_TOKEN do not trigger
         recursive release workflows, so operators can use workflow_dispatch"

      #663 contradicted it three months later, and autonomous-task-runner
      contradicts it too. The knowledge existed, was written down, and did not
      travel. A fix that only repairs the two known instances leaves the third
      one to be written next quarter.

      Suggested durable countermeasure (not yet scoped): a CI check that flags
      any workflow whose trigger events can only be raised by GITHUB_TOKEN
      writes elsewhere in the repo. The rule is mechanical and greppable.

  - id: J
    title: "mirror-release publishes prereleases as stable — dev channel leaks"
    layer: v
    model: sonnet-5
    issue: null
    depends_on: [A]
    human_gate: null
    spec_section: "§6 stage 2"
    files:
      - .github/workflows/mirror-release.yml
    machine_gate:
      - "python3 -c \"import yaml; yaml.safe_load(open('.github/workflows/mirror-release.yml'))\""
    control:
      positive: >-
        Mirroring a hyphenated tag creates the mirror release WITH --prerelease,
        so the mirror's /releases/latest does not advertise it.
      negative: >-
        Mirroring a plain vX.Y.Z tag is byte-identical to today's behaviour.
      reuse: >-
        Use scripts/tag-is-prerelease.sh from task A — do not write a second
        copy of the rule. A duplicated classifier is the drift this plan exists
        to prevent.
    acceptance:
      - "mirror-release.yml propagates prerelease status from the source release."
      - "install.sh / install.ps1 / the in-app update banner never see an -rc build."
    notes: >-
      Task A makes -rc invisible in the SOURCE repo. The mirror is a second
      publish path with no prerelease handling (mirror-release.yml:171), and
      install.sh, install.ps1 and updateChecker.ts all read the MIRROR's
      /releases/latest. Without this, A's "dev channel reaches nobody" property
      is false on the path that is actually used today (workflow_dispatch).

  - id: K
    priority: ahead-of-batch-2   # Jay 2026-09-04: a live release defect, not a refactor
    title: "auto-mirror trigger (#663) cannot fire — the v0.1.50 incident can recur"
    layer: v
    model: opus-5
    issue: null
    depends_on: []
    human_gate: >-
      Verifying the fix requires cutting a real tag and watching whether the
      mirror job fires. The orchestrator must not cut a release tag.
    spec_section: null
    files:
      - .github/workflows/mirror-release.yml
      - .github/workflows/build-mac.yml
      - .github/workflows/build-windows.yml
    machine_gate:
      - "python3 -c \"import yaml; yaml.safe_load(open('.github/workflows/mirror-release.yml'))\""
    control:
      description: >-
        The claim to disprove: "releases created with secrets.GITHUB_TOKEN do
        not trigger further workflow runs, so `on: release: [published]` never
        fires for our tag builds."
      evidence_RETRACTED: >-
        The orchestrator's original evidence did not discriminate and should not
        be reused. It argued from "all mirror-release runs are workflow_dispatch,
        none are release". But d83f57c landed 2026-08-20T23:23Z and the newest
        release v0.1.50 published 2026-08-20T16:26Z — the trigger arrived ~7h
        AFTER the last release, and nothing has been released since. That run
        list is exactly what you would see whether the trigger works or not.
        Recorded here rather than deleted: the mistake was reasoning from an
        absence without checking that the absence could distinguish anything.
      evidence: >-
        A natural control in the same repo, verified independently by the
        evaluator against the GitHub API. `notify-release-published.yml` has
        carried the IDENTICAL `release: [published]` trigger since
        2026-06-04T10:31Z, state active, never modified. Since then: 36 releases
        published, 36/36 authored by github-actions[bot] (GITHUB_TOKEN), and
        that workflow's release-event runs = 0 (3 runs total, all dispatch).
        mirror-release.yml itself: 42 runs, all dispatch, 0 release.
        Three months, an active identical trigger, 36 chances, zero firings.
        GitHub documents the rule: with the exception of workflow_dispatch and
        repository_dispatch, GITHUB_TOKEN-triggered events do not create runs.
      positive: >-
        After the fix, a tag build results in a mirror run with event=release
        (or an equivalent path that demonstrably runs without a human).
    acceptance:
      - "Either the release is created with a PAT that can trigger workflows, or the mirror is invoked directly from the tag build, or the auto-claim is removed from the comments."
      - "Whatever is chosen, the file must not claim automation it does not have."
    notes: >-
      #663's stated purpose was to stop a repeat of 2026-08-21, when v0.1.50
      never reached the mirror and install.sh plus the in-app update banner both
      silently reported 'already latest' — a workshop-day hotfix that reached
      nobody. If the trigger cannot fire, that incident is still live AND the
      team believes it is fixed, which is worse than a known gap.
      MIRROR_RELEASE_PAT already exists as a secret; the source-release creation
      in build-mac.yml:338 uses secrets.GITHUB_TOKEN.

