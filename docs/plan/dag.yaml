# Execution DAG for the "vessel and modules" plan.
#
# Read by the orchestrator prompt. The orchestrator MUST NOT infer ordering —
# `depends_on` here is the only source of truth for sequence.
#
# Spec: docs/plan/vessel-and-modules.md  (sections referenced per task)
#
# Field contract
#   layer         v* app | w* service | c* surface | m* module  (spec §1)
#   model         implementer model. sonnet-5 | opus-5 | fable-5-1
#   depends_on    task ids that must be plan:passed first
#   human_gate    non-empty => orchestrator STOPS and reports. It may never
#                 mark this satisfied itself.
#   machine_gate  commands that must exit 0 before any model-judged eval runs
#   control       the planted answer. Gate 2. Written BEFORE implementation.
#   acceptance    prose criteria. Gate 3, judged by a fresh evaluator.
#
# Gate order is always: machine_gate -> control -> acceptance.
# If machine_gate fails, do not spend a model on control/acceptance.

version: 1
spec: docs/plan/vessel-and-modules.md

# Failure classification the evaluator must emit. Rule out `harness` FIRST —
# on the 2026-07-25..27 review, 9 of 9 failures were the instrument, not the
# product (.claude/rules/verification.md rule 6).
classifications:
  # Split after task C's first evaluation. The original taxonomy had one
  # `harness` bucket, which conflated two cases with opposite remedies:
  # a WRONG instrument means a human must decide what the criterion should be,
  # while a MISSING instrument is an unambiguous, cheap retry. Sending the
  # second case to a human stalls the loop for no reason.
  # Split once after task C, then RE-split after task F. The first cut was
  # wrong/missing, which is a description of the SYMPTOM. What actually decides
  # the routing is the REMEDY: do I know what the fix is, or does someone have
  # to decide what the criterion should be? Sort on that.
  harness_fixable: >-
    the criterion is right; the instrument is missing, or its implementation
    does not measure what the criterion says -> the remedy is unambiguous.
    Retry the SAME task with an explicit instruction to repair the instrument
    and leave verified production behaviour alone. Both cases seen so far land
    here: task C shipped correct behaviour with no committed control at all,
    and task F's tamper fixture flipped a base64 character (which decodes to
    the same bytes ~1 time in 16) instead of altering the signature. Routing
    either to a human would have stalled the loop on a one-line fix.
  harness_undecided: >-
    the criterion ITSELF is wrong, or there is no agreement on what it should
    assert -> do NOT touch the product and do NOT guess. Block and ask a human,
    because the answer is a judgement about what "correct" means, not a repair.
  product: implementation is wrong -> retry with failure evidence appended
  spec: requirement was ambiguous -> block, ask human, DO NOT retry
  flake: nondeterministic -> re-run once

# Rule of order, unchanged: rule out the instrument before blaming the product.
# On 2026-07-25..27 the instrument was the cause 9 times out of 9. Running this
# plan, 2 of the 3 non-passing verdicts were instrument faults (C, F) and only
# one was the product (H) — the ratio holds.
#
# Note on direction: F's broken fixture failed TOWARD red. That is the safe
# direction and it is why it was caught at all. An instrument that fails toward
# green reports a false pass and nothing downstream ever questions it.

limits:
  max_attempts_per_task: 3
  # Two identical failures stop the loop regardless of classification.
  stop_on_repeated_identical_failure: 2

# Global precondition checked every tick before any deploy-touching task.
# Same rule as #676: never deploy into a live class.
deploy_freeze_check:
  command: >-
    curl -sf -u "admin:$HPS_ADMIN_PASSWORD" https://api.hypeproof-ai.xyz/admin/stats
    | jq '.live_sessions // 0'
  skip_tasks_when_nonzero: [A, C, D, F, H]

# Durable verdicts. The orchestrator must not hold run state in context —
# a session ends and takes its memory with it. Anything not written here is lost.
# Branches are LOCAL and unpushed; nothing below is merged.
results:
  batch_1_closed: 2026-09-04
  decisions_2026_09_04:
    by: Jay
    L_moderation: "option (c) — decouple billing from health. Also settles B's mid-stream question."
    K_priority: "pull ahead of batch 2 — live release defect"
    merge_to_main: "deferred until all plan work is complete (Jay's decision 4)"
    note: >-
      Because main-merge is deferred, batch 2 cannot branch from main — every
      task would stack on unmerged work and collide. Work proceeds from a LOCAL
      integration branch (plan/integration = deploy-main + A + B + C). That is
      workspace hygiene, not a release: nothing reaches main or origin.
  A:
    verdict: pass
    branch: plan/A-dev-channel
    worktree: .claude/worktrees/agent-a55ba3c0ece4588b5
    attempts: 1
    evidence: >-
      Evaluator mutated the predicate (`*-*) return 0` -> `return 1`) and the
      committed harness then failed — the test exercises production code, not a
      copy of the rule. Workflow lines replayed with `gh` stubbed: -rc tag puts
      --prerelease in argv, plain tag is byte-identical to before.
    spawned: [J, K]
  B:
    verdict: pass
    branch: plan/B-usage-log-status
    worktree: .claude/worktrees/agent-a5819ef2d4020e93a
    attempts: 1
    evidence: >-
      Evaluator reconstructed the parent tree (git archive 473b898), dropped in
      ONLY the new test, and got `0 !== 1` — the control genuinely fails on
      pre-change code. Test imports the production SQL constants rather than
      copies; failure rows seeded with 999 tokens so the billing filter cannot
      pass by accident. d1-accounting.test.mjs byte-unchanged and green.
    spawned: [L]
    open_decision: >-
      Mid-stream interruption is no longer billed. Those tokens WERE spent
      upstream. Row keeps the numbers; only the predicate drops them. Real money
      moves in one direction and nobody asked for that direction.
  C:
    verdict: pass
    branch: plan/C-worker-version
    worktree: .claude/worktrees/agent-ab8890ef7c15d487e
    attempts: 2
    attempt_1: >-
      harness_missing — behaviour correct but the control existed only in a
      scratch file. Also exposed a spec error of mine: the DAG said "health
      payload" while naming `GET /`, which serves html.
    evidence: >-
      Attempt 2 mutation-tested three ways, all killed, including the case that
      passes the positive assertion and fails only the negative. Hardcoded
      `version: "0.1.0"` removed from /v1/health.

# Merge picture, verified by `git merge-tree --write-tree f0b9cea d3b4f1f`
# (base 473b898): exit 1, exactly one conflicted file.
#   worker/src/routes/chat.ts  -> auto-merges CLEAN. Disjoint regions: C edits
#     the ../env import and the GET /health handler; B edits the ../lib/analytics
#     import and eleven hunks at line 348+ inside chat.post(). No shared state,
#     no shared helper; neither test references the other's surface.
#   worker/package.json        -> CONFLICT. Both append to the single-line
#     `test` script. Resolution is concatenation.
#
# MERGE HAZARD, learned the hard way on task F (2026-09-04). Resolving that
# conflict by UNION is wrong, and it fails silently until a suite runs.
#
# Union can only add entries; it cannot represent a DELETION. Task F moved
# instructor-console.test.mjs from worker/test/ to chalk/test/ and correctly
# dropped its line from worker's test script. The union resolution resurrected
# that line, so the merged worker suite invoked a file that no longer existed:
#     Error: Cannot find module .../worker/test/instructor-console.test.mjs
# Both branches were individually green; only the merged tree was broken —
# exactly the class of failure no per-task evaluator can catch.
#
# Correct resolution: take the union of entries, then REMOVE any whose file
# does not exist in the merged tree. Better still, verify by running the suite
# after every merge rather than trusting the resolution. Do this for G, which
# will hit the same conflict.

tasks:
  - id: A
    title: "dev channel — conditional --prerelease flag"
    layer: v
    model: sonnet-5
    issue: null
    depends_on: []
    human_gate: null
    spec_section: "§6 stage 2"
    files:
      - .github/workflows/build-mac.yml
      - .github/workflows/build-windows.yml
    machine_gate:
      - "python3 -c \"import yaml,sys; yaml.safe_load(open('.github/workflows/build-mac.yml'))\""
      - "python3 -c \"import yaml,sys; yaml.safe_load(open('.github/workflows/build-windows.yml'))\""
    control:
      description: >-
        Tag-shape classifier must be exercised without cutting a real tag.
        Extract the prerelease decision into a shell function or a tiny script
        so it can be unit-tested.
      positive: "TAG=v9.9.9-rc.1  => --prerelease present"
      negative: "TAG=v9.9.9       => --prerelease absent"
    acceptance:
      - "A tag containing a hyphen publishes as a GitHub prerelease."
      - "A plain vX.Y.Z tag behaves exactly as before (no behavior change)."
      - "Both mac and windows workflows changed identically."
    notes: >-
      updateCheckerHelpers.ts:169 already skips draft/prerelease, and GitHub's
      /releases/latest excludes prereleases by definition. This flag is the
      only missing piece. Do not touch client code.

  - id: B
