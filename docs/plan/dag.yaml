      THRESHOLDS LIVE HERE, NOT IN THE CLIENT. Task E originally shipped a
      guessed 60s idle cut inside the extension — the one part of it riding the
      slow train, and 4x off ClassAid's 240s. It was removed before release.
      The standing rule (spec §1, "The second question the rule does not ask"):
      a threshold on the slow train is a threshold you cannot calibrate. This
      task owns the cut, derives it from the 2026-08-22 replay, and it lives on
      the 30-second train so a correction costs 30 seconds rather than a
      reinstall on every machine.

