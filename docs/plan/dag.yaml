  - id: D
    title: "enforce the live-session deploy freeze"
    layer: w
    model: opus-5
    issue: 676
    depends_on: [C]
    human_gate: null
    spec_section: "§6 stage 2"
    files:
      - .github/workflows/deploy-worker.yml
      - .github/workflows/build-mac.yml
      - .github/workflows/build-windows.yml
    machine_gate:
      - "python3 -c \"import yaml; yaml.safe_load(open('.github/workflows/deploy-worker.yml'))\""
    control:
      positive: "live_sessions == 0 => step exits 0, deploy proceeds."
      negative: >-
        live_sessions > 0 and override input not set => step exits non-zero with
        a message naming the count.
      also: >-
        override_live_session == true => proceeds, and the override is recorded
        with the worker version from task C.
    acceptance:
      - "Applies to the worker deploy AND to stable app tag builds."
      - "dev-channel (-rc) tags are exempt — they reach nobody."
      - "Override is an explicit workflow input, never a default."
    notes: >-
      #668 shipped one hour into a live class. The worker already knows session
      state (getActiveSession) — ask it, don't maintain a separate calendar.

      BLOCKING PRECONDITION, found 2026-09-04 while verifying D's own
      integrator note. `HPS_ADMIN_PASSWORD` DOES NOT EXIST as a repo secret.
      `gh api .../actions/secrets` returns total_count 8 and it is not among
      them. The implementer flagged a weaker version of this ("if environment
      scoping hides it from the build workflows"); the truth is it was never
      created.

      Consequence: D is fail-closed BY DESIGN and correct to be, so merging it
      as-is would block every worker deploy and every stable tag build on the
      first run — the freeze would query with a credential that does not exist
      and, correctly, refuse. The implementer's control case C ("secret unset
      -> BLOCKED (query_failed)") is not a hypothetical; it is the current
      production state.

      CORRECTION (measured by the evaluator, 2026-09-04). The orchestrator
      first wrote "merging D would block every deploy". That overstated it.
      Measured with the secret unset and an unroutable API base:

        (a) worker deploy      -> BLOCKED exit 1, names the unset secret
        (b) stable tag build   -> BLOCKED exit 1 at the PRE-BUILD gate, in
                                  seconds, before the 1-2h runner
        (c) -rc tag            -> EXIT 0. The exemption decides on the ref
                                  string alone and returns before it ever
                                  execs the checker. No credential touched.
        (d) branch / non-tag   -> exempt, likewise no credential

      So the dev channel is FULLY USABLE with the secret absent, and the
      blast radius is bounded to the stable release path plus worker deploys.
      D is safe to merge into the integration branch now; the secret must exist
      before the first stable release, not before the merge.

      Useful consequence for sequencing: the -rc tag that verifies K and J does
      NOT depend on this secret, so those two human steps are independent and
      can happen in either order.

      Also confirmed: HPS_ADMIN_PASSWORD is already wired at job level in
      deploy-worker.yml:39 (pre-existing, not added by D). Only the
      repo-settings action remains — no code change is needed once it exists.

      Corroborating, and a separate dead automation: admin-session.yml exists
      to open/close a session from CI and hard-fails on an empty
      HPS_ADMIN_PASSWORD (`[ -n "${PW:-}" ] || exit 1`). It has run twice, ever
      — 2026-07-08 and 2026-07-24 — and BOTH FAILED. It has never once worked,
      for the same reason. Fourth instance of an automation that exists,
      appears wired, and cannot run.

