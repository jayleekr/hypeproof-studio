      - "cd worker && npm test"
    control:
      description: >-
        Integration test that forces an upstream 4xx. Today the row is never
        created, so this test MUST fail before the change and pass after.
      positive: >-
        Upstream 4xx => a usage_log row EXISTS with status == the real upstream
        status (not 200) and latency_ms populated.
      negative: >-
        Usage/quota aggregation queries count successes only — a failed row must
        not be billed. d1-accounting.test.mjs holds that contract.
    acceptance:
      - "status column carries the observed upstream status, never a literal."
      - "Failed turns produce a row (tokens may be 0) with a coarse error class."
      - "Accounting queries changed to filter successes; no double-count."
      - "No migration required — the column already exists and is nullable-safe."
    notes: >-
      Production evidence: SELECT status, COUNT(*) FROM usage_log GROUP BY status
      returns 16,564 rows all status=200 across 2026-07-14..2026-08-23.
      This touches the billing ledger. Read worker/test/d1-accounting.test.mjs first.

