<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="820" viewBox="0 0 1280 820" role="img" aria-labelledby="title desc">
<title id="title">Studio 음성 대화 패널 구조 시안</title>
<desc id="desc">실제 구현 화면이 아닌 정적 시안. 왼쪽은 큰 음성 대화 패널, 오른쪽은 결과물 옆의 작은 컨트롤. 두 화면 모두 음소거와 종료를 제공한다.</desc>
<rect width="1280" height="820" fill="#f1f3f0"/>
<g font-family="Arial, sans-serif" fill="#183329">
<text x="48" y="54" font-size="26" font-weight="bold">말로 시작하고, 작업을 보며 이어가기</text>
<text x="48" y="84" font-size="16">구조 시안 · 실제 앱/음성 연결 아님 · 색과 크기는 구현 단계에서 검증</text>
<rect x="40" y="120" width="550" height="650" rx="22" fill="white" stroke="#b9c7c0"/>
<text x="66" y="158" font-size="17">① 버튼으로 여는 큰 대화 패널</text>
<text x="66" y="202" font-size="20" font-weight="bold">수업에서 설정한 AI 이름 · 음성 대화</text>
<text x="465" y="202" font-size="16">축소</text><text x="527" y="202" font-size="16">종료</text>
<circle cx="315" cy="334" r="79" fill="#dceae3"/>
<g stroke="#244f3d" stroke-width="9" stroke-linecap="round">
<path d="M279 327v14 M297 312v44 M315 294v80 M333 316v36 M351 327v14"/>
</g>
<text x="315" y="450" text-anchor="middle" font-size="24" font-weight="bold">듣고 있어요</text>
<text x="315" y="481" text-anchor="middle" font-size="15">움직임은 실제 입력/재생 상태에 연결</text>
<rect x="65" y="516" width="500" height="78" rx="12" fill="#f1f5f2"/>
<text x="82" y="545" font-size="16">나: 이 발표자료의 첫 장을 더 간단하게…</text>
<text x="82" y="573" font-size="14" fill="#586b62">부분 전사 · 아직 확정되지 않음    대화 기록 펼치기</text>
<text x="70" y="626" font-size="15">참조: 발표자료 · 슬라이드 1 · 선택한 revision</text>
<rect x="65" y="650" width="145" height="48" rx="24" fill="#e8eee9"/><text x="138" y="680" text-anchor="middle" font-size="16">음소거</text>
<rect x="220" y="650" width="145" height="48" rx="24" fill="#e8eee9"/><text x="292" y="680" text-anchor="middle" font-size="16">말 멈추기</text>
<rect x="375" y="650" width="190" height="48" rx="24" fill="#183329"/><text x="470" y="680" text-anchor="middle" fill="white" font-size="16">텍스트로 전환</text>
<text x="70" y="737" font-size="14">세션 정보: 실제 음성 모델 · 강의 포함 / 비용 출처</text>
<rect x="620" y="120" width="620" height="650" rx="22" fill="white" stroke="#b9c7c0"/>
<text x="646" y="158" font-size="17">② 축소하고 결과물을 함께 보는 상태</text>
<rect x="646" y="184" width="568" height="335" rx="10" fill="#f5f0e6"/>
<text x="684" y="251" font-size="26" font-weight="bold">발표자료 · 첫 장</text>
<text x="684" y="304" font-size="18">선택한 내용을 보면서 수정 요청</text>
<path d="M684 350h370 M684 390h310 M684 430h345" stroke="#c9c2b1" stroke-width="9"/>
<rect x="646" y="551" width="568" height="105" rx="18" fill="#183329"/>
<text x="666" y="585" font-size="19" fill="white">● 마이크 켜짐 · 듣는 중</text>
<text x="666" y="627" font-size="17" fill="white">음소거                 종료                 펼치기</text>
<text x="646" y="700" font-size="16">축소는 같은 세션 유지 · 종료는 마이크/재생 해제</text>
<text x="646" y="729" font-size="16">컨트롤이 보이지 않으면 일시중지 · 복귀 후 명시 재개</text>
</g></svg>
