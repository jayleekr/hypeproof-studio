<!doctype html><html lang="ko"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>내 수업 · HypeProof</title>
<style>
:root{color-scheme:dark;font:16px/1.65 system-ui;background:#10251f;color:#f1f5ed}*{box-sizing:border-box}body{max-width:840px;margin:auto;padding:24px}h1{font-size:28px}h2{font-size:22px}a{color:#d6f59d}input,button,summary{font:inherit;min-height:44px}input,button{border:1px solid #9ab19f;border-radius:8px;padding:10px;background:#19382e;color:inherit;max-width:100%}input{display:block;width:100%}button{cursor:pointer;margin:12px 8px 12px 0}button:focus-visible,a:focus-visible,summary:focus-visible,input:focus-visible{outline:3px solid #d6f59d;outline-offset:3px}label{display:block}article{border-top:1px solid #9ab19f;margin-top:24px;padding-top:20px}p,pre{white-space:pre-wrap;overflow-wrap:anywhere}small{font-size:14px}summary{cursor:pointer}#status{padding:12px;background:#19382e}nav{display:flex;gap:20px;flex-wrap:wrap}nav a{padding:10px 0}
</style>
<nav aria-label="이동"><a href="/start">강사 안내</a><a href="/sharing">도움 요청·피드백</a></nav>
<h1>내 수업</h1><p>강사가 전달한 참여 코드로 확정된 과제와 확인 기준을 엽니다. 실제 제작은 Studio에서 진행합니다.</p>
<form id="connect"><label for="token">학생 참여 코드</label><input id="token" type="password" autocomplete="off" required><button id="open">수업 열기</button><button id="forget" type="button">연결 지우기</button></form>
<p id="status" role="status">참여 코드를 입력하세요. 코드는 이 화면에서만 사용합니다.</p><main id="lesson" hidden></main>
<script>
const $=id=>document.getElementById(id);let generation=0;
function clear(){generation++;$('lesson').replaceChildren();$('lesson').hidden=true;}
$('token').oninput=()=>{clear();$('status').textContent='참여 코드가 바뀌었습니다. 수업을 다시 여세요.';};
$('forget').onclick=()=>{clear();$('token').value='';$('status').textContent='연결과 수업 내용을 지웠습니다.';};
const node=(tag,text)=>{const n=document.createElement(tag);n.textContent=text;return n;};
$('connect').onsubmit=async e=>{e.preventDefault();clear();const stamp=generation;const token=$('token').value.trim();$('status').textContent='수업을 확인하고 있습니다…';
try{const r=await fetch('/v1/profile',{headers:{authorization:'Bearer '+token},redirect:'error'});if(stamp!==generation)return;
if(!r.ok){const states={401:'참여 코드를 사용할 수 없습니다. 강사에게 새 코드를 요청하세요.',403:'수업 명단이나 권한이 맞지 않습니다. 강사에게 확인하세요.',409:'지정한 강의 버전을 열 수 없습니다. 강사에게 확인하세요.'};throw Error('HTTP '+r.status+' · '+(states[r.status]||'연결에 실패했습니다. 잠시 후 다시 시도하세요.'));}
const data=await r.json();if(stamp!==generation)return;const l=data.lesson;
if(!l){$('status').textContent='이 코드는 강의 버전과 연결되지 않았습니다. 강사에게 수업 작성 화면에서 버전 참여 코드를 발급해 달라고 요청하세요.';return;}
const c=l.content;const area=$('lesson');area.append(node('h2',c.title),node('small','수업 '+l.course_id+' · 버전 '+l.version),node('p','목표: '+c.objective),node('p','대상: '+c.audience+' · '+c.duration_minutes+'분'),node('p','준비: '+(c.prerequisites||'별도 선수 조건 없음')),node('p','시작 자료: '+c.starter));if(c.assistant?.display_name)area.append(node('p','이 수업의 AI 이름: '+c.assistant.display_name+' (AI 도우미)'));
for(const [i,s] of c.steps.entries()){const a=node('article','');a.append(node('h2',(i+1)+'. '+s.title),node('p',s.instructions));const d=node('details','');d.append(node('summary','힌트 보기'),node('p',s.hint||'별도 힌트 없음'));a.append(d,node('p','확인 기준: '+s.acceptance));const b=node('button','Studio에 요청할 내용 복사');b.onclick=async()=>{try{await navigator.clipboard.writeText('수업: '+c.title+' ('+l.version+')\n과제: '+s.instructions+'\n확인 기준: '+s.acceptance+'\n현재 작업을 보존하면서 이 과제를 도와주세요.');$('status').textContent='복사했습니다. Studio 채팅에 붙여넣고 실행하세요.';}catch{$('status').textContent='클립보드에 접근할 수 없습니다. 위 과제와 확인 기준을 직접 선택해 복사하세요.';}};a.append(b);area.append(a);}
area.hidden=false;$('token').value='';$('status').textContent='지정한 버전을 열었습니다. 과제 열람은 실습 완료가 아닙니다. AI 실행 가능 여부는 Studio에서 확인하세요.';
}catch(err){if(stamp===generation)$('status').textContent=err instanceof TypeError?'네트워크 연결을 확인한 뒤 다시 시도하세요.':err.message;}};
</script></html>
