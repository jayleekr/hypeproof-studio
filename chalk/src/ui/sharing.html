<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="referrer" content="no-referrer"><title>강사에게 공유 · HypeProof Chalk</title><style>
:root{font:16px/1.65 system-ui,sans-serif;color-scheme:dark;background:#101318;color:#e8edf4}*{box-sizing:border-box}body{max-width:840px;margin:auto;padding:24px}h1{font-size:1.5rem}h2{font-size:1.15rem}label{display:block;margin:16px 0;font-size:.875rem;color:#bac6d5}input,select,textarea,button{font:inherit;color:inherit;background:#181e27;border:1px solid #536071;border-radius:7px;padding:10px 12px;min-height:44px}input,select,textarea{width:100%;margin-top:5px}textarea{min-height:110px;resize:vertical}input[type=checkbox]{width:22px;height:22px;min-height:22px;margin-right:10px;vertical-align:middle}button{cursor:pointer;margin:5px 10px 5px 0}*:focus-visible{outline:3px solid #82e4ed;outline-offset:3px}.notice{border-left:3px solid #e8c06a;padding:10px 16px;color:#efd7a6}.row{display:grid;grid-template-columns:1fr 1fr;gap:16px}article{border-top:1px solid #536071;padding:18px 0}pre{white-space:pre-wrap;overflow-wrap:anywhere;font:inherit}#status{overflow-wrap:anywhere}button:disabled{opacity:.5}a{color:#8adce0}@media(max-width:520px){body{padding:18px}.row{grid-template-columns:1fr}}
</style></head><body><h1>강사에게 질문·결과물 공유</h1><p class="notice">선택한 내용만 지정한 강사에게 전달합니다. 전체 대화와 개인 파일은 자동으로 수집하지 않습니다. 공유는 언제든 철회할 수 있으며, 만료 뒤에는 열 수 없습니다.</p>
<form id="login"><label>학생 토큰<input id="token" type="password" autocomplete="off" required></label><button>연결</button><button id="logout" type="button">연결 해제</button></form><p id="status" role="status" aria-live="polite">학생 토큰으로 연결하세요.</p>
<form id="share"><div class="row"><label>강사 ID<input id="recipient" required pattern="[a-zA-Z0-9_-]{1,128}" placeholder="강사에게 안내받은 ID"></label><label>공유 목적<select id="kind"><option value="help">도움 요청</option><option value="submission">결과물 제출</option></select></label></div>
<label>공유할 프롬프트<textarea id="prompt" maxlength="8000" placeholder="공유할 질문만 붙여넣으세요"></textarea></label><label>공유할 AI 응답<textarea id="response" maxlength="8000"></textarea></label><label>공유할 실행 기록<textarea id="tool_summary" maxlength="8000" placeholder="오류나 변경한 파일 등 필요한 부분만"></textarea></label><label>결과물 URL<input id="artifact_url" type="url" maxlength="8000"></label><label>변경 이유·검수 내용<textarea id="verification" maxlength="8000"></textarea></label><label>열람 가능 시간<select id="duration"><option value="60">1시간</option><option value="240">4시간</option><option value="1440">24시간</option></select></label><p>학생 토큰이 먼저 만료되면 공유도 함께 만료됩니다. 만료 기록은 정리 작업에서 삭제됩니다. 다운로드·이미 열람한 내용까지 회수할 수는 없습니다.</p><label><input id="consent" type="checkbox" required>위 강사에게 입력한 내용을 공유하는 데 동의합니다. 비밀과 다른 사람의 정보가 없는지 확인했습니다.</label><button id="submit">선택한 내용 공유</button></form>
<h2>내 공유 기록</h2><button id="refresh" type="button">다시 불러오기</button><div id="records">연결 후 확인할 수 있습니다.</div>
<script>
'use strict';const $=id=>document.getElementById(id);let token='',generation=0,pendingId=null;const controllers=new Set();const text=(id,value)=>$(id).textContent=value;const el=(tag,value)=>{const n=document.createElement(tag);n.textContent=value;return n;};
async function api(path='',options={}){const g=generation,c=new AbortController();controllers.add(c);const timeout=setTimeout(()=>c.abort(),15000);try{const r=await fetch('/v1/classroom/shares'+path,{...options,cache:'no-store',signal:c.signal,headers:{authorization:'Bearer '+token,'content-type':'application/json'}});const b=await r.json();if(g!==generation)throw Error('연결이 변경됐습니다.');if(!r.ok)throw Error(r.status===401?'토큰을 확인하세요.':r.status===403?'현재 수업 또는 프로필에서 공유할 수 없습니다.':r.status===409?'기록이 변경됐습니다. 새로고침 후 확인하세요.':b.error?.message||b.error||'요청에 실패했습니다.');return b;}finally{clearTimeout(timeout);controllers.delete(c);}}
async function refresh(){if(!token)return;const g=generation;try{const b=await api();if(g!==generation)return;$('records').replaceChildren();for(const r of b.shares){const card=el('article','');card.append(el('h3',r.kind==='help'?'도움 요청':'결과물 제출'),el('p','강사 '+r.recipient_id+' · 상태 '+({received:'접수',reviewing:'검토 중',answered:'답변 완료 · 확인 대기',resolved:'해결 확인'}[r.status]||r.status)),el('p','만료 '+new Date(r.expires_at*1000).toLocaleString()));if(r.feedback)card.append(el('pre',r.feedback));if(r.next_action)card.append(el('p','다음 조치: '+r.next_action));const withdraw=el('button','공유 철회·삭제');withdraw.onclick=async()=>{try{await api('/'+r.id,{method:'DELETE'});await refresh();text('status','공유를 철회했습니다.');}catch(e){text('status',e.message);}};card.append(withdraw);const auditOutput=el('p','');const audit=el('button','누가 열람했는지 확인');audit.onclick=async()=>{try{const b=await api('/'+r.id+'/audit');auditOutput.textContent=(b.audit.length?b.audit.map(a=>a.actor_id+' · '+new Date(a.at*1000).toLocaleString()).join('\n'):'열람 기록이 없습니다.');}catch(e){text('status',e.message);}};card.append(audit,auditOutput);if(r.status==='answered'){const confirm=el('button','내가 확인했고 해결됐어요');confirm.onclick=async()=>{try{await api('/'+r.id+'/confirm',{method:'POST',body:JSON.stringify({expected_revision:r.revision})});refresh();}catch(e){text('status',e.message);}};card.append(confirm);}$('records').append(card);}if(!b.shares.length)text('records','공유 중인 기록이 없습니다.');}catch(e){if(g===generation){text('records','기록을 불러오지 못했습니다.');text('status',e.message);}}}
function reset(){generation++;for(const c of controllers)c.abort();controllers.clear();token='';pendingId=null;$('share').reset();text('records','연결하지 않았습니다.');}
$('login').onsubmit=e=>{e.preventDefault();reset();token=$('token').value.trim();$('token').value='';text('status','연결 중…');refresh();};$('logout').onclick=()=>{reset();$('token').value='';text('status','연결을 해제했습니다.');};$('refresh').onclick=refresh;
$('share').addEventListener('input',()=>{pendingId=null;});$('share').onsubmit=async e=>{e.preventDefault();if(!token){text('status','학생 토큰으로 먼저 연결하세요.');return;}const g=generation;pendingId??=crypto.randomUUID();const content={};for(const key of ['prompt','response','tool_summary','artifact_url','verification'])content[key]=$(key).value;const body={id:pendingId,recipient_id:$('recipient').value.trim(),kind:$('kind').value,content,consent:$('consent').checked,duration_minutes:Number($('duration').value)};$('submit').disabled=true;try{const r=await api('',{method:'POST',body:JSON.stringify(body)});if(g!==generation)return;pendingId=null;text('status','공유했습니다. 만료 '+new Date(r.expires_at*1000).toLocaleString());$('share').reset();await refresh();}catch(err){if(g===generation)text('status',err.message+' 입력 내용은 유지됩니다.');}finally{$('submit').disabled=false;}};
window.addEventListener('pagehide',reset);
</script></body></html>
