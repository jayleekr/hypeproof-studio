<!doctype html>
<html lang="ko"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Chalk — 수업 작성</title>
<style>
:root{color-scheme:dark;font:16px/1.6 system-ui;background:#0f1115;color:#e6e8eb}body{max-width:900px;margin:auto;padding:24px}*{box-sizing:border-box}a{color:#9abaff}fieldset{border:1px solid #414854;border-radius:8px;padding:16px;margin:20px 0}label{display:block;margin:10px 0}input,textarea,select,button{font:inherit;border:1px solid #566071;border-radius:5px;padding:9px;background:#1a1d24;color:inherit;max-width:100%}input,textarea,select{display:block;width:100%}button{cursor:pointer;margin:5px 4px 5px 0;background:#274873}button:disabled{opacity:.5;cursor:default}textarea{min-height:85px}small{color:#b3bac5}#status{white-space:pre-wrap;padding:14px;background:#1a1d24}pre{white-space:pre-wrap;overflow-wrap:anywhere}summary{cursor:pointer}.row{display:flex;gap:12px;flex-wrap:wrap}.row>*{flex:1;min-width:180px}
</style>
<nav><a href="/console">세션 콘솔</a> · <a href="#support">기능·지원 요청</a></nav>
<h1>수업 작성</h1><p>초안을 편집하고 저장한 뒤, 확정할 내용을 불변 버전으로 남깁니다. 버전 저장은 수업 시작이나 리허설 합격을 의미하지 않습니다.</p>
<fieldset><legend>강사 연결</legend>
<label>강사 토큰<input id="token" type="password" autocomplete="off"></label><small>이 화면 메모리에서만 사용합니다. URL이나 수업 파일에는 포함하지 않습니다.</small>
<div class="row"><label>코호트 ID<input id="cohort" autocomplete="off"></label><label>프로필 ID<input id="profile" autocomplete="off"></label></div>
<button id="forget">토큰 지우기</button>
</fieldset>
<fieldset><legend>초안 선택</legend>
<label>강의 초안 파일 가져오기<input id="import" type="file" accept=".json,application/json"></label>
<label>가져온 강의<select id="courses"><option value="">강의 파일을 선택하세요</option></select></label>
<label>수업 ID<input id="course" autocomplete="off"></label>
<button id="new">새 초안 작성</button><button id="load">저장된 초안 열기</button>
</fieldset>
<p id="status" role="status" aria-live="polite">초안을 선택하세요.</p>
<form id="editor"><fieldset><legend>수업 내용</legend>
<label>제목<input id="title" maxlength="200" required></label>
<label>대상<textarea id="audience"></textarea></label>
<label>시간(분)<input id="duration_minutes" type="number" min="1" max="480" value="120"></label>
<label>목표<textarea id="objective"></textarea></label>
<label>선수 조건<textarea id="prerequisites"></textarea></label>
<label>시작 예제·자료<textarea id="starter"></textarea></label>
<h2>단계</h2><div id="steps"></div><button id="add" type="button">단계 추가</button>
</fieldset><button id="save" type="submit" disabled>초안 저장</button><button id="export" type="button">편집 내용 내보내기</button></form>
<fieldset><legend>불변 버전</legend><label>버전 이름<input id="version" placeholder="m2026.09.06-1"></label>
<button id="freeze" disabled>현재 저장본 버전 고정</button><button id="version-load">버전 확인</button>
<pre id="version-view" aria-live="polite"></pre></fieldset>
<fieldset id="support"><legend>기능·지원 요청</legend>
<label>작업 목적<textarea id="need"></textarea></label><label>필요 날짜<input id="needed" type="date"></label>
<label>참고 링크<input id="reference" type="url" placeholder="https://…"></label>
<label>재현·실제 오류·임시 대안<textarea id="repro"></textarea></label>
<button id="request">GitHub 요청 초안 준비</button><p id="request-status">미접수 — 내용을 준비한 뒤 GitHub에서 직접 제출하세요. 참가자 정보와 인증정보를 넣지 마세요.</p><a id="request-link" hidden target="_blank" rel="noopener noreferrer">GitHub에서 확인하고 제출</a>
</fieldset>
<script>
const $=id=>document.getElementById(id);
const fields=['title','audience','duration_minutes','objective','prerequisites','starter'];
let revision=null,bound=null,dirty=false,busy=false,pending=null,batch=[];
const identity=()=>JSON.stringify(['cohort','profile','course'].map(k=>$(k).value.trim()));
const status=text=>{$('status').textContent=text;};
function controls(){const valid=bound===identity()&&revision!==null&&!busy;$('save').disabled=!valid;$('freeze').disabled=!valid||dirty||revision<1;for(const id of ['load','new','import','courses','version-load','token','cohort','profile','course','version','forget'])$(id).disabled=busy;document.querySelector('#editor fieldset').disabled=busy;}
function changed(){dirty=true;controls();}
function discard(){return !dirty||confirm('저장하지 않은 편집을 바꿀까요? 필요한 내용은 먼저 내보내세요.');}
function scope(){for(const k of ['cohort','profile','course'])if(!/^[a-zA-Z0-9_-]{1,128}$/.test($(k).value.trim()))throw Error('코호트·프로필·수업 ID를 확인하세요.');if(!$('token').value.trim())throw Error('강사 토큰을 입력하세요.');return '/admin/cohorts/'+encodeURIComponent($('cohort').value.trim())+'/authoring/'+encodeURIComponent($('course').value.trim());}
function step(data={id:'step-'+crypto.randomUUID().slice(0,8),title:'',instructions:'',hint:'',acceptance:''}){const f=document.createElement('fieldset');f.className='step';for(const [key,label] of Object.entries({id:'단계 ID',title:'단계 제목',instructions:'안내·실습',hint:'힌트',acceptance:'완료 기준'})){const l=document.createElement('label');l.textContent=label;const e=document.createElement(key==='id'||key==='title'?'input':'textarea');e.dataset.field=key;e.value=data[key]??'';l.append(e);f.append(l);}for(const [label,action] of [['위로',()=>f.previousElementSibling?.before(f)],['아래로',()=>f.nextElementSibling?.after(f)],['삭제',()=>f.remove()]]){const b=document.createElement('button');b.type='button';b.textContent=label;b.onclick=()=>{action();changed();};f.append(b);}$('steps').append(f);}
function content(){return {schema:'hps-session-design/1',...Object.fromEntries(fields.map(k=>[k,k==='duration_minutes'?Number($(k).value):$(k).value])),steps:[...document.querySelectorAll('.step')].map(f=>Object.fromEntries([...f.querySelectorAll('[data-field]')].map(e=>[e.dataset.field,e.value])))};}
function render(c){for(const k of fields)$(k).value=c[k]??(k==='duration_minutes'?120:'');$('steps').replaceChildren();for(const s of c.steps||[])step(s);}
async function call(path,method='GET',body){const r=await fetch(path,{method,redirect:'error',headers:{authorization:'Bearer '+$('token').value.trim(),'content-type':'application/json'},body:body===undefined?undefined:JSON.stringify(body)});const j=await r.json();if(!r.ok){const detail=typeof j.error==='string'?j.error:JSON.stringify(j.error||j);throw Error(`HTTP ${r.status}: ${detail}`+(r.status===409?' — 편집은 보존됐습니다. 내보낸 뒤 저장본을 다시 열어 비교하세요.':''));}return j;}
async function run(fn){if(busy)return;busy=true;controls();try{await fn();}catch(e){status(e.message);}finally{busy=false;controls();}}
$('editor').oninput=changed;
for(const k of ['cohort','profile','course'])$(k).oninput=()=>{controls();status('대상이 바뀌었습니다. 새 초안 또는 저장된 초안을 선택하세요. 현재 편집은 보존됩니다.');};
$('forget').onclick=()=>{$('token').value='';status('토큰을 지웠습니다. 편집 내용은 남아 있습니다.');};
$('new').onclick=()=>run(async()=>{scope();if(!discard())return;render({steps:[]});revision=0;bound=identity();pending=null;dirty=true;status('새 초안 — 아직 저장하지 않았습니다.');});
$('import').onchange=()=>run(async()=>{const f=$('import').files[0];if(!f)return;if(f.size>1024*1024)throw Error('파일은 1 MiB 이하여야 합니다.');const j=JSON.parse(await f.text());const items=j.schema==='hps-authoring-batch/1'?j.courses:[j];if(!Array.isArray(items)||!items.length||items.some(x=>!x.course_id||x.content?.schema!=='hps-session-design/1'||!Array.isArray(x.content.steps)))throw Error('지원하는 강의 초안 파일이 아닙니다.');batch=items;$('courses').replaceChildren(new Option('가져올 강의를 선택하세요',''),...items.map((c,i)=>new Option(c.content.title,String(i))));status('강의를 선택한 뒤 편집하고 저장하세요.');});
$('courses').onchange=()=>{if($('courses').value===''||!discard())return;const c=batch[Number($('courses').value)];$('course').value=c.course_id;render(c.content);revision=0;bound=identity();pending=null;dirty=true;status('가져온 초안 — 새 수업으로만 저장합니다. 기존 ID가 있으면 충돌로 보호합니다.');controls();};
$('load').onclick=()=>run(async()=>{const path=scope();if(!discard())return;const d=await call(path);if(d.profile_id!==$('profile').value.trim())throw Error('저장본의 프로필이 선택한 프로필과 다릅니다.');render(d.content);revision=d.revision;bound=identity();dirty=false;pending=null;status('저장본을 열었습니다. revision '+revision);});
$('add').onclick=()=>{step();changed();};
$('editor').onsubmit=e=>{e.preventDefault();run(async()=>{if(bound!==identity()||revision===null)throw Error('먼저 초안을 선택하세요.');const path=scope();const b={expected_revision:revision,profile_id:$('profile').value.trim(),content:content()};const signature=JSON.stringify([path,b]);if(pending?.signature!==signature)pending={signature,id:crypto.randomUUID()};const d=await call(path,'PUT',{...b,request_id:pending.id});revision=d.revision;dirty=false;pending=null;status('저장했습니다. revision '+revision);});};
$('freeze').onclick=()=>run(async()=>{if(dirty||revision<1||bound!==identity())throw Error('편집을 먼저 저장하세요.');const d=await call(scope()+'/versions/'+encodeURIComponent($('version').value.trim()),'PUT',{expected_revision:revision});$('version-view').textContent=JSON.stringify(d,null,2);status('불변 버전을 저장했습니다. 리허설 미실행 · 수업 비활성');});
$('version-load').onclick=()=>run(async()=>{$('version-view').textContent=JSON.stringify(await call(scope()+'/versions/'+encodeURIComponent($('version').value.trim())),null,2);status('저장된 불변 버전을 확인했습니다. 초안 편집은 유지됩니다.');});
$('export').onclick=()=>{const blob=new Blob([JSON.stringify({course_id:$('course').value.trim(),content:content()},null,2)],{type:'application/json'});const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='course-draft.json';a.click();setTimeout(()=>URL.revokeObjectURL(a.href),1000);};
$('request').onclick=()=>{const url=new URL('https://github.com/jayleekr/hypeproof-studio/issues/new');url.searchParams.set('title','[강의 지원] '+$('course').value.trim());url.searchParams.set('body',`강의 ID: ${$('course').value.trim()}\n목적: ${$('need').value}\n필요 날짜: ${$('needed').value||'미정'}\n참고: ${$('reference').value}\n재현·오류·대안: ${$('repro').value}\n\n담당자: 미정 (접수 후 지정)\n다음 조치: 재현 확인 및 분류\n예상 일정: 미정 (범위 검토 필요)`);$('request-link').href=url.href;$('request-link').hidden=false;$('request-status').textContent='초안 준비됨 · 아직 미접수. GitHub에서 내용을 확인하고 제출한 뒤 해당 이슈에서 상태를 확인하세요.';};
window.addEventListener('beforeunload',e=>{if(dirty){e.preventDefault();e.returnValue='';}});
</script></html>
