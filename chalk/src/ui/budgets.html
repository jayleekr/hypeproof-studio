<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>수업 AI 예산 · HypeProof Chalk</title><style>
:root{color-scheme:dark;font:16px/1.6 system-ui;background:#101c18;color:#eef1e9}*{box-sizing:border-box}body{margin:0}header,main{max-width:1100px;margin:auto;padding:24px}header{border-bottom:1px solid #43564b}h1{font-size:26px;margin:8px 0}h2{font-size:20px}a{color:#d4f783}section,form.editor{border:1px solid #43564b;border-radius:12px;padding:20px;margin:18px 0;background:#18271f}label{display:flex;flex-direction:column;gap:6px}input,select,textarea,button{font:inherit;max-width:100%;border:1px solid #67806b;border-radius:7px;padding:10px;background:#18271f;color:inherit}button{cursor:pointer;background:#d4f783;color:#142018;font-weight:650}button:disabled{opacity:.5;cursor:default}button.secondary{background:#23382c;color:#eef1e9}input:focus-visible,select:focus-visible,button:focus-visible,textarea:focus-visible{outline:3px solid #d4f783;outline-offset:3px}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(210px,1fr));gap:14px}.actions{display:flex;gap:10px;flex-wrap:wrap;margin:16px 0}.metric{padding:12px;border:1px solid #43564b;border-radius:8px}.metric strong{font-size:22px;display:block}.muted,small{color:#bccabd}.error{color:#ffc0ad}code{overflow-wrap:anywhere}.check{display:block}#status{min-height:28px}ul{padding-left:22px}textarea{min-height:90px}@media(max-width:500px){header,main{padding:16px}section,form.editor{padding:14px}}
</style></head><body><header><a href="/manage">← 수업 관리</a><h1>수업 AI 예산</h1><p>배정된 자원 안에서 학생별 상한과 마무리 여유를 조절하세요.</p></header><main>
<form id="connect"><div class="grid"><label>강사 토큰<input id="token" type="password" autocomplete="off" required></label><label>수업 ID<input id="cohort" required pattern="[A-Za-z0-9_.:-]{1,160}"></label></div><div class="actions"><button>연결</button><button type="button" id="disconnect" class="secondary">연결 해제</button><button type="button" id="refresh" class="secondary">새로고침</button></div></form>
<p id="status" role="status" aria-live="polite">담당 수업에 연결해 주세요.</p><p class="muted">표시된 금액은 AI 사용의 정산 기준입니다. 학생이 결제할 금액이나 현금 잔액이 아닙니다. 사용 중인 예약과 미확인 비용은 바로 돌려주지 않습니다.</p><div id="overview"></div>
<form id="editor" class="editor" hidden><h2 id="edit-title">학생 사용 상한</h2><div class="grid"><label>수업 배정<select id="base"></select></label><label>대상 학생<select id="seat"></select></label><label>배분 방식<select id="kind"><option value="cap">공유 예산 안의 사용 상한</option value="allocation">미리 떼어 둔 전용 배정</option></select></label><label>최대 동시 실행<input id="slots" type="number" min="1" max="10000" required></label></div><div id="limits" class="grid"></div><label class="check"><input id="paused" type="checkbox"> 신규 AI 실행 일시정지</label><p id="edit-note" class="muted"></p><div class="actions"><button id="save">저장</button><button id="cancel" type="button" class="secondary">닫기</button></div></form>
<section><h2>예상 소진</h2><p id="forecast">연결 후 확인할 수 있습니다.</p><p class="muted">사용량·구매 등급은 학생의 역량 점수가 아닙니다. 한도에 도달해도 기존 파일과 결과 열람·내보내기는 유지됩니다.</p></section></main>
<script>
const $=id=>document.getElementById(id);let token='',cohort='',view=null,editing=null,generation=0,busy=false;const controllers=new Set();
const text=(id,value)=>{$(id).textContent=value;};const basePath=()=>'/admin/cohorts/'+encodeURIComponent(cohort);
const el=(tag,value,cls)=>{const n=document.createElement(tag);if(value!==undefined)n.textContent=value;if(cls)n.className=cls;return n;};
const names={'tokens:input':'입력 토큰','tokens:output':'출력 토큰','tokens:cache_read':'캐시 읽기 토큰','tokens:cache_write':'캐시 쓰기 토큰','tokens:cache_write:5m':'5분 캐시 토큰','tokens:cache_write:1h':'1시간 캐시 토큰','requests:count':'요청 수','browser:seconds':'브라우저 초','computer:seconds':'컴퓨터 초','execution:seconds':'실행 초','storage:byte-seconds':'저장 byte·초'};
const unit=m=>m.startsWith('currency:')?m.split(':')[1]+' 정산 기준':names[m]||m;
const amount=(n,m)=>m.startsWith('currency:')?(n/1000000).toLocaleString('en-US',{maximumFractionDigits:6}):n.toLocaleString('en-US');
function parseAmount(v,m){if(m.startsWith('currency:')){if(!/^\d+(\.\d{1,6})?$/.test(v))throw Error('금액은 소수점 6자리 이내로 입력하세요.');const [a,b='']=v.split('.');const n=Number(BigInt(a)*1000000n+BigInt(b.padEnd(6,'0')));if(!Number.isSafeInteger(n))throw Error('입력 범위를 초과했습니다.');return n;}const n=Number(v);if(!/^\d+$/.test(v)||!Number.isSafeInteger(n))throw Error('자원은 0 이상의 정수로 입력하세요.');return n;}
async function api(path,method='GET',body){const g=generation,c=new AbortController();controllers.add(c);const t=setTimeout(()=>c.abort(),15000);try{const r=await fetch(path,{method,cache:'no-store',signal:c.signal,headers:{authorization:'Bearer '+token,'content-type':'application/json'},...(body?{body:JSON.stringify(body)}:{})});const d=await r.json();if(g!==generation)throw Error('연결이 변경되었습니다.');if(!r.ok)throw Error(r.status===403?'이 예산에 대한 위임 권한이나 한도가 부족합니다.':r.status===409?'다른 변경이 저장됐습니다. 입력을 보존했으니 현황을 새로 열어 비교해 주세요.':r.status===401?'강사 인증을 확인하세요.':'저장·조회하지 못했습니다. 다시 확인해 주세요.');return d;}finally{clearTimeout(t);controllers.delete(c);}}
function reset(){generation++;for(const c of controllers)c.abort();controllers.clear();token='';view=null;editing=null;busy=false;$('overview').replaceChildren();$('editor').hidden=true;text('forecast','연결 후 확인할 수 있습니다.');}
function button(label,fn){const b=el('button',label);b.type='button';b.onclick=fn;return b;}
function render(){const host=$('overview');host.replaceChildren();text('forecast',view.forecast.reason);text('status','확인 시각 '+new Date(view.as_of).toLocaleString()+(view.truncated?' · 일부만 표시':'') );
 if(!view.budgets.length){host.append(el('p','배정된 AI 예산이 없습니다. 운영자에게 수업 배정을 요청하세요.'));return;}
 for(const b of view.budgets){const card=el('section');card.append(el('h2','수업 배정'+(b.account.paused?' · 일시정지':'')));const metrics=el('div',undefined,'grid');for(const r of b.balances){const n=el('div',undefined,'metric');n.append(el('span',unit(r.meter)),el('strong',amount(r.available,r.meter)+' 사용 가능'),el('small','확인된 사용 '+amount(r.spent,r.meter)+' · 예약 '+amount(r.held,r.meter)+' · 전용 배정 '+amount(r.allocated,r.meter)),el('p','미확인 '+r.unresolved+'건 · 초과 '+amount(r.overrun,r.meter)));metrics.append(n);}card.append(metrics);
 const actions=el('div',undefined,'actions');if(b.can_edit){actions.append(button('학생 배분 추가',()=>edit(b,null)),button('수업 배정 조절',()=>edit(b,b)));}else actions.append(el('p','조회 권한만 있습니다. 예산 조절은 운영자의 별도 위임이 필요합니다.'));card.append(actions);
 for(const child of b.children){const row=el('div');const seat=view.seats.find(s=>s.subject_key===child.account.scope_id);row.append(el('p',(seat?.user_id||'이전 참여자')+' · '+(child.account.kind==='cap'?'공유 사용 상한':'전용 배정')+(child.account.paused?' · 일시정지':'')));for(const r of child.balances)row.append(el('small',unit(r.meter)+' '+amount(r.granted,r.meter)+' / 사용 가능 '+amount(r.available,r.meter)+' '));if(b.can_edit)row.append(button('조절',()=>edit(b,child)));card.append(row);}
 if(b.requests.length){card.append(el('h3','추가 사용 요청'));for(const r of b.requests){const row=el('div');row.append(el('p',r.user_id+' · '+r.note+' · '+(r.state==='pending'?'검토 대기':r.resolution)));if(r.state==='pending'&&b.can_edit){const label=el('label','처리 메모'),input=el('input');input.maxLength=280;label.append(input);row.append(label,button('검토 완료 기록',async()=>{try{await api(basePath()+'/budget-requests/'+encodeURIComponent(r.id),'PUT',{resolution:input.value});await refresh();}catch(e){text('status',e.message);}}));}card.append(row);}}
 host.append(card);}}
async function refresh(){if(!token||busy)return;busy=true;try{view=await api(basePath()+'/budgets');render();}catch(e){view=null;$('overview').replaceChildren();text('status',e.message);}finally{busy=false;}}
function edit(b,target){editing={base:b,target};$('editor').hidden=false;text('edit-title',target?'배정 조절':'학생 배분 추가');$('base').replaceChildren(new Option('현재 수업 배정',b.account.id));$('base').disabled=true;$('seat').replaceChildren(...view.seats.map(s=>new Option(s.user_id,s.subject_key)));$('seat').disabled=!!target;if(target)$('seat').value=target.account.scope_id;$('kind').value=target?.account.kind==='allocation'?'allocation':'cap';$('kind').disabled=!!target;$('slots').value=target?.account.max_concurrent??'';$('paused').checked=target?.account.paused??false;$('paused').disabled=!target;$('limits').replaceChildren();for(const r of target?.balances??b.balances){const l=el('label',unit(r.meter)),input=el('input');input.required=true;input.inputMode='decimal';input.dataset.meter=r.meter;input.value=target?(r.meter.startsWith('currency:')?String(r.granted/1000000):String(r.granted)):'';l.append(input);$('limits').append(l);}text('edit-note','전용 배정은 수업 예산을 미리 확보합니다. 공유 상한은 사용할 때 수업 예산과 함께 확인합니다. 이미 사용·예약한 자원 아래로 줄일 수 없습니다.');$('editor').scrollIntoView({block:'nearest'});$('slots').focus();}
$('connect').onsubmit=e=>{e.preventDefault();reset();token=$('token').value.trim();$('token').value='';cohort=$('cohort').value.trim();refresh();};$('disconnect').onclick=()=>{reset();$('token').value='';text('status','연결을 해제했습니다.');};$('refresh').onclick=refresh;$('cancel').onclick=()=>{$('editor').hidden=true;editing=null;};
$('editor').onsubmit=async e=>{e.preventDefault();if(!editing)return;$('save').disabled=true;try{const limits=Object.fromEntries([...$('limits').querySelectorAll('input')].map(i=>[i.dataset.meter,parseAmount(i.value,i.dataset.meter)]));const max_concurrent=Number($('slots').value);const {base,target}=editing;if(target)await api(basePath()+'/budgets/'+encodeURIComponent(target.account.id),'PUT',{expected_revision:target.account.revision,paused:$('paused').checked,max_concurrent,limits});else await api(basePath()+'/budgets/children','POST',{id:crypto.randomUUID(),parent_id:base.account.id,expected_parent_revision:base.account.revision,kind:$('kind').value,scope_kind:'subject',scope_id:$('seat').value,max_concurrent,limits});$('editor').hidden=true;editing=null;await refresh();}catch(e){text('status',e.message);}finally{$('save').disabled=false;}};
</script></body></html>
