name = "hypeproof-studio-api"
main = "src/index.ts"
compatibility_date = "2026-05-15"
compatibility_flags = ["nodejs_compat"]
account_id = "f1da7073b98021b4117c82a4a219eef0"

# Custom domain mapping — wrangler provisions DNS + cert (zone in this account)
routes = [{ pattern = "api.hypeproof-ai.xyz", custom_domain = true }]

# Workers Logs (default observability — visible in dashboard)
[observability]
enabled = true

# Cron Triggers — see worker/src/index.ts scheduled() dispatcher.
#   */15 * * * *  →  15-min smoke heartbeat (#45 / S-02)
#   0 17 * * *    →  D1 nightly backup to R2 at 02:00 KST (#52 / S-06)
# Cron-only; not exposed via HTTP. Test locally:
#   npx wrangler dev --test-scheduled
#   curl 'http://localhost:8787/__scheduled?cron=*/15+*+*+*+*'
#   curl 'http://localhost:8787/__scheduled?cron=0+17+*+*+*'
[triggers]
crons = ["*/15 * * * *", "0 17 * * *"]

# KV: cohort/session/roster state
# Create:  wrangler kv:namespace create HPS_KV
# Preview: wrangler kv:namespace create HPS_KV --preview
[[kv_namespaces]]
binding = "HPS_KV"
id = "b70e51eb53674732b323484d7c3ed21a"
preview_id = "558f72d8329c40a78b60f0bcb4c64910"

# D1: persistent usage_log, cohorts catalog
# Create: wrangler d1 create hypeproof-studio
# Migrate: wrangler d1 execute hypeproof-studio --file=schema.sql
[[d1_databases]]
binding = "HPS_DB"
database_name = "hypeproof-studio"
database_id = "2427207c-272e-4ecd-9d16-7a1dcc0fc741"

# Analytics Engine: per-request datapoints for usage dashboards
[[analytics_engine_datasets]]
binding = "HPS_ANALYTICS"
dataset = "hypeproof_studio"

# R2: trace turn-body dumps (#9). Only written when
# profile.analytics.log_user_messages=true. Default = OFF for all current
# cohorts incl. children — opt-in per cohort after consent/retention policy.
# Create bucket once:  wrangler r2 bucket create hps-traces
[[r2_buckets]]
binding = "HPS_TRACES"
bucket_name = "hps-traces"

# Bundle .md and .html as static text imports
[[rules]]
type = "Text"
globs = ["**/*.md", "**/*.html"]
fallthrough = true

[vars]
ENVIRONMENT = "production"
# HPS_WORKER_VERSION is deliberately NOT set here. It is the Service-layer
# release identifier (docs/plan/vessel-and-modules.md §1, tag prefix w*, e.g.
# "w2026.09.04-1") and is injected per-deploy by
# .github/workflows/deploy-worker.yml via
# `wrangler deploy --var HPS_WORKER_VERSION:<resolved w* tag>` — a static
# value here would go stale the moment it's set. Unset (local `wrangler dev`,
# or a deploy that isn't tag-triggered) => src/index.ts's
# resolveWorkerVersion() reports "unknown" on GET /, never a crash, never an
# empty string (task C negative control; #206 is the app-side precedent).
# Do NOT fold this into scripts/resolve-version.sh — that resolves the App
# version (v* train, separate release cadence). See task C in dag.yaml.
# Switchable upstream LLM (see resolveProvider in src/env.ts). 3-way peer —
# NOT runtime fallback. Default = "gemini" when GEMINI_API_KEY is set.
# Set to "anthropic" or "openai" (with their key) to switch.
LLM_PROVIDER = "anthropic"
# 세션 로그 미러 목적지 (env.ts GALLERY_LOGS_BASE 주석이 정본). lab 이 같은
# Bearer 토큰을 재검증하고 Supabase `session-logs` 버킷에 적재한다.
GALLERY_LOGS_BASE = "https://hypeproof-ai.xyz"
# CF Workers anycast occasionally lands fetches on HKG, where Anthropic's geo
# policy refuses. Route Anthropic calls through hypeproof-sediment (Fly NRT,
# Tokyo — accepted by Anthropic). Passthrough proxy: same x-api-key, same
# body. Unset to call api.anthropic.com directly.
ANTHROPIC_PROXY_URL = "https://hypeproof-sediment.fly.dev/proxy/anthropic/v1/messages"
# Secrets — production: `wrangler secret put <NAME>`
#   wrangler secret put GEMINI_API_KEY      # default provider key
#   wrangler secret put HPS_SIGNING_SECRET
#   wrangler secret put ANTHROPIC_API_KEY   # when LLM_PROVIDER=anthropic
#   wrangler secret put OPENAI_API_KEY      # when LLM_PROVIDER=openai
# Local dev: put them in worker/.dev.vars (gitignored). Fastest:
#   bash scripts/dev-secrets.sh             # pulls Gemini key from ~/.env

[env.dev]
name = "hypeproof-studio-api-dev"
vars = { ENVIRONMENT = "dev", LLM_PROVIDER = "gemini" }
