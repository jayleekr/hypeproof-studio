<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8" />
  <title>HypeProof Studio — Admin</title>
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <style>
    :root { color-scheme: dark; }
    * { box-sizing: border-box; }
    body { margin: 0; font-family: -apple-system, system-ui, "Helvetica Neue", sans-serif;
           background: #0f0f17; color: #e8e8ef; }
    header { padding: 14px 20px; border-bottom: 1px solid #2a2a3a; display: flex;
             align-items: center; justify-content: space-between; }
    header h1 { font-size: 16px; margin: 0; font-weight: 700; letter-spacing: -0.3px; }
    .pill { font-size: 11px; padding: 2px 8px; border-radius: 10px; background: #2a2a3a; color: #aaa; }
    main { padding: 20px; max-width: 1000px; margin: 0 auto; }
    .cohort { background: #16161f; border: 1px solid #2a2a3a; border-radius: 8px; padding: 16px; margin-bottom: 16px; }
    .cohort h2 { font-size: 14px; margin: 0 0 8px; color: #c5c5d0; }
    .cohort .meta { font-size: 12px; color: #888; margin-bottom: 12px; }
    .session-active { background: #1a3520; border-color: #2a8540; }
    .session-active .pill { background: #2a8540; color: #fff; }
    button { background: #5b5bff; color: #fff; border: 0; border-radius: 5px;
             padding: 7px 14px; cursor: pointer; font-weight: 500; font-size: 13px; margin-right: 6px; }
    button:hover { opacity: 0.85; }
    button.secondary { background: #2a2a3a; }
    button.danger { background: #c0392b; }
    input, select, textarea { background: #1a1a25; color: #e8e8ef; border: 1px solid #333;
                              padding: 6px 10px; border-radius: 4px; font-size: 13px;
                              font-family: inherit; }
    textarea { width: 100%; min-height: 60px; resize: vertical; }
    .row { display: flex; gap: 8px; align-items: center; margin: 6px 0; flex-wrap: wrap; }
    label { font-size: 12px; color: #aaa; margin-right: 6px; }
    .roster { font-family: -apple-system, ui-monospace, monospace; font-size: 12px;
              color: #aaa; padding: 6px 0; }
    .roster .chip { display: inline-block; padding: 2px 8px; margin: 2px; background: #2a2a3a;
                    border-radius: 10px; font-size: 11px; }
    .usage { margin-top: 12px; font-size: 12px; }
    .usage-scroll { overflow-x: auto; }
    .usage-scroll:focus-visible { outline: 2px solid #9292ff; }
    .usage .observation { line-height: 1.65; overflow-wrap: anywhere; }
    .usage table { width: 100%; min-width: 780px; border-collapse: collapse; }
    .usage th, .usage td { text-align: left; padding: 4px 8px; border-bottom: 1px solid #2a2a3a; }
    .usage th { color: #888; font-weight: 500; font-size: 11px; }
    details { margin-top: 8px; }
    summary { cursor: pointer; color: #aaa; font-size: 12px; }
    .toast { position: fixed; bottom: 20px; left: 50%; transform: translateX(-50%);
             background: #1a3520; border: 1px solid #2a8540; padding: 8px 16px;
             border-radius: 6px; font-size: 13px; opacity: 0; transition: opacity 0.2s; }
    .toast.show { opacity: 1; }
    .toast.error { background: #3a1a1a; border-color: #8a3030; }
  </style>
</head>
<body>
  <header>
    <h1>HypeProof Studio — Admin</h1>
    <span id="env-pill" class="pill">…</span>
  </header>
  <main id="root">Loading…</main>
  <div id="toast" class="toast"></div>

  <script>
    const $ = (id) => document.getElementById(id);
    let profiles = [];

    async function api(path, opts) {
      const res = await fetch(path, {
        ...opts,
        headers: { "content-type": "application/json", ...(opts?.headers || {}) },
      });
      if (!res.ok) throw new Error(`${res.status}: ${await res.text()}`);
      return res.json();
    }

    function toast(msg, isErr) {
      const t = $("toast");
      t.textContent = msg;
      t.className = "toast show" + (isErr ? " error" : "");
      setTimeout(() => (t.className = "toast" + (isErr ? " error" : "")), 2500);
    }

    function fmtTime(s) {
      if (!s) return "—";
      const d = new Date(s);
      return d.toLocaleString("ko-KR", { hour12: false });
    }

    const pad2 = (n) => String(n).padStart(2, "0");
    function localDateStr(d = new Date()) {
      return `${d.getFullYear()}-${pad2(d.getMonth() + 1)}-${pad2(d.getDate())}`;
    }
    function localTimeStr(d = new Date()) {
      return `${pad2(d.getHours())}:${pad2(d.getMinutes())}`;
    }
    function defaultStartDate() { return localDateStr(new Date(Date.now() + 5 * 60_000)); }
    function defaultStartTime() { return localTimeStr(new Date(Date.now() + 5 * 60_000)); }
    function defaultDurationHours() { return 8; }

    function cohortCard(c) {
      const isLive = c.session && Date.now() >= Date.parse(c.session.starts_at)
                                && Date.now() <= Date.parse(c.session.ends_at);
      const profilesForCohort = profiles.filter((p) => p.cohort_id === c.id);

      const sessionHtml = c.session
        ? `<div class="meta">
             📅 ${fmtTime(c.session.starts_at)} – ${fmtTime(c.session.ends_at)}
             &nbsp;|&nbsp; profile: ${c.session.profile_id}
             &nbsp;|&nbsp; <span class="pill">${isLive ? "LIVE" : "scheduled"}</span>
           </div>
           <button class="danger" data-act="end" data-cohort="${c.id}">End class</button>`
        : `<div class="meta">No active session.</div>
           <div class="row">
             <label>Profile</label>
             <select id="prof-${c.id}">
               ${profilesForCohort.map((p) => `<option value="${p.id}">${p.display_name}</option>`).join("")}
             </select>
           </div>
           <div class="row">
             <label>Date</label>
             <input id="date-${c.id}" type="date" value="${defaultStartDate()}">
             <label>Start time</label>
             <input id="time-${c.id}" type="time" value="${defaultStartTime()}" step="60">
             <label>Duration (h)</label>
             <input id="dur-${c.id}" type="number" min="0.5" max="24" step="0.5" value="${defaultDurationHours()}" style="width: 70px;">
             <button data-act="start" data-cohort="${c.id}">Start class ▶</button>
             <span id="preview-${c.id}" style="font-size: 11px; color: #888; margin-left: 8px;"></span>
           </div>`;

      const rosterChips = (c.roster_users || []).map((u) => `<span class="chip">${u}</span>`).join("");

      return `
        <div class="cohort ${isLive ? "session-active" : ""}">
          <h2>${c.id}</h2>
          ${sessionHtml}
          <details>
            <summary>Roster (${c.roster_size || 0})</summary>
            <div class="roster">${rosterChips || "<em>empty</em>"}</div>
            <div class="row">
              <textarea id="roster-${c.id}" placeholder="user-ids, one per line or comma-separated"></textarea>
            </div>
            <button data-act="roster" data-cohort="${c.id}">Save roster</button>
          </details>
          <details>
            <summary>최근 사용 기록</summary>
            <div class="usage" id="usage-${c.id}" role="status" aria-live="polite">다시 불러오기를 누르면 최근 기록을 조회합니다.</div>
            <button class="secondary" data-act="load-usage" data-cohort="${c.id}">다시 불러오기</button>
          </details>
        </div>
      `;
    }

    async function loadAll() {
      try {
        const [{ cohorts }, { profiles: profs }] = await Promise.all([
          api("/admin/cohorts"),
          api("/admin/profiles"),
        ]);
        profiles = profs;

        // Hydrate roster_users on each cohort
        for (const c of cohorts) {
          const detail = await api(`/admin/cohorts/${encodeURIComponent(c.id)}`);
          c.roster_users = detail.roster?.users ?? [];
        }
        $("root").innerHTML = cohorts.map(cohortCard).join("") || "<em>no cohorts</em>";
        $("env-pill").textContent = location.hostname.includes("workers.dev") ? "dev" : "prod";
      } catch (err) {
        $("root").textContent = "Error: " + err.message;
      }
    }

    function updatePreview(cohort) {
      const date = $(`date-${cohort}`)?.value;
      const time = $(`time-${cohort}`)?.value;
      const hours = parseFloat($(`dur-${cohort}`)?.value);
      const out = $(`preview-${cohort}`);
      if (!out) return;
      if (!date || !time || !(hours > 0)) { out.textContent = ""; return; }
      const startDate = new Date(`${date}T${time}`);
      if (Number.isNaN(startDate.getTime())) { out.textContent = ""; return; }
      const endDate = new Date(startDate.getTime() + hours * 3600_000);
      const now = Date.now();
      const startedAlready = startDate.getTime() <= now;
      const endedAlready = endDate.getTime() <= now;
      const flag = endedAlready ? " ⚠️ ends in the past" : (startedAlready ? " (starts immediately)" : "");
      out.textContent = `→ ends ${fmtTime(endDate.toISOString())}${flag}`;
      out.style.color = endedAlready ? "#e74c3c" : "#888";
    }

    document.addEventListener("input", (ev) => {
      const id = ev.target.id || "";
      const m = id.match(/^(date|time|dur)-(.+)$/);
      if (m) updatePreview(m[2]);
    });

    document.addEventListener("click", async (ev) => {
      const btn = ev.target.closest("button[data-act]");
      if (!btn) return;
      const act = btn.dataset.act;
      const cohort = btn.dataset.cohort;
      try {
        if (act === "start") {
          const profile = $(`prof-${cohort}`).value;
          const date = $(`date-${cohort}`).value;          // "YYYY-MM-DD" (local)
          const time = $(`time-${cohort}`).value;          // "HH:MM" (local)
          const hours = parseFloat($(`dur-${cohort}`).value);
          if (!date || !time) { toast("Date/time required", true); return; }
          if (!(hours > 0)) { toast("Duration must be > 0", true); return; }
          // `YYYY-MM-DDTHH:MM` (no Z) parses as local time per ECMA-262
          const startDate = new Date(`${date}T${time}`);
          if (Number.isNaN(startDate.getTime())) {
            toast("Invalid date/time", true); return;
          }
          const endDate = new Date(startDate.getTime() + hours * 3600_000);
          if (endDate.getTime() <= Date.now()) {
            if (!confirm(`End time (${fmtTime(endDate.toISOString())}) is already in the past. Start anyway?`)) return;
          }
          await api(`/admin/cohorts/${encodeURIComponent(cohort)}/session`, {
            method: "POST",
            body: JSON.stringify({
              profile_id: profile,
              starts_at: startDate.toISOString(),
              ends_at: endDate.toISOString(),
            }),
          });
          toast("Class started");
          loadAll();
        } else if (act === "end") {
          if (!confirm("End this class now?")) return;
          await api(`/admin/cohorts/${encodeURIComponent(cohort)}/session`, { method: "DELETE" });
          toast("Class ended");
          loadAll();
        } else if (act === "roster") {
          const raw = $(`roster-${cohort}`).value;
          const users = raw.split(/[\s,]+/).map((s) => s.trim()).filter(Boolean);
          await api(`/admin/cohorts/${encodeURIComponent(cohort)}/roster`, {
            method: "POST",
            body: JSON.stringify({ users }),
          });
          toast(`Roster saved (${users.length})`);
          loadAll();
        } else if (act === "load-usage") {
          const box = $(`usage-${cohort}`);
          box.textContent = "최근 사용 기록을 조회하고 있습니다…";
          btn.disabled = true;
          try {
            const { usage, observation: o } = await api(`/admin/cohorts/${encodeURIComponent(cohort)}/usage?limit=30`);
            if (!o || o.scope !== "recent_records" || !Array.isArray(usage)) throw new Error("관측 범위를 확인할 수 없습니다");
            const esc = (v) => String(v ?? "—").replace(/[&<>"']/g, (c) => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
            const t = o.totals;
            const summary = `<div class="observation">
              <p>조회 ${esc(fmtTime(o.fetched_at))} · 최근 ${esc(o.record_count)}개 기록${o.has_older_records ? " · 더 이전 기록 있음" : ""}</p>
              <p>오류 ${esc(o.failed_records)}개 · 오류 중 토큰이 기록된 요청 ${esc(o.failed_with_tokens)}개 · 토큰 0으로 저장된 기록 ${esc(o.zero_token_records)}개 · 수업 세션 연결 없음 ${esc(o.unattributed_session_records)}개</p>
              <p>이 범위의 저장값 — 입력 ${esc(t.tokens_in)} · 출력 ${esc(t.tokens_out)} · 캐시 읽기 ${esc(t.cache_read)} · 캐시 쓰기 ${esc(t.cache_write)}</p>
              <p>원가 미확인 · 전체 사용량의 기록 여부 미확인<br>재시도·늦은 보고·저장 누락이 있을 수 있습니다. 토큰 0은 미보고일 수도 있습니다. 공급자별 필드 의미가 달라 이 합계를 비용·잔여 예산·캐시 적중률로 환산하지 않습니다.</p>
            </div>`;
            const rows = usage.map((u) =>
              `<tr>${[u.user_id,u.model,u.tokens_in,u.tokens_out,u.cache_read,u.cache_write,u.latency_ms,u.status,u.created_at].map(v=>`<td>${esc(v)}</td>`).join("")}</tr>`).join("");
            box.innerHTML = summary + (rows
              ? `<p>표를 좌우로 스크롤하면 모든 항목을 볼 수 있습니다.</p><div class="usage-scroll" tabindex="0" role="region" aria-label="최근 사용 기록 표"><table><thead><tr><th>학생</th><th>기록된 모델</th><th>입력</th><th>출력</th><th>캐시 읽기</th><th>캐시 쓰기</th><th>지연(ms)</th><th>상태</th><th>기록 시각(UTC)</th></tr></thead><tbody>${rows}</tbody></table></div>`
              : "<p>조회된 기록이 없습니다. 실제 사용량이 0이라는 뜻은 아닙니다.</p>");
          } catch (err) {
            box.textContent = "사용 기록을 확인할 수 없습니다. 다시 불러오세요.";
            throw err;
          } finally { btn.disabled = false; }
        }
      } catch (err) {
        toast("Error: " + err.message, true);
      }
    });

    loadAll();
  </script>
</body>
</html>
