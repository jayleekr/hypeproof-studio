<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>%%CLINIC_NAME%% 검색엔진 V1</title>
<style>
  /* Clinical design track — workshop-output preview */
  :root{
    --bg:#fafbfc; --surface:#ffffff; --ink:#1a1f2e; --muted:#4a5568;
    --accent:#1e6091; --accent-soft:#e6f0f7;
    --trust-good:#2ca58d; --trust-warn:#d68910; --trust-bad:#c0392b;
    --border:#e2e8f0; --radius:8px;
    --font:-apple-system,'Apple SD Gothic Neo','Noto Sans KR',sans-serif;
  }
  html,body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--font);
    line-height:1.55;font-size:15px}
  .page{max-width:760px;margin:0 auto;padding:24px 20px}
  header{margin-bottom:20px}
  h1{font-size:20px;margin:0 0 4px;color:var(--accent)}
  .topic{color:var(--muted);font-size:14px}
  .decision{background:var(--accent-soft);border-left:3px solid var(--accent);
    padding:10px 14px;border-radius:0 var(--radius) var(--radius) 0;margin:14px 0 18px;
    font-size:14px;color:var(--ink)}
  .decision b{color:var(--accent)}
  .search{display:flex;gap:8px;margin-bottom:16px}
  .search input{flex:1;font:inherit;padding:10px 12px;border:1px solid var(--border);
    border-radius:var(--radius);background:var(--surface);min-height:44px}
  .search input:focus{outline:2px solid var(--accent);outline-offset:1px;border-color:var(--accent)}
  .search button{font:inherit;font-weight:600;background:var(--accent);color:#fff;
    border:0;border-radius:var(--radius);padding:0 18px;cursor:pointer;min-height:44px}
  .filters{display:flex;flex-wrap:wrap;gap:10px;padding:12px 14px;background:var(--surface);
    border:1px solid var(--border);border-radius:var(--radius);margin-bottom:14px;font-size:14px}
  .filters label{display:inline-flex;align-items:center;gap:6px;cursor:pointer}
  .filters label.disabled{cursor:not-allowed;color:var(--muted);text-decoration:line-through}
  .filters input[type=checkbox]{width:16px;height:16px;accent-color:var(--accent)}
  .filters .help{flex-basis:100%;font-size:12px;color:var(--muted);margin-top:4px}
  .results{list-style:none;padding:0;margin:0}
  .results li{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);
    padding:12px 14px;margin-bottom:10px;display:flex;align-items:flex-start;gap:10px}
  .badge{display:inline-block;font-size:12px;font-weight:600;padding:2px 8px;border-radius:999px;
    color:#fff;white-space:nowrap;flex-shrink:0;margin-top:2px}
  .badge.good{background:var(--trust-good)}
  .badge.warn{background:var(--trust-warn)}
  .badge.bad{background:var(--trust-bad)}
  .result-body{flex:1;min-width:0}
  .result-title{font-weight:600;color:var(--ink);margin-bottom:2px}
  .result-source{font-size:12px;color:var(--muted)}
  .empty{text-align:center;color:var(--muted);padding:30px 0;font-size:14px}
  footer{margin-top:24px;padding-top:16px;border-top:1px solid var(--border);font-size:12px;color:var(--muted)}
  @media (max-width:520px){
    .search{flex-direction:column}.filters{flex-direction:column;gap:8px}
  }
</style>
</head>
<body>
<div class="page">

<header>
  <h1>%%CLINIC_NAME%% 검색엔진 V1</h1>
  <div class="topic">검색 주제: <b>%%SEARCH_TOPIC%%</b></div>
</header>

<div class="decision" aria-label="이 검색이 도와야 하는 결정">
  <b>결정:</b> %%DECISION%%
</div>

<!-- Default sources used as fallback before the model fills them in.
     The previewProvider replaces any remaining %% placeholders before render so
     a partial LLM response still shows a sensible V1. -->
<template id="default-sources">
<li><span class="badge good" data-trust="good">학회</span><div class="result-body"><div class="result-title">대한치과의사협회 — 임플란트 후 운동 가이드</div><div class="result-source">치과의사협회 진료지침 (PDF)</div></div></li>
<li><span class="badge good" data-trust="good">가이드</span><div class="result-body"><div class="result-title">임플란트 술후 권장 일반 안내</div><div class="result-source">대학병원 환자교육자료</div></div></li>
<li><span class="badge warn" data-trust="warn">블로그</span><div class="result-body"><div class="result-title">"임플란트 운동 1주만 쉬면 OK"</div><div class="result-source">개인 블로그 — 보류, 출처 확인 필요</div></div></li>
</template>

<div class="search">
  <label for="q" style="position:absolute;left:-9999px">검색어 입력</label>
  <input id="q" type="search" placeholder="검색어를 입력하세요" autocomplete="off">
  <button id="go" type="button">검색</button>
</div>

<fieldset class="filters" aria-label="출처 신뢰도 필터">
  <label><input type="checkbox" data-trust="good" checked> 학회·대학병원</label>
  <label><input type="checkbox" data-trust="good" checked> 공식 가이드라인</label>
  <label><input type="checkbox" data-trust="warn"> 블로그 (보류)</label>
  <label class="disabled"><input type="checkbox" data-trust="bad" disabled> 광고 (금지)</label>
  <span class="help">우리 병원 검색 규칙: 학회·가이드라인 우선 · 광고는 결과에서 자동 제외.</span>
</fieldset>

<ul class="results" id="results">
  %%SOURCES%%
</ul>

<footer>
  V1 — 원장님께 들이밀기 전 초안입니다. 깨지면 깨진 이유가 우리 병원 검색 규칙이 됩니다.
</footer>

</div>

<script>
(function(){
  const q = document.getElementById('q');
  const go = document.getElementById('go');
  const list = document.getElementById('results');
  const filters = document.querySelectorAll('.filters input[type=checkbox]');

  function applyFilter(){
    const allowed = new Set(
      Array.from(filters).filter(f => f.checked).map(f => f.dataset.trust)
    );
    list.querySelectorAll('li').forEach(li => {
      const trust = li.querySelector('.badge')?.dataset.trust;
      li.style.display = trust && allowed.has(trust) ? '' : 'none';
    });
    if (!list.children.length || list.querySelectorAll('li:not([style*="display: none"])').length === 0){
      // optional: show empty state
    }
  }
  filters.forEach(f => f.addEventListener('change', applyFilter));

  go.addEventListener('click', () => {
    // V1 — 실제 검색 endpoint는 다음 회차에서 연결. 지금은 placeholder.
    if (q.value.trim()) {
      // 코치/사용자가 결과 li를 채워가는 흐름. 검색 호출은 V2에서.
      console.log('search v1 placeholder:', q.value);
    }
  });
  q.addEventListener('keydown', e => { if (e.key === 'Enter') go.click(); });
  applyFilter();
})();
</script>
</body>
</html>
