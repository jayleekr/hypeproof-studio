<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<title>%%TITLE%%</title>
<style>
  html,body{margin:0;height:100%;overflow:hidden;background:#07091a;font-family:-apple-system,'Apple SD Gothic Neo',sans-serif;user-select:none}
  #c{display:block;width:100vw;height:100vh;image-rendering:pixelated;image-rendering:crisp-edges}
  #guest{position:fixed;top:12px;left:12px;right:12px;display:flex;gap:10px;align-items:flex-start;pointer-events:none}
  #guest .face{font-size:34px;line-height:1}
  #guest .bub{background:rgba(255,255,255,.94);color:#222;border-radius:14px;padding:8px 12px;font-size:14px;max-width:70vw;box-shadow:0 2px 8px rgba(0,0,0,.25)}
  #guest .bub b{color:#b8571e}
  #bar{position:fixed;left:0;right:0;bottom:0;padding:10px 14px;background:rgba(0,0,0,.55);backdrop-filter:blur(6px);color:#fff;font-size:15px;text-align:center}
  #bar b{color:#ffd75b}
</style>
</head>
<body>
<canvas id="c"></canvas>
<div id="guest"><div class="face" id="gface"></div><div class="bub" id="gsay"></div></div>
<div id="bar"><b>클릭</b> 또는 <b>탭</b>으로 콩! · <b>스페이스</b>로 시작</div>
<script>
/* ══ CONFIG — 자리표시자. 코치가 처음 채운다. 기본값 = 이 세상의 문제 상태 ═══════ */
const GUEST_EMOJI='%%GUEST_EMOJI%%';   // 🐹
const GUEST_NAME='%%GUEST_NAME%%';     // 햄찌
const GUEST_LINE='%%GUEST_LINE%%';     // 게스트가 자기 세상을 말하는 첫 대사. 예: 텃밭에 두더지가 떼로 나와서 새싹을 다 먹어… 너무 많고 너무 빨라…
const PLAYER='%%PLAYER_EMOJI%%';       // 지켜보는 게스트 (🐹 면 도트 햄스터)
const ITEM_A='%%ITEM_A%%';             // 잡을 것. 문제 세상: 🐭 (도트 두더지)
const ITEM_B='%%ITEM_B%%';             // 잡으면 안 되는 것 (예: 🐝). 없애려면 ''
const SPEED=%%SPEED%%;                 // 나왔다 들어가는 빠르기 1~10 (문제 세상 7)
const RATE=%%RATE%%;                   // 한 번에 몇 마리 1~10 (문제 세상 4)
const GOAL=%%GOAL%%;                   // 몇 마리 잡으면 성공 (기본 15)
const SPECIAL=%%SPECIAL%%;             // 제한 시간(초) 기본 30, 0=무제한
const BG=['%%BG_TOP%%','%%BG_BOT%%'];  // 하늘 위/아래 색. 문제 세상 기본: #7fd0ff/#bfe9ff (맑은 낮)
/* ══ WORLD — 이 세상에 박힌 문제. 화면에 보이고 기계적으로도 작동한다. ═══════════
   아이가 말하면 코치가 뭐든 바꾼다: 플래그를 끄고, 오브젝트를 바꾸고, 새 규칙·새 코드를 넣는다.
   지키는 것 둘 — #guest 말풍선, report() (hp:result + world 동봉). 세상을 바꿨으면 WORLD 값도 맞춰 둔다(게스트가 그걸 본다). */
const WORLD={
  eat:true,       // 못 잡고 들어간 두더지가 새싹을 하나 먹는다 — 새싹이 0이면 끝
  sprouts:5,      // 새싹 개수 (울타리를 치거나 새싹을 늘리면 여기 반영)
  fence:false,    // 울타리 — 있으면 새싹이 안 먹힌다
};
</script>
<script src="engine.js"></script>
<script>
const COLS=3,ROWS=3;let state='title',holes=[],t=0,hit=0,miss=0,sprouts=WORLD.sprouts,pop=[];const SUB=ITEM_A+' '+GOAL+'마리 잡으면 성공!'+(SPECIAL?' ('+SPECIAL+'초)':'');
const stay=Math.max(20,120-SPEED*10),CS=44,GX=PW/2-CS*1.5,GY0=42;
function reset(){holes=Array.from({length:9},()=>({who:'',ttl:0,up:0}));t=0;hit=0;miss=0;sprouts=WORLD.sprouts;pop=[];state='play';say('<b>'+GUEST_NAME+'</b>: 나온다, 나온다!');}
function end(ok){report({w_eat:WORLD.eat,w_sprouts:WORLD.sprouts,hit,miss,goal:GOAL,sprouts,secs:Math.round(t/60),speed:SPEED,atOnce:RATE,time:SPECIAL},ok,hit+'마리',ok?'새싹 지켰다! 🌱 고마워':'',sprouts<=0?'새싹이… 다 먹혔어…':'너무 빨라서 다 놓쳤어…');}
addEventListener('keydown',e=>{if(e.code==='Space'&&state!=='play')reset();});
addEventListener('pointerdown',e=>{if(state!=='play'){reset();return;}const p=toPX(e.clientX,e.clientY);const c=Math.floor((p.x-GX)/CS),r=Math.floor((p.y-GY0)/CS);if(c<0||r<0||c>=COLS||r>=ROWS)return;const h=holes[r*COLS+c];if(!h.who)return;
  if(h.who===ITEM_A){hit++;pop.push({x:GX+(c+.5)*CS,y:GY0+(r+.5)*CS,t:0});}else{miss++;say('<b>'+GUEST_NAME+'</b>: 앗, 그건 아니야!');}h.who='';h.ttl=0;if(hit>=GOAL)end(true);});
function scene(){skyGrad();
  x.fillStyle='#fff';[[40,22],[210,16],[290,30]].forEach(([cx,cy])=>{x.fillRect(cx-14,cy,28,7);x.fillRect(cx-7,cy-5,14,5);});
  x.fillStyle='#6a4a2a';x.fillRect(0,GY0-10,PW,PH);x.fillStyle='#8a6a3a';for(let j=GY0-6;j<PH;j+=8)for(let i=(j/8)%2*4;i<PW;i+=8)x.fillRect(i,j,3,1);
  x.fillStyle='#4f8a2f';x.fillRect(0,GY0-14,PW,5);
  // 새싹 (위 줄)
  for(let i=0;i<sprouts;i++){const sx=PW-130+i*20;x.fillStyle='#2f6a1f';x.fillRect(sx+2,GY0-30,2,10);x.fillStyle='#5fbf3f';x.fillRect(sx-2,GY0-30,4,3);x.fillRect(sx+4,GY0-27,4,3);x.fillStyle='#2f6a1f';x.fillRect(sx-2,GY0-30,1,3);x.fillRect(sx+7,GY0-27,1,3);}
  if(WORLD.fence){x.fillStyle='#8b5a2b';for(let i=4;i<PW;i+=9)x.fillRect(i,GY0-22,3,12);x.fillRect(0,GY0-19,PW,2);x.fillRect(0,GY0-13,PW,2);}
  holes.forEach((h,i)=>{const c=i%COLS,r=Math.floor(i/COLS),cx=GX+(c+.5)*CS,cy=GY0+(r+.5)*CS;x.fillStyle='#2a1a0a';x.beginPath();x.ellipse(cx,cy+8,15,6,0,0,6.3);x.fill();x.fillStyle='#000';x.beginPath();x.ellipse(cx,cy+8,11,4,0,0,6.3);x.fill();
    if(h.who){const up=Math.min(1,h.up/6);if(h.who===ITEM_A){x.save();x.beginPath();x.rect(cx-14,cy-16,28,24+2);x.clip();sprite(S_MOLE,cx-10,cy+8-14*up,{'#':'#2a1a0a','@':'#8a5a2b','o':'#111','w':'#f0d0c0'},2);x.restore();}else emo(h.who,cx,cy-2,18);}});
  pop.forEach(p=>{p.t++;x.fillStyle='#ffe066';x.font='bold 10px sans-serif';x.textAlign='center';x.fillText('콩!',p.x,p.y-p.t);});pop=pop.filter(p=>p.t<20);
  if(PLAYER==='🐹')sprite(S_HAM,PW-38,PH-46,{'#':'#3a2210','@':'#ffb347','o':'#111','w':'#fff'},2);else emo(PLAYER,PW-26,PH-30,20);
}
function loop(){
  if(state==='play'){t++;const active=holes.filter(h=>h.who).length;
    if(active<RATE&&t%Math.max(6,Math.round(stay/2))===0){const free=holes.filter(h=>!h.who);if(free.length){const h=free[Math.floor(Math.random()*free.length)];h.who=(ITEM_B&&Math.random()<0.25)?ITEM_B:ITEM_A;h.ttl=stay;h.up=0;}}
    holes.forEach(h=>{if(h.who){h.ttl--;h.up++;if(h.ttl<=0){if(h.who===ITEM_A&&WORLD.eat&&!WORLD.fence){sprouts--;say('<b>'+GUEST_NAME+'</b>: 앗, 새싹 하나 먹혔어!');}h.who='';}}});
    const secs=Math.round(t/60);if(WORLD.eat&&sprouts<=0)end(false);else if(SPECIAL&&secs>=SPECIAL)end(false);}
  else t++;
  scene();blit();
  if(state==='title')titleHud();else{const secs=Math.round(t/60);txt(ITEM_A+' '+hit+' / '+GOAL+(SPECIAL?'   ⏱ '+Math.max(0,SPECIAL-secs):'')+'   🌱 '+sprouts,48,24,'#ffd75b');if(state==='over')overHud(document.title.startsWith('성공'));}
  requestAnimationFrame(loop);}
loop();
</script>
</body>
</html>
