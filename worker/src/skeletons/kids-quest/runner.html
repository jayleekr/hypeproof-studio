<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<title>%%TITLE%%</title>
<style>
  html,body{margin:0;height:100%;overflow:hidden;background:#07091a;font-family:-apple-system,'Apple SD Gothic Neo',sans-serif;user-select:none}
  #c{display:block;width:100vw;height:100vh;image-rendering:pixelated;image-rendering:crisp-edges}
  #guest{position:fixed;top:12px;left:12px;right:12px;display:flex;gap:10px;align-items:flex-start;pointer-events:none}
  #guest .face{font-size:34px;line-height:1}
  #guest .bub{background:rgba(255,255,255,.94);color:#222;border-radius:14px;padding:8px 12px;font-size:14px;max-width:70vw;box-shadow:0 2px 8px rgba(0,0,0,.25)}
  #guest .bub b{color:#b8571e}
  #bar{position:fixed;left:0;right:0;bottom:0;padding:10px 14px;background:rgba(0,0,0,.55);backdrop-filter:blur(6px);color:#fff;font-size:15px;text-align:center}
  #bar b{color:#ffd75b}
</style>
</head>
<body>
<canvas id="c"></canvas>
<div id="guest"><div class="face" id="gface"></div><div class="bub" id="gsay"></div></div>
<div id="bar"><b>스페이스</b> 또는 <b>화면 탭</b>으로 점프 · 집까지 가자</div>
<script>
/* ══ CONFIG — 자리표시자. 코치가 처음 채운다. 기본값 = 이 세상의 문제 상태 ═══════ */
const GUEST_EMOJI='%%GUEST_EMOJI%%';   // 🐈
const GUEST_NAME='%%GUEST_NAME%%';     // 나비
const GUEST_LINE='%%GUEST_LINE%%';     // 게스트가 자기 세상을 말하는 첫 대사. 예: 골목이 물에 잠겼어… 비는 계속 오고, 통나무가 떠내려와. 집에 못 가겠어…
const PLAYER='%%PLAYER_EMOJI%%';       // 달리는 것 (🐈 면 도트 고양이, 다른 이모지면 그 이모지)
const ITEM_A='%%ITEM_A%%';             // 도착할 곳 (예: 🏠)
const ITEM_B='%%ITEM_B%%';             // 넘어야 하는 것. 문제 세상: 🪵 통나무 (도트). 🧱 이면 벽돌 방벽. 다른 이모지면 그 이모지
const SPEED=%%SPEED%%;                 // 달리는 빠르기 1~10 (기본 4)
const RATE=%%RATE%%;                   // 장애물이 얼마나 자주 1~10 (문제 세상 6)
const GOAL=%%GOAL%%;                   // 몇 개 넘으면 집 (기본 15)
const SPECIAL=%%SPECIAL%%;             // 밝기 0~10 (문제 세상 2 — 어두워서 앞이 안 보임)
const BG=['%%BG_TOP%%','%%BG_BOT%%'];  // 하늘 위/아래 색. 문제 세상 기본: #0b1030/#1c2f63 (비 오는 밤)
/* ══ WORLD — 이 세상에 박힌 문제. 화면에 보이고 기계적으로도 작동한다. ═══════════
   아이가 말하면 코치가 뭐든 바꾼다: 플래그를 끄고, 오브젝트를 바꾸고, 새 규칙·새 코드를 넣는다.
   지키는 것 둘 — #guest 말풍선, report() (hp:result + world 동봉). 세상을 바꿨으면 WORLD 값도 맞춰 둔다(게스트가 그걸 본다). */
const WORLD={
  flood:true,     // 물이 차오른다 — 나비 발까지 오면 잠긴다
  rain:true,      // 비가 내린다
  floodSpeed:1,   // 물 차오르는 빠르기 (0이면 안 올라옴)
  lamps:false,    // 가로등 (켜면 주변이 밝아진다)
  moon:true,      // 초승달
};
</script>
<script src="engine.js"></script>
<script>
const P={far:'#0d1638',mid:'#131f4d',win:'#ffd76a',win2:'#7fd0ff',lamp:'#ffe08a',water:'#2a6fd6',water2:'#4f9dff',foam:'#bfe3ff',rain:'#8fb8ff',ground:'#2a2a44',ground2:'#3b3b5c'};
const bldFar=[],bldMid=[];for(let bx=0;bx<PW*2;){const w=14+Math.floor(rnd()*22),h=40+Math.floor(rnd()*70);bldFar.push({x:bx,w,h,win:Array.from({length:Math.floor(w/5)*Math.floor(h/7)},()=>rnd()<0.45)});bx+=w+2;}
for(let bx=0;bx<PW*2;){const w=20+Math.floor(rnd()*30),h=25+Math.floor(rnd()*45);bldMid.push({x:bx,w,h,win:Array.from({length:Math.floor(w/6)*Math.floor(h/8)},()=>rnd()<0.35)});bx+=w+3;}
const stars=Array.from({length:70},()=>({x:Math.floor(rnd()*PW),y:Math.floor(rnd()*80),b:rnd()}));const rain=Array.from({length:90},()=>({x:rnd()*PW,y:rnd()*PH,s:2+rnd()*2}));
let state='title',py,vy,obs=[],t=0,passed=0,hits=0,water=0,scroll=0;const SUB=(ITEM_B?ITEM_B+' 넘어서 ':'')+ITEM_A+' 까지 '+GOAL+'개 지나면 도착!';
const runSpeed=1+SPEED*0.28,gap=Math.max(28,110-RATE*9),vis=0.25+SPECIAL*0.075,GY=140,CX=60;
function reset(){py=GY;vy=0;obs=[];t=0;passed=0;hits=0;water=0;scroll=0;state='play';say('<b>'+GUEST_NAME+'</b>: 후… 가보자');}
function jump(){if(state!=='play'){reset();return;}if(py>=GY-0.5)vy=-4.6;}
addEventListener('keydown',e=>{if(e.code==='Space')jump();});addEventListener('pointerdown',jump);
function scene(){skyGrad();dither(60,120,'rgba(255,255,255,.06)');
  stars.forEach(s=>{if(Math.floor(t/20+s.b*10)%3!==0){x.fillStyle=s.b>0.7?'#fff':'#9ab';x.fillRect(s.x,s.y,1,1);}});
  if(WORLD.moon){x.fillStyle='#fff3c4';x.beginPath();x.arc(272,26,10,0,6.3);x.fill();x.fillStyle=BG[0];x.beginPath();x.arc(276,23,9,0,6.3);x.fill();}
  bldFar.forEach(b=>{const bx=((b.x-scroll*0.15)%(PW*2)+PW*2)%(PW*2)-PW;if(bx>PW||bx+b.w<0)return;x.fillStyle=P.far;x.fillRect(Math.floor(bx),GY-b.h-30,b.w,b.h+30);let k=0;for(let j=GY-b.h-26;j<GY-34;j+=7)for(let i=2;i<b.w-3;i+=5){if(b.win[k++]&&Math.floor(t/40+k)%7!==0){x.fillStyle=k%3?P.win:P.win2;x.fillRect(Math.floor(bx)+i,j,2,3);}}});
  bldMid.forEach(b=>{const bx=((b.x-scroll*0.4)%(PW*2)+PW*2)%(PW*2)-PW;if(bx>PW||bx+b.w<0)return;x.fillStyle=P.mid;x.fillRect(Math.floor(bx),GY-b.h-8,b.w,b.h+8);let k=0;for(let j=GY-b.h-4;j<GY-12;j+=8)for(let i=3;i<b.w-4;i+=6){if(b.win[k++]){x.fillStyle=P.win;x.fillRect(Math.floor(bx)+i,j,3,4);}}});
  x.fillStyle=P.ground;x.fillRect(0,GY+8,PW,PH-GY-8);x.fillStyle=P.ground2;for(let i=-((scroll)%12);i<PW;i+=12)x.fillRect(i,GY+8,6,2);x.fillStyle='#0a0f2a';x.fillRect(0,GY+2,PW,6);
  if(WORLD.lamps){for(let i=-((scroll*0.4)%110);i<PW;i+=110){x.fillStyle='#3a3a55';x.fillRect(i,GY-40,2,42);x.fillRect(i,GY-40,8,2);x.fillStyle=P.lamp;x.fillRect(i+7,GY-40,3,3);const rg=x.createRadialGradient(i+8,GY-38,2,i+8,GY-38,40);rg.addColorStop(0,'rgba(255,224,138,.35)');rg.addColorStop(1,'rgba(255,224,138,0)');x.fillStyle=rg;x.fillRect(i-35,GY-80,90,90);}}
  if(ITEM_A==='🏠')sprite(S_HOUSE,PW-40,GY-26,{'#':'#3a2a2a','@':'#c85a48','$':'#e8d9b5','o':'#ffd76a'},2);else emo(ITEM_A,PW-22,GY-4,20);
  obs.forEach(o=>{if(o.x>CX+PW*vis+30&&SPECIAL<10)return;if(ITEM_B==='🪵')sprite(S_LOG,o.x-12,GY-8,{'#':'#2a1608','@':'#b8763a'},2);else if(ITEM_B==='🧱')sprite(S_BRICK,o.x-12,GY-8,{'#':'#9a3b2f','.':'#c85a48'},2);else if(ITEM_B)emo(ITEM_B,o.x,GY-2,16);});
  if(PLAYER==='🐈')sprite(S_CAT,CX-16,py-22,{'#':'#14141f','@':'#ffb347','o':'#14141f'},2);else emo(PLAYER,CX,py-2,20);
  if(SPECIAL<10){const dg=x.createLinearGradient(CX+PW*vis*0.5,0,CX+PW*vis+30,0);dg.addColorStop(0,'rgba(3,4,16,0)');dg.addColorStop(1,'rgba(3,4,16,.93)');x.fillStyle=dg;x.fillRect(0,0,PW,PH);}
  if(WORLD.rain){x.fillStyle=P.rain;rain.forEach(r=>{r.y+=r.s*2;r.x-=0.6;if(r.y>PH){r.y=-4;r.x=Math.random()*PW;}x.fillRect(Math.floor(r.x),Math.floor(r.y),1,3);});}
  if(WORLD.flood){const wl=PH-14-water;x.fillStyle=P.water;x.fillRect(0,Math.floor(wl),PW,PH);x.fillStyle=P.water2;for(let i=0;i<PW;i+=6){x.fillRect(i,Math.floor(wl+Math.sin(i/12+t/9)*1.5),4,1);}x.fillStyle=P.foam;for(let i=3;i<PW;i+=17)x.fillRect(i,Math.floor(wl+Math.sin(i/9+t/7)*1.5),2,1);}
}
function loop(){
  if(state==='play'){t++;scroll+=runSpeed;vy+=0.28;py+=vy;if(py>GY){py=GY;vy=0;}
    if(WORLD.flood&&WORLD.floodSpeed>0)water=Math.min(PH*0.5,water+0.012*WORLD.floodSpeed);
    if(ITEM_B&&t%Math.round(gap)===0&&Math.random()<0.7)obs.push({x:PW+20,hit:false});
    for(let i=obs.length-1;i>=0;i--){const o=obs[i];o.x-=runSpeed;if(o.x<-20){obs.splice(i,1);passed++;continue;}if(!o.hit&&Math.abs(o.x-CX)<14&&py>GY-12){o.hit=true;hits++;say('<b>'+GUEST_NAME+'</b>: 아야!');}}
    const wl=PH-14-water;
    if(WORLD.flood&&wl<py-4)report({w_flood:WORLD.flood,passed,goal:GOAL,hits,speed:SPEED,rate:RATE,light:SPECIAL},false,passed+'/'+GOAL,'','콜록… 또 잠겼어. 물이 너무 많아…');
    else if(hits>=3)report({w_flood:WORLD.flood,passed,goal:GOAL,hits,speed:SPEED,rate:RATE,light:SPECIAL},false,passed+'/'+GOAL,'','부딪혀서 못 가겠어… 앞이 안 보여');
    else if(passed>=GOAL)report({w_flood:WORLD.flood,passed,goal:GOAL,hits,speed:SPEED,rate:RATE,light:SPECIAL},true,passed+'/'+GOAL,'집이다! 🏠 이제 젖지 않고 갈 수 있어','');}
  else t++;
  scene();blit();
  if(state==='title')titleHud();else{txt(passed+' / '+GOAL+'   💥 '+hits+'/3',48,24,'#ffd75b');if(state==='over')overHud(document.title.startsWith('성공'));}
  requestAnimationFrame(loop);}
loop();
</script>
</body>
</html>
