<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<title>%%TITLE%%</title>
<style>
  html,body{margin:0;height:100%;overflow:hidden;background:#0d0d1a;font-family:-apple-system,'Apple SD Gothic Neo',sans-serif;user-select:none}
  #c{display:block;width:100vw;height:100vh}
  #guest{position:fixed;top:12px;left:12px;right:12px;display:flex;gap:10px;align-items:flex-start;pointer-events:none}
  #guest .face{font-size:34px;line-height:1}
  #guest .bub{background:rgba(255,255,255,.94);color:#222;border-radius:14px;padding:8px 12px;font-size:14px;max-width:70vw;box-shadow:0 2px 8px rgba(0,0,0,.25)}
  #guest .bub b{color:#b8571e}
  #bar{position:fixed;left:0;right:0;bottom:0;padding:10px 14px;background:rgba(0,0,0,.45);backdrop-filter:blur(6px);color:#fff;font-size:15px;text-align:center}
  #bar b{color:#ffd75b}
</style>
</head>
<body>
<canvas id="c"></canvas>
<div id="guest"><div class="face" id="gface"></div><div class="bub" id="gsay"></div></div>
<div id="bar"><b>스페이스</b> 또는 <b>화면 탭</b>으로 블록 놓기</div>
<script>
/* ══ CONFIG — 자리표시자. 코치가 처음 채운다. 기본값 = 이 세상의 문제 상태 ═══════ */
const GUEST_EMOJI='%%GUEST_EMOJI%%';   // 🐧
const GUEST_NAME='%%GUEST_NAME%%';     // 뽀로
const GUEST_LINE='%%GUEST_LINE%%';     // 게스트가 자기 세상을 말하는 첫 대사. 예: 집이 무너졌어… 얼음을 쌓는데 해가 너무 뜨거워서 쌓는 족족 녹아…
const PLAYER='%%PLAYER_EMOJI%%';       // 옆에서 지켜보는 게스트
const ITEM_A='%%ITEM_A%%';             // 쌓을 것. 문제 세상: 🧊 (녹는다). 예: 🧱 🪨
const ITEM_B='%%ITEM_B%%';             // 완성 지붕 (예: 🏠)
const SPEED=%%SPEED%%;                 // 블록 좌우 빠르기 1~10 (기본 4)
const RATE=%%RATE%%;                   // (미사용)
const GOAL=%%GOAL%%;                   // 몇 층 (기본 8)
const SPECIAL=%%SPECIAL%%;             // 삐뚤어도 봐주는 정도 0~10 (문제 세상 0)
const BG=['%%BG_TOP%%','%%BG_BOT%%'];  // 배경 위/아래 색. 문제 세상 기본: #ffb347/#7fb3d5 (뙤약볕)
/* ══ WORLD — 이 세상에 박힌 문제. 화면에 보이고 기계적으로도 작동한다. ═══════════
   아이가 말하면 코치가 뭐든 바꾼다: 플래그를 끄고, 오브젝트를 바꾸고, 새 규칙·새 코드를 넣는다.
   지키는 것 둘 — #guest 말풍선, report() (hp:result + world 동봉). 세상을 바꿨으면 WORLD 값도 맞춰 둔다(게스트가 그걸 본다). */
const WORLD={
  sun:true,       // ☀️ 가 머리 위 — 얼음이 녹는다
  melt:true,      // 쌓은 블록이 점점 작아진다 (해가 없어지거나 블록이 얼음이 아니면 false 로)
};
/* ══ 엔진 ══════════════════════════════════════════════════════════════ */
const cv=document.getElementById('c'),x=cv.getContext('2d');
let W,H;function fit(){W=cv.width=innerWidth;H=cv.height=innerHeight-46;}fit();onresize=fit;
document.getElementById('gface').textContent=GUEST_EMOJI;
const say=s=>{document.getElementById('gsay').innerHTML=s;};
say('<b>'+GUEST_NAME+'</b>: '+GUEST_LINE);
function bg(){const g=x.createLinearGradient(0,0,0,H);g.addColorStop(0,BG[0]);g.addColorStop(1,BG[1]);x.fillStyle=g;x.fillRect(0,0,W,H);}
function txt(s,y,sz,c,xx){x.fillStyle=c||'#fff';x.font='bold '+sz+'px sans-serif';x.textAlign='center';x.fillText(s,xx==null?W/2:xx,y);}
function report(r,ok,title,okSay,failSay){state='over';r.type='hp:result';r.ok=ok;r.world=Object.assign({},WORLD);r.n=(window.__hpLast?window.__hpLast.n:0)+1;window.__hpLast=r;try{parent.postMessage(r,'*');}catch(e){}document.title=(ok?'성공 ':'실패 ')+title;say('<b>'+GUEST_NAME+'</b>: '+(ok?okSay:failSay));}
const BH=44;let state='title',stack=[],cur,dir,t=0,fell=false;const SUB=ITEM_A+' '+GOAL+'층 쌓으면 완성!';
const sp=1.5+SPEED*0.7,tol=8+SPECIAL*7;
function reset(){stack=[{x:W/2,s:1}];cur={x:60};dir=1;t=0;fell=false;state='play';say('<b>'+GUEST_NAME+'</b>: 빨리 쌓아야 해…');}
function drop(){if(state!=='play'){reset();return;}const last=stack[stack.length-1];if(Math.abs(cur.x-last.x)>tol+BH*0.5*last.s){fell=true;report({layers:stack.length-1,goal:GOAL,fell:true,speed:SPEED,tolerance:SPECIAL},false,(stack.length-1)+'층','','아… 무너졌어. 녹은 얼음 위엔 못 쌓겠어');return;}
  stack.push({x:cur.x,s:1});cur={x:dir>0?60:W-60};dir*=-1;if(stack.length-1>=GOAL)report({layers:GOAL,goal:GOAL,fell:false,speed:SPEED,tolerance:SPECIAL},true,GOAL+'층','우와 집이다! 🏠 이제 안 녹아','');}
addEventListener('keydown',e=>{if(e.code==='Space')drop();});addEventListener('pointerdown',drop);
function loop(){bg();
  if(WORLD.sun){x.font='70px serif';x.textAlign='center';x.fillText('☀️',W/2,90);}
  if(state==='title'){txt('%%TITLE%%',H/2-30,Math.min(56,W/8));txt(SUB,H/2+30,22,'#ffd75b');txt('스페이스바 또는 화면을 누르면 시작',H/2+68,18,'#bbb');}
  else{t++;if(state==='play'){cur.x+=sp*dir;if(cur.x<60||cur.x>W-60)dir*=-1;
      if(WORLD.melt){stack.forEach((b,i)=>{if(i>0)b.s=Math.max(0.15,b.s-0.0015);});const tiny=stack.slice(1).some(b=>b.s<=0.2);if(tiny)report({layers:stack.length-1,goal:GOAL,fell:true,speed:SPEED,tolerance:SPECIAL},false,(stack.length-1)+'층','','다 녹아버렸어… 해가 너무 뜨거워');}}
    const base=H-40;x.textAlign='center';let y=base;
    stack.forEach((b,i)=>{x.font=Math.round(BH*b.s)+'px serif';x.fillText(ITEM_A,b.x,y);y-=BH*b.s;});
    x.font=BH+'px serif';if(state==='play')x.fillText(ITEM_A,cur.x,y);if(state==='over'&&!fell)x.fillText(ITEM_B,stack[stack.length-1].x,y);
    x.font='40px serif';x.fillText(PLAYER,W-70,base);
    txt((stack.length-1)+' / '+GOAL+'층',42,28,'#ffd75b');
    if(state==='over'){txt(document.title.startsWith('성공')?'해냈다! 🎉':'…',H/2-10,Math.min(50,W/9));txt('스페이스바로 다시',H/2+34,18,'#bbb');}}
  requestAnimationFrame(loop);}
loop();
</script>
</body>
</html>
