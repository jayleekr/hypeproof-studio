<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<title>%%TITLE%%</title>
<style>
  html,body{margin:0;height:100%;overflow:hidden;background:#07091a;font-family:-apple-system,'Apple SD Gothic Neo',sans-serif;user-select:none}
  #c{display:block;width:100vw;height:100vh;image-rendering:pixelated;image-rendering:crisp-edges}
  #guest{position:fixed;top:12px;left:12px;right:12px;display:flex;gap:10px;align-items:flex-start;pointer-events:none}
  #guest .face{font-size:34px;line-height:1}
  #guest .bub{background:rgba(255,255,255,.94);color:#222;border-radius:14px;padding:8px 12px;font-size:14px;max-width:70vw;box-shadow:0 2px 8px rgba(0,0,0,.25)}
  #guest .bub b{color:#b8571e}
  #bar{position:fixed;left:0;right:0;bottom:0;padding:10px 14px;background:rgba(0,0,0,.55);backdrop-filter:blur(6px);color:#fff;font-size:15px;text-align:center}
  #bar b{color:#ffd75b}
</style>
</head>
<body>
<canvas id="c"></canvas>
<div id="guest"><div class="face" id="gface"></div><div class="bub" id="gsay"></div></div>
<div id="bar"><b>스페이스</b> 또는 <b>화면 탭</b>으로 블록 놓기</div>
<script>
/* ══ CONFIG — 자리표시자. 코치가 처음 채운다. 기본값 = 이 세상의 문제 상태 ═══════ */
const GUEST_EMOJI='%%GUEST_EMOJI%%';   // 🐧
const GUEST_NAME='%%GUEST_NAME%%';     // 뽀로
const GUEST_LINE='%%GUEST_LINE%%';     // 게스트가 자기 세상을 말하는 첫 대사. 예: 집이 무너졌어… 얼음을 쌓는데 해가 너무 뜨거워서 쌓는 족족 녹아…
const PLAYER='%%PLAYER_EMOJI%%';       // 옆에서 지켜보는 게스트 (🐧 면 도트 펭귄)
const ITEM_A='%%ITEM_A%%';             // 쌓을 것. 문제 세상: 🧊 (도트 얼음, 녹는다). 🧱 이면 벽돌
const ITEM_B='%%ITEM_B%%';             // 완성 지붕 (예: 🏠)
const SPEED=%%SPEED%%;                 // 블록 좌우 빠르기 1~10 (기본 4)
const RATE=%%RATE%%;                   // (미사용)
const GOAL=%%GOAL%%;                   // 몇 층 (기본 8)
const SPECIAL=%%SPECIAL%%;             // 삐뚤어도 봐주는 정도 0~10 (문제 세상 0)
const BG=['%%BG_TOP%%','%%BG_BOT%%'];  // 하늘 위/아래 색. 문제 세상 기본: #ffb347/#7fb3d5 (뙤약볕)
/* ══ WORLD — 이 세상에 박힌 문제. 화면에 보이고 기계적으로도 작동한다. ═══════════
   아이가 말하면 코치가 뭐든 바꾼다: 플래그를 끄고, 오브젝트를 바꾸고, 새 규칙·새 코드를 넣는다.
   지키는 것 둘 — #guest 말풍선, report() (hp:result + world 동봉). 세상을 바꿨으면 WORLD 값도 맞춰 둔다(게스트가 그걸 본다). */
const WORLD={
  sun:true,       // 해가 머리 위 — 얼음이 녹는다
  melt:true,      // 쌓은 블록이 점점 작아진다 (해가 없어지거나 블록이 얼음이 아니면 false 로)
  clouds:false,   // 구름
};
</script>
<script src="engine.js"></script>
<script>
const BW=28,BH=11;let state='title',stack=[],cur,dir,t=0,fell=false;const SUB=ITEM_A+' '+GOAL+'층 쌓으면 완성!';
const sp=0.5+SPEED*0.22,tol=3+SPECIAL*2.2,BASE=PH-24;
function reset(){stack=[{x:PW/2,s:1}];cur={x:30};dir=1;t=0;fell=false;state='play';say('<b>'+GUEST_NAME+'</b>: 빨리 쌓아야 해…');}
function drop(){if(state!=='play'){reset();return;}const last=stack[stack.length-1];if(Math.abs(cur.x-last.x)>tol+BW*0.5*last.s){fell=true;report({layers:stack.length-1,goal:GOAL,fell:true,speed:SPEED,tolerance:SPECIAL},false,(stack.length-1)+'층','','아… 무너졌어. 녹은 얼음 위엔 못 쌓겠어');return;}
  stack.push({x:cur.x,s:1});cur={x:dir>0?30:PW-30};dir*=-1;if(stack.length-1>=GOAL)report({layers:GOAL,goal:GOAL,fell:false,speed:SPEED,tolerance:SPECIAL},true,GOAL+'층','우와 집이다! 🏠 이제 안 녹아','');}
addEventListener('keydown',e=>{if(e.code==='Space')drop();});addEventListener('pointerdown',drop);
function block(bx,by,s,i){const w=Math.round(BW*s),h=Math.round(BH*s);if(ITEM_A==='🧊'){x.fillStyle='#1c4a7a';x.fillRect(Math.round(bx-w/2),by-h,w,h);x.fillStyle='#bfe9ff';x.fillRect(Math.round(bx-w/2)+1,by-h+1,w-2,h-2);x.fillStyle='#e9f8ff';x.fillRect(Math.round(bx-w/2)+2,by-h+2,Math.max(1,w-6),1);}else if(ITEM_A==='🧱'){x.fillStyle='#4a1a12';x.fillRect(Math.round(bx-w/2),by-h,w,h);x.fillStyle='#c85a48';x.fillRect(Math.round(bx-w/2)+1,by-h+1,w-2,h-2);x.fillStyle='#e8887a';x.fillRect(Math.round(bx-w/2)+1,by-Math.round(h/2),w-2,1);}else emo(ITEM_A,bx,by-h/2,Math.round(10*s)+2);}
function scene(){skyGrad();dither(0,60,'rgba(255,255,255,.12)');
  if(WORLD.sun){x.fillStyle='#fff1a8';x.beginPath();x.arc(PW/2,26,15,0,6.3);x.fill();x.fillStyle='#ffd23f';x.beginPath();x.arc(PW/2,26,12,0,6.3);x.fill();}
  if(WORLD.clouds){x.fillStyle='#fff';[[PW/2,22],[70,30],[250,34]].forEach(([cx,cy])=>{x.fillRect(cx-16,cy,32,8);x.fillRect(cx-8,cy-6,16,6);});}
  // 바다 + 얼음판
  x.fillStyle='#2a6fd6';x.fillRect(0,BASE-2,PW,PH-BASE+2);x.fillStyle='#4f9dff';for(let i=0;i<PW;i+=8)x.fillRect(i,BASE-2+Math.round(Math.sin(i/10+t/12)),4,1);
  x.fillStyle='#e9f8ff';x.fillRect(PW/2-40,BASE-3,80,5);x.fillStyle='#bfe9ff';x.fillRect(PW/2-40,BASE+1,80,2);
  let y=BASE-3;stack.forEach((b,i)=>{block(b.x,y,b.s,i);y-=Math.round(BH*b.s);});
  if(state==='play')block(cur.x,y,1,-1);if(state==='over'&&!fell){if(ITEM_B==='🏠')sprite(S_HOUSE,stack[stack.length-1].x-17,y-28,{'#':'#3a2a2a','@':'#c85a48','$':'#e8d9b5','o':'#ffd76a'},2);else emo(ITEM_B,stack[stack.length-1].x,y-8,16);}
  if(PLAYER==='🐧')sprite(S_PENG,PW/2+56,BASE-25,{'#':'#0e0e1a','@':'#2b2b3d','w':'#ffffff','o':'#0e0e1a','y':'#ffb347'},2);else emo(PLAYER,PW/2+68,BASE-10,20);
}
function loop(){
  t++;if(state==='play'){cur.x+=sp*dir;if(cur.x<30||cur.x>PW-30)dir*=-1;
    if(WORLD.melt){stack.forEach((b,i)=>{if(i>0)b.s=Math.max(0.15,b.s-0.0015);});if(stack.slice(1).some(b=>b.s<=0.2))report({layers:stack.length-1,goal:GOAL,fell:true,speed:SPEED,tolerance:SPECIAL},false,(stack.length-1)+'층','','다 녹아버렸어… 해가 너무 뜨거워');}}
  scene();blit();
  if(state==='title')titleHud();else{txt((stack.length-1)+' / '+GOAL+'층',48,26,'#ffd75b');if(state==='over')overHud(document.title.startsWith('성공'));}
  requestAnimationFrame(loop);}
loop();
</script>
</body>
</html>
