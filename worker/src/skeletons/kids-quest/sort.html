<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<title>%%TITLE%%</title>
<style>
  html,body{margin:0;height:100%;overflow:hidden;background:#07091a;font-family:-apple-system,'Apple SD Gothic Neo',sans-serif;user-select:none}
  #c{display:block;width:100vw;height:100vh;image-rendering:pixelated;image-rendering:crisp-edges}
  #guest{position:fixed;top:12px;left:12px;right:12px;display:flex;gap:10px;align-items:flex-start;pointer-events:none}
  #guest .face{font-size:34px;line-height:1}
  #guest .bub{background:rgba(255,255,255,.94);color:#222;border-radius:14px;padding:8px 12px;font-size:14px;max-width:70vw;box-shadow:0 2px 8px rgba(0,0,0,.25)}
  #guest .bub b{color:#b8571e}
  #bar{position:fixed;left:0;right:0;bottom:0;padding:10px 14px;background:rgba(0,0,0,.55);backdrop-filter:blur(6px);color:#fff;font-size:15px;text-align:center}
  #bar b{color:#ffd75b}
</style>
</head>
<body>
<canvas id="c"></canvas>
<div id="guest"><div class="face" id="gface"></div><div class="bub" id="gsay"></div></div>
<div id="bar"><b>←</b> 왼쪽 통 · <b>→</b> 오른쪽 통 (또는 화면 왼쪽/오른쪽 탭) · 못 건지면 물고기가 사라져요</div>
<script>
/* ══ CONFIG — 자리표시자. 코치가 처음 채운다. 기본값 = 이 세상의 문제 상태 ═══════ */
const GUEST_EMOJI='%%GUEST_EMOJI%%';   // 🦝
const GUEST_NAME='%%GUEST_NAME%%';     // 라쿤
const GUEST_LINE='%%GUEST_LINE%%';     // 게스트가 자기 세상을 말하는 첫 대사. 예: 냇물에 쓰레기가 자꾸 떠내려와… 캔은 왼쪽 통, 병은 오른쪽 통에 넣어야 하는데 너무 빨라. 못 건지면 물고기가 사라져…
const PLAYER='%%PLAYER_EMOJI%%';       // 냇가에 선 게스트 (🦝 면 도트 너구리)
const ITEM_A='%%ITEM_A%%';             // 왼쪽 통에 넣을 것 (예: 🥫)
const ITEM_B='%%ITEM_B%%';             // 오른쪽 통에 넣을 것 (예: 🍾)
const SPEED=%%SPEED%%;                 // 쓰레기가 떠내려오는 빠르기 1~10 (문제 세상 8)
const RATE=%%RATE%%;                   // 헷갈리는 것(쓰레기 아닌 것 🍎🍂) 비율 0~10 (문제 세상 6)
const GOAL=%%GOAL%%;                   // 몇 개 건지면 성공 (기본 12)
const SPECIAL=%%SPECIAL%%;             // 틀려도 되는 횟수 (문제 세상 2)
const BG=['%%BG_TOP%%','%%BG_BOT%%'];  // 하늘 위/아래 색. 문제 세상 기본: #5a4a3a/#8a7a5a (흙탕물)
/* ══ WORLD — 이 세상에 박힌 문제. 화면에 보이고 기계적으로도 작동한다. ═══════════
   아이가 말하면 코치가 뭐든 바꾼다: 플래그를 끄고, 오브젝트를 바꾸고, 새 규칙·새 코드를 넣는다.
   지키는 것 둘 — #guest 말풍선, report() (hp:result + world 동봉). 세상을 바꿨으면 WORLD 값도 맞춰 둔다(게스트가 그걸 본다). */
const WORLD={
  dirty:true,     // 냇물이 갈색이다 — 틀리거나 놓칠 때마다 물고기(fish)가 한 마리 사라진다
  fish:4,         // 냇물에 사는 물고기 수 (아이가 늘리거나 지키게 바꿀 수 있다)
  trashRate:1,    // 쓰레기 양 배수 (0 이면 안 온다)
};
</script>
<script src="engine.js"></script>
<script>
const ODD=['🍎','🍂','🌰','🍌'];let state='title',cur=null,t=0,ok_=0,bad=0,fly=null,fish=WORLD.fish,swim=[];const SUB=ITEM_A+' 왼쪽 · '+ITEM_B+' 오른쪽 — '+GOAL+'개 건지면 성공!';
const flow=0.5+SPEED*0.2,RY=70,RH=52;
function spawn(){if(WORLD.trashRate<=0){cur=null;return;}const r=Math.random();cur={e:r<RATE*0.05?ODD[Math.floor(Math.random()*ODD.length)]:(Math.random()<.5?ITEM_A:ITEM_B),x:-16,y:RY+RH*0.5};}
function reset(){t=0;ok_=0;bad=0;fly=null;fish=WORLD.fish;swim=[];for(let i=0;i<fish;i++)swim.push({x:Math.random()*PW,d:Math.random()<.5?1:-1,y:RY+8+Math.random()*(RH-20)});spawn();state='play';say('<b>'+GUEST_NAME+'</b>: 온다 온다… 이건 어디 통?');}
function wrong(msg){bad++;if(WORLD.dirty&&fish>0){fish--;swim.pop();}say('<b>'+GUEST_NAME+'</b>: '+msg+(WORLD.dirty?' 물고기가 또 사라졌어…':''));}
function check(){if(ok_>=GOAL)report({ok:ok_,wrong:bad,fish,goal:GOAL,speed:SPEED,oddRatio:RATE,allowed:SPECIAL},true,ok_+'개','냇물이 깨끗해졌어! 🐟 물고기들이 돌아왔어, 고마워','');
  else if(bad>SPECIAL||(WORLD.dirty&&fish<=0))report({ok:ok_,wrong:bad,fish,goal:GOAL,speed:SPEED,oddRatio:RATE,allowed:SPECIAL},false,ok_+'개','',fish<=0?'물고기가 다 사라졌어…':'너무 빨리 떠내려와서 못 건지겠어…');
  else setTimeout(()=>{if(state==='play'&&!cur)spawn();},300);}
function pick(side){if(state!=='play'||!cur)return;const want=cur.e===ITEM_A?'L':cur.e===ITEM_B?'R':'N';if(want===side){ok_++;fly={e:cur.e,side,t:0,x:cur.x,y:cur.y};}else wrong(want==='N'?'그건 쓰레기가 아닌데?':want==='L'?'그건 왼쪽 통인데!':'그건 오른쪽 통인데!');cur=null;check();}
addEventListener('keydown',e=>{if(e.code==='Space'&&state!=='play')reset();if(e.key==='ArrowLeft')pick('L');if(e.key==='ArrowRight')pick('R');});
addEventListener('pointerdown',e=>{if(state!=='play'){reset();return;}const p=toPX(e.clientX,0);pick(p.x<PW/2?'L':'R');});
function scene(){skyGrad();
  // 둑·풀
  x.fillStyle=WORLD.dirty?'#7a6a3a':'#4f8a2f';x.fillRect(0,RY-14,PW,14);x.fillRect(0,RY+RH,PW,PH-RY-RH);x.fillStyle=WORLD.dirty?'#5a4a2a':'#3f6f24';for(let i=0;i<PW;i+=6){x.fillRect(i,RY-14,2,4);x.fillRect(i+3,RY+RH,2,4);}
  x.fillStyle=WORLD.dirty?'#6e5533':'#2a6fd6';x.fillRect(0,RY,PW,RH);x.fillStyle=WORLD.dirty?'#8a6a40':'#4f9dff';for(let j=0;j<RH;j+=8)for(let i=-((t/2)%12);i<PW;i+=12)x.fillRect(Math.round(i+j),RY+j+Math.round(Math.sin(i/10+t/12)),6,1);
  swim.forEach(f=>{if(state==='play'){f.x+=f.d*0.25;if(f.x<0||f.x>PW)f.d*=-1;}sprite(S_FISH,f.x-12,f.y-6,{'#':'#123','@':'#4fd1ff','o':'#123'},2);});
  // 통 두 개
  [[PW*0.18,ITEM_A],[PW*0.82,ITEM_B]].forEach(([bx,lab])=>{sprite(S_TRASH,bx-10,PH-30,{'#':'#333','@':'#8fa'},2);emo(lab,bx,PH-38,14);});
  if(cur){emo(cur.e,cur.x,cur.y,18);}
  if(fly){fly.t++;const tx=fly.side==='L'?PW*0.18:PW*0.82,ty=PH-22;const k=Math.min(1,fly.t/14);emo(fly.e,fly.x+(tx-fly.x)*k,fly.y+(ty-fly.y)*k,14);if(fly.t>14)fly=null;}
  if(PLAYER==='🦝')sprite(S_RAC,PW-44,RY-14-22,{'#':'#1a1a1a','@':'#9a9a9a','o':'#111','w':'#f0f0f0'},2);else emo(PLAYER,PW-30,RY-24,20);
}
function loop(){
  if(state==='play'){t++;if(cur){cur.x+=flow;if(cur.x>PW+16){const want=cur.e===ITEM_A?'L':cur.e===ITEM_B?'R':'N';if(want==='N')ok_++;else wrong('놓쳤다…');cur=null;check();}}}
  else t++;
  scene();blit();
  if(state==='title')titleHud();else{txt('건짐 '+ok_+' / '+GOAL+'   ✖ '+bad+'/'+SPECIAL+'   🐟 '+fish,48,24,'#ffd75b');if(state==='over'){txt(document.title.startsWith('성공')?'깨끗해졌다! 🎉':'…',H*0.28,Math.min(46,W/9));txt('스페이스바로 다시',H*0.28+40,18,'#ddd');}}
  requestAnimationFrame(loop);}
loop();
</script>
</body>
</html>
