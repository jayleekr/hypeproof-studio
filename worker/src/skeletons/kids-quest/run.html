<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<title>%%TITLE%%</title>
<style>
  html,body{margin:0;height:100%;overflow:hidden;background:#07091a;font-family:-apple-system,'Apple SD Gothic Neo',sans-serif;user-select:none}
  #c{display:block;width:100vw;height:100vh;image-rendering:pixelated;image-rendering:crisp-edges}
  #guest{position:fixed;top:12px;left:12px;right:12px;display:flex;gap:10px;align-items:flex-start;pointer-events:none}
  #guest .face{font-size:34px;line-height:1}
  #guest .bub{background:rgba(255,255,255,.94);color:#222;border-radius:14px;padding:8px 12px;font-size:14px;max-width:70vw;box-shadow:0 2px 8px rgba(0,0,0,.25)}
  #guest .bub b{color:#b8571e}
  #bar{position:fixed;left:0;right:0;bottom:0;padding:10px 14px;background:rgba(0,0,0,.55);backdrop-filter:blur(6px);color:#fff;font-size:15px;text-align:center}
  #bar b{color:#ffd75b}
</style>
</head>
<body>
<canvas id="c"></canvas>
<div id="guest"><div class="face" id="gface"></div><div class="bub" id="gsay"></div></div>
<div id="bar"><b>← →</b> 로 길 바꾸기 · <b>스페이스</b>로 점프 · 뒤에서 물이 온다!</div>
<script>
/* ══ CONFIG — 자리표시자. 코치가 처음 채운다. 기본값 = 이 세상의 문제 상태 ═══════ */
const GUEST_EMOJI='%%GUEST_EMOJI%%';   // 🐁
const GUEST_NAME='%%GUEST_NAME%%';     // 찍찍
const GUEST_LINE='%%GUEST_LINE%%';     // 게스트가 자기 세상을 말하는 첫 대사. 예: 하수구가 너무 캄캄해… 웅덩이도 많고, 뒤에서 물이 밀려와. 치즈까지 어떻게 가지…
const PLAYER='%%PLAYER_EMOJI%%';       // 달리는 것 (🐁 면 도트 생쥐)
const ITEM_A='%%ITEM_A%%';             // 도착 (예: 🧀)
const ITEM_B='%%ITEM_B%%';             // 점프해서 넘을 것. 문제 세상: 💧 웅덩이 (도트). 없애려면 ''
const SPEED=%%SPEED%%;                 // 뒤에서 오는 물의 빠르기 1~10 (문제 세상 6, 0이면 안 옴)
const RATE=%%RATE%%;                   // 웅덩이·막힌 길이 얼마나 자주 1~10 (문제 세상 6)
const GOAL=%%GOAL%%;                   // 몇 미터 가면 치즈 (기본 60)
const SPECIAL=%%SPECIAL%%;             // 밝기 0~10 (문제 세상 1 — 내 주변만 보임)
const BG=['%%BG_TOP%%','%%BG_BOT%%'];  // 하늘 위/아래 색. 문제 세상 기본: #111318/#23262f (하수구)
/* ══ WORLD — 이 세상에 박힌 문제. 화면에 보이고 기계적으로도 작동한다. ═══════════
   아이가 말하면 코치가 뭐든 바꾼다: 플래그를 끄고, 오브젝트를 바꾸고, 새 규칙·새 코드를 넣는다.
   지키는 것 둘 — #guest 말풍선, report() (hp:result + world 동봉). 세상을 바꿨으면 WORLD 값도 맞춰 둔다(게스트가 그걸 본다). */
const WORLD={
  dark:true,      // 캄캄하다 — SPECIAL(밝기)만큼만 보인다. 불을 켜면 false
  chase:true,     // 뒤에서 물이 밀려온다 (SPEED). 막으면 false
  puddles:true,   // 웅덩이(ITEM_B)가 있다
  walls:true,     // 갈림길에 막힌 길이 있다 (부딪히면 느려진다)
};
/* ══ 도트 엔진 — 320×180 저해상도에 그리고 픽셀 그대로 확대. 규칙: HUD 글자는 검은 외곽선,
   플레이어는 밝은 몸+검은 외곽선(배경과 반대 명도), 오브젝트는 외곽선. ═══════════════════ */
const PW=320,PH=180;const cv=document.getElementById('c'),ctx=cv.getContext('2d');const off=document.createElement('canvas');off.width=PW;off.height=PH;const x=off.getContext('2d');
let W,H,SC=1,OX=0,OY=0;function fit(){W=cv.width=innerWidth;H=cv.height=innerHeight-46;ctx.imageSmoothingEnabled=false;SC=Math.min(W/PW,H/PH);OX=(W-PW*SC)/2;OY=(H-PH*SC)/2;}fit();onresize=fit;
const toPX=(cx,cy)=>({x:(cx-OX)/SC,y:(cy-OY)/SC});
document.getElementById('gface').textContent=GUEST_EMOJI;const say=s=>{document.getElementById('gsay').innerHTML=s;};say('<b>'+GUEST_NAME+'</b>: '+GUEST_LINE);
function sprite(map,sx,sy,pal,scale){scale=scale||1;for(let j=0;j<map.length;j++)for(let i=0;i<map[j].length;i++){const ch=map[j][i];if(ch==='.')continue;x.fillStyle=pal[ch]||pal['#']||'#000';x.fillRect(Math.round(sx+i*scale),Math.round(sy+j*scale),scale,scale);}}
function emo(e,px,py,size){x.font=(size||14)+'px serif';x.textAlign='center';x.textBaseline='middle';x.fillText(e,px,py);x.textBaseline='alphabetic';}
function skyGrad(){const g=x.createLinearGradient(0,0,0,PH);g.addColorStop(0,BG[0]);g.addColorStop(1,BG[1]);x.fillStyle=g;x.fillRect(0,0,PW,PH);}
function dither(y0,y1,c){x.fillStyle=c;for(let j=y0;j<y1;j+=2)for(let i=(j/2)%2;i<PW;i+=4)x.fillRect(i,j,1,1);}
let seed=11;const rnd=()=>{seed=(seed*9301+49297)%233280;return seed/233280;};
function txt(s,y,sz,c,cx){ctx.font='bold '+sz+'px sans-serif';ctx.textAlign='center';ctx.lineJoin='round';ctx.lineWidth=Math.max(3,sz/6);ctx.strokeStyle='rgba(0,0,0,.85)';ctx.strokeText(s,cx==null?W/2:cx,y);ctx.fillStyle=c||'#fff';ctx.fillText(s,cx==null?W/2:cx,y);}
function report(r,ok,title,okSay,failSay){state='over';r.type='hp:result';r.ok=ok;r.guest=GUEST_NAME;r.world=Object.assign({},WORLD);r.n=(window.__hpLast?window.__hpLast.n:0)+1;window.__hpLast=r;try{parent.postMessage(r,'*');}catch(e){}document.title=(ok?'성공 ':'실패 ')+title;say('<b>'+GUEST_NAME+'</b>: '+(ok?okSay:failSay));}
function blit(){ctx.fillStyle='#07091a';ctx.fillRect(0,0,W,H);ctx.drawImage(off,Math.round(OX),Math.round(OY),Math.round(PW*SC),Math.round(PH*SC));}
function titleHud(){txt(document.title,H/2-30,Math.min(56,W/8));txt(SUB,H/2+30,22,'#ffd75b');txt('스페이스바 또는 화면을 누르면 시작',H/2+68,18,'#ddd');}
function overHud(win){txt(win?'해냈다! 🎉':'…',H/2-10,Math.min(50,W/9));txt('스페이스바로 다시',H/2+34,18,'#ddd');}
const S_CAT=['..##....##......','..#@#..#@#......','..#@@@@@@#......','..#@o@@o@#......','..#@@@@@@#..##..','...#@@@@#..#@#..','.###@@@@####@#..','#@@@@@@@@@@@#...','#@@@@@@@@@@#....','.#@@@@@@@@@#....','..#@#....#@#....','..#@#....#@#....'];
const S_DOG=['....####........','...#@@@@#.......','..#@o@@@@#####..','..#@@@@@@@@@@@#.','...#@@@@@@@@@@#.','...#@@@@@@@@@@#.','..#@@#@@@@#@@#..','..#@@#....#@@#..'];
const S_BEE=['....ww..ww......','...wwww.wwww....','..#wwwwwwwww#...','.#@@#@@#@@#@@#..','#@o@#@@#@@#@@@#.','#@@@#@@#@@#@@@#.','.#@@#@@#@@#@@#..','..#@@@@@@@@@@#..','...##########...'];
const S_PENG=['....######......','...#@@@@@@#.....','..#@w@ww@w@#....','..#@wowwow@#....','..#@@wyyw@@#....','.#@@@wwww@@@#...','#@#@wwwwww@#@#..','#@#@wwwwww@#@#..','.#@@wwwwww@@#...','..#@@wwww@@#....','...#yy##yy#.....'];
const S_MOUSE=['.##......##.....','#@@#....#@@#....','#@@@####@@@#....','.#@@@@@@@@#.....','.#@o@@@@o@#.....','..#@@@@@@#......','..#@@@@@@#..#...','.#@@@@@@@@#.#...','.#@@@@@@@@##....','..########......'];
const S_HAM=['..##....##......','.#@@#..#@@#.....','.#@@@##@@@#.....','#@o@@@@@@o@#....','#@@@@@@@@@@#....','#@@w@@@@w@@#....','.#@@@@@@@@#.....','..#@@@@@@#......','...#@##@#.......'];
const S_PARROT=['....####........','...#@@@@#.......','..#@o@@@@#......','..#@@@@yy#......','..#@@@@@#.......','.#@@@@@@#.......','#@@@@@@@#.......','#@@@@@@#........','.#@@@@#.........','..#@@#..........','..#yy#..........','...##...........'];
const S_FLOWER=['....####........','..##@@@@##......','.#@@#yy#@@#.....','.#@#yooy#@#.....','#@#yoooooy#@#...','#@#yoooooy#@#...','.#@#yooy#@#.....','.#@@#yy#@@#.....','..##@@@@##......','....####........','.....gg.........','..gg.gg.gg......','...gg#gg#.......','.....gg.........'];
const S_RAC=['.##......##.....','#@@#....#@@#....','#@@@####@@@#....','.#@@@@@@@@#.....','#@#w@@@@w#@#....','#@#o####o#@#....','.#@@wwww@@#.....','..#@@@@@@#......','..#@@@@@@#......','...######.......'];
const S_FISH=['...####.....','..#@@@@#.#..','.#@o@@@@##..','.#@@@@@@#...','..#@@@@#.#..','...####..#..'];
const S_LOG=['.##########.','#@@@@@@@@@@#','#@@#@@@@#@@#','#@@@@@@@@@@#','.##########.'];
const S_BRICK=['############','#..#..#..#..','############','.#..#..#..#.','############'];
const S_HOUSE=['.......###.......','......#@@@#......','.....#@@@@@#.....','....#@@@@@@@#....','...#@@@@@@@@@#...','..#@@@@@@@@@@@#..','.#############.#.','.#$$$$$$$$$$$$$#.','.#$$##$$$$$##$$#.','.#$$##$$$$$##$$#.','.#$$$$$$###$$$$#.','.#$$$$$$#o#$$$$#.','.#$$$$$$#o#$$$$#.','.###############.'];
const S_FIRE=['...#....','..#@#...','.#@o@#..','#@ooo@#.','#@ooo@#.','.#@o@#..','..#@#...'];
const S_ICE=['##########','#wwwwwwww#','#w@@@@@@w#','#w@@@@@@w#','#wwwwwwww#','##########'];
const S_MOLE=['..######..','.#@@@@@@#.','#@o@@@@o@#','#@@@ww@@@#','#@@@@@@@@#','.########.'];
const S_TRASH=['.########.','##########','.#@#@#@#@.','.#@#@#@#@.','.#@#@#@#@.','.########.'];
const LANES=[PW/2-40,PW/2,PW/2+40];let state='title',lane=1,py=0,vy=0,jumping=false,dist=0,t=0,speed=1.6,rows=[],waterY=PH+40,hits=0;const SUB=ITEM_A+' 까지 '+GOAL+'m 달리면 도착!';
const density=0.25+RATE*0.06,chase=SPEED*0.09;
function genRow(y){const r={y,items:[]};if(Math.random()<density){const l=Math.floor(Math.random()*3);if(WORLD.walls&&Math.random()<0.4)r.items.push({l,kind:'wall'});else if(WORLD.puddles&&ITEM_B)r.items.push({l,kind:'puddle'});}return r;}
function reset(){lane=1;py=0;vy=0;jumping=false;dist=0;t=0;speed=1.6;hits=0;waterY=PH+40;rows=[];for(let y=-20;y>-PH*2;y-=34)rows.push(genRow(y));state='play';say('<b>'+GUEST_NAME+'</b>: 뒤에서 물 온다… 뛰어!');}
function jump(){if(state!=='play'){reset();return;}if(!jumping){jumping=true;vy=-3.2;}}
addEventListener('keydown',e=>{if(e.code==='Space')jump();if(state==='play'){if(e.key==='ArrowLeft')lane=Math.max(0,lane-1);if(e.key==='ArrowRight')lane=Math.min(2,lane+1);}});
addEventListener('pointerdown',e=>{if(state!=='play'){reset();return;}const p=toPX(e.clientX,e.clientY);if(p.y<PH*0.45)jump();else if(p.x<PW/2)lane=Math.max(0,lane-1);else lane=Math.min(2,lane+1);});
const MY=PH-46;
function scene(){skyGrad();
  // 터널 벽 + 바닥 벽돌
  x.fillStyle='#1c2028';x.fillRect(PW/2-70,0,140,PH);x.fillStyle='#2b3140';for(let j=-((dist*2)%10);j<PH;j+=10)for(let i=PW/2-70;i<PW/2+70;i+=14)x.fillRect(i+((j/10)%2?7:0),j,12,8);
  x.fillStyle='#0d1014';x.fillRect(PW/2-74,0,4,PH);x.fillRect(PW/2+70,0,4,PH);x.fillStyle='#3a4358';x.fillRect(PW/2-90,0,16,PH);x.fillRect(PW/2+74,0,16,PH);
  x.fillStyle='#4a5470';for(let j=-((dist*2)%24);j<PH;j+=24){x.fillRect(PW/2-88,j,12,3);x.fillRect(PW/2+76,j,12,3);}
  // 파이프
  x.fillStyle='#55607a';x.fillRect(PW/2-70,-((dist*2)%140)+30,140,3);
  rows.forEach(r=>{const sy=r.y+dist*2;if(sy<-40||sy>PH+20)return;r.items.forEach(it=>{const lx=LANES[it.l];if(it.kind==='wall'){x.fillStyle='#0d1014';x.fillRect(lx-16,sy-6,32,12);x.fillStyle='#6b7690';x.fillRect(lx-15,sy-5,30,10);x.fillStyle='#8f9bb8';x.fillRect(lx-15,sy-5,30,2);}else{if(ITEM_B==='💧'){x.fillStyle='#1c4a7a';x.fillRect(lx-13,sy-4,26,9);x.fillStyle='#4f9dff';x.fillRect(lx-12,sy-3,24,7);x.fillStyle='#bfe3ff';x.fillRect(lx-9,sy-1,6,1);}else emo(ITEM_B,lx,sy,12);}});});
  // 치즈 (도착)
  const goalY=MY-(GOAL*10-dist*2);if(goalY>-20&&goalY<PH){if(ITEM_A==='🧀'){x.fillStyle='#8a6a00';x.fillRect(PW/2-12,goalY-8,24,12);x.fillStyle='#ffd23f';x.fillRect(PW/2-11,goalY-7,22,10);x.fillStyle='#e0a800';x.fillRect(PW/2-6,goalY-4,3,3);x.fillRect(PW/2+3,goalY-2,3,3);}else emo(ITEM_A,PW/2,goalY,14);}
  // 생쥐
  const mx=LANES[lane];if(PLAYER==='🐁')sprite(S_MOUSE,mx-12,MY+py-10,{'#':'#141414','@':'#e0e0ea','o':'#141414'},2);else emo(PLAYER,mx,MY+py,20);
  if(jumping){x.fillStyle='rgba(0,0,0,.35)';x.fillRect(mx-6,MY+4,12,2);}
  // 뒤에서 오는 물
  if(WORLD.chase){x.fillStyle='#2a6fd6';x.fillRect(PW/2-74,Math.floor(waterY),148,PH);x.fillStyle='#4f9dff';for(let i=PW/2-74;i<PW/2+74;i+=6)x.fillRect(i,Math.floor(waterY+Math.sin(i/8+t/6)*1.5),4,1);x.fillStyle='#bfe3ff';for(let i=PW/2-70;i<PW/2+74;i+=15)x.fillRect(i,Math.floor(waterY+Math.sin(i/6+t/5)*1.5),2,1);}
  // 어둠
  if(WORLD.dark&&SPECIAL<10){const rad=48+SPECIAL*12;const g=x.createRadialGradient(mx,MY-10,rad*0.45,mx,MY-10,rad);g.addColorStop(0,'rgba(2,3,8,0)');g.addColorStop(1,'rgba(2,3,8,.9)');x.fillStyle=g;x.fillRect(0,0,PW,PH);}
}
function loop(){
  if(state==='play'){t++;dist+=speed*0.5;speed=Math.min(2.4,speed+0.0006);
    if(jumping){py+=vy;vy+=0.25;if(py>=0){py=0;jumping=false;}}
    if(rows.length&&rows[rows.length-1].y+dist*2>-40)rows.push(genRow(rows[rows.length-1].y-34));
    rows.forEach(r=>{const sy=r.y+dist*2;if(!r.done&&sy>MY-4&&sy<MY+6){r.done=true;r.items.forEach(it=>{if(it.l!==lane)return;if(it.kind==='wall'){speed=0.6;hits++;say('<b>'+GUEST_NAME+'</b>: 쿵! 막혔어…');}else if(!jumping){speed=0.9;say('<b>'+GUEST_NAME+'</b>: 첨벙… 미끄러워');}});}});
    if(WORLD.chase&&SPEED>0){waterY-=chase*0.6+(speed<1.2?0.5:0)-(speed>2?0.15:0);}else waterY=PH+40;
    if(WORLD.chase&&waterY<MY+2)report({meters:Math.round(dist/5),goal:GOAL,hits,speed:SPEED,rate:RATE,light:SPECIAL},false,Math.round(dist/5)+'m','','콜록… 물에 잡혔어. 뒤가 너무 빨라…');
    else if(dist/5>=GOAL)report({meters:GOAL,goal:GOAL,hits,speed:SPEED,rate:RATE,light:SPECIAL},true,GOAL+'m','찾았다! 🧀 길이 보이니까 금방이네','');}
  else t++;
  scene();blit();
  if(state==='title')titleHud();else{txt(Math.min(GOAL,Math.round(dist/5))+' / '+GOAL+'m   💥 '+hits,48,24,'#ffd75b');if(state==='over')overHud(document.title.startsWith('성공'));}
  requestAnimationFrame(loop);}
loop();
</script>
</body>
</html>
