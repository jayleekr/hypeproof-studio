<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<title>%%TITLE%%</title>
<style>
  html,body{margin:0;height:100%;overflow:hidden;background:#07091a;font-family:-apple-system,'Apple SD Gothic Neo',sans-serif;user-select:none}
  #c{display:block;width:100vw;height:100vh;image-rendering:pixelated;image-rendering:crisp-edges}
  #guest{position:fixed;top:12px;left:12px;right:12px;display:flex;gap:10px;align-items:flex-start;pointer-events:none}
  #guest .face{font-size:34px;line-height:1}
  #guest .bub{background:rgba(255,255,255,.94);color:#222;border-radius:14px;padding:8px 12px;font-size:14px;max-width:70vw;box-shadow:0 2px 8px rgba(0,0,0,.25)}
  #guest .bub b{color:#b8571e}
  #bar{position:fixed;left:0;right:0;bottom:0;padding:10px 14px;background:rgba(0,0,0,.55);backdrop-filter:blur(6px);color:#fff;font-size:15px;text-align:center}
  #bar b{color:#ffd75b}
</style>
</head>
<body>
<canvas id="c"></canvas>
<div id="guest"><div class="face" id="gface"></div><div class="bub" id="gsay"></div></div>
<div id="bar"><b>마우스</b>나 <b>방향키</b>로 날기 · <b>스페이스</b>로 시작</div>
<script>
/* ══ CONFIG — 자리표시자. 코치가 처음 채운다. 기본값 = 이 세상의 문제 상태 ═══════ */
const GUEST_EMOJI='%%GUEST_EMOJI%%';   // 🐝
const GUEST_NAME='%%GUEST_NAME%%';     // 붕붕
const GUEST_LINE='%%GUEST_LINE%%';     // 게스트가 자기 세상을 말하는 첫 대사. 예: 꽃밭에 매연이 껴서 앞이 안 보여… 꽃도 다 시들어서 꿀이 안 나와…
const PLAYER='%%PLAYER_EMOJI%%';       // 나는 것 (🐝 면 도트 꿀벌)
const ITEM_A='%%ITEM_A%%';             // 모을 것. 문제 세상: 🥀 (시든 꽃 — 꿀 0). 🌸 🌻 이면 핀 꽃 (도트)
const ITEM_B='%%ITEM_B%%';             // 방해꾼. 문제 세상: 🏭 (공장 연기, 도트). 없애려면 ''
const SPEED=%%SPEED%%;                 // 나는 빠르기 1~10 (기본 5)
const RATE=%%RATE%%;                   // 꽃이 얼마나 흩어졌나 1~10 (기본 6)
const GOAL=%%GOAL%%;                   // 꿀 몇 개면 성공 (기본 8)
const SPECIAL=%%SPECIAL%%;             // 제한 시간(초) 기본 30, 0=무제한
const BG=['%%BG_TOP%%','%%BG_BOT%%'];  // 하늘 위/아래 색. 문제 세상 기본: #6b6b6b/#9a9a8a (매연 하늘)
/* ══ WORLD — 이 세상에 박힌 문제. 화면에 보이고 기계적으로도 작동한다. ═══════════
   아이가 말하면 코치가 뭐든 바꾼다: 플래그를 끄고, 오브젝트를 바꾸고, 새 규칙·새 코드를 넣는다.
   지키는 것 둘 — #guest 말풍선, report() (hp:result + world 동봉). 세상을 바꿨으면 WORLD 값도 맞춰 둔다(게스트가 그걸 본다). */
const WORLD={
  smog:true,      // 매연 — 화면이 뿌옇고 내 주변만 보인다
  wilted:true,    // 꽃이 시들었다 — 🥀 는 모아도 꿀이 안 된다 (ITEM_A 를 산 꽃으로 바꾸면 false 로)
  factory:true,   // 공장이 연기를 뿜는다 (ITEM_B)
};
</script>
<script src="engine.js"></script>
<script>
let state='title',px=PW/2,py=PH/2,tx=PW/2,ty=PH/2,items=[],haz=[],got=0,t=0;const SUB=(WORLD.wilted?'꽃이 다 시들었다…':ITEM_A+' '+GOAL+'개 모으면 성공!')+(SPECIAL?' ('+SPECIAL+'초)':'');
const mv=0.6+SPEED*0.2;const S_WILT=['..###...','.#@@@#..','.#@o@#..','..#@#...','...g....','..g.....','...g....','...g....'];const S_BLOOM=['..###...','.#ppp#..','#p#y#p#.','#pyyyp#.','#p#y#p#.','.#ppp#..','..#g#...','...g....','..g.g...','...g....'];
const S_FAC=['..#.......','..#.......','..#.......','###.......','#@#####...','#@@@@@#...','#@#@#@#...','#@@@@@#...','########..'];
const smokes=Array.from({length:18},()=>({x:rnd()*PW,y:rnd()*PH,r:6+rnd()*10,s:0.1+rnd()*0.2}));
function place(){items=[];const cx=PW/2,cy=PH/2,spread=0.15+RATE*0.085;for(let i=0;i<Math.max(GOAL,4);i++){const a=Math.random()*6.28,r=Math.random()*spread*Math.min(PW,PH)*0.9;items.push({x:Math.max(12,Math.min(PW-12,cx+Math.cos(a)*r)),y:Math.max(30,Math.min(PH-16,cy+Math.sin(a)*r))});}
  haz=[];if(ITEM_B&&WORLD.factory)for(let i=0;i<3;i++)haz.push({x:Math.random()*PW,y:30+Math.random()*(PH-60),vx:(Math.random()-.5),vy:(Math.random()-.5)});}
function reset(){px=tx=PW/2;py=ty=PH/2;got=0;t=0;place();state='play';say('<b>'+GUEST_NAME+'</b>: 콜록… 가볼게');}
addEventListener('mousemove',e=>{if(state==='play'){const p=toPX(e.clientX,e.clientY);tx=p.x;ty=p.y;}});addEventListener('touchmove',e=>{if(state==='play'){const p=toPX(e.touches[0].clientX,e.touches[0].clientY);tx=p.x;ty=p.y;}},{passive:true});
addEventListener('keydown',e=>{if(e.code==='Space'&&state!=='play')reset();if(state==='play'){if(e.key==='ArrowLeft')tx-=14;if(e.key==='ArrowRight')tx+=14;if(e.key==='ArrowUp')ty-=14;if(e.key==='ArrowDown')ty+=14;}});addEventListener('click',()=>{if(state!=='play')reset();});
function scene(){skyGrad();
  x.fillStyle=WORLD.wilted?'#8a7a55':'#5aa64a';x.fillRect(0,PH-14,PW,14);x.fillStyle=WORLD.wilted?'#6f5f3f':'#3f8a33';for(let i=0;i<PW;i+=7)x.fillRect(i,PH-14,3,2);
  if(WORLD.factory){sprite(S_FAC,16,PH-14-9*3,{'#':'#333','@':'#777'},3);sprite(S_FAC,PW-56,PH-14-9*3,{'#':'#333','@':'#777'},3);}
  items.forEach(it=>{if(ITEM_A==='🥀')sprite(S_WILT,it.x-8,it.y-8,{'#':'#3d2b1f','@':'#8a6d55','o':'#5a4030','g':'#6b6b3a'},2);else if(ITEM_A==='🌸'||ITEM_A==='🌻')sprite(S_BLOOM,it.x-8,it.y-10,{'#':'#3d1f2f','p':ITEM_A==='🌻'?'#ffd23f':'#ff8fb3','y':'#ffe066','g':'#3f8a33'},2);else emo(ITEM_A,it.x,it.y,16);});
  haz.forEach(h=>{if(ITEM_B==='🏭'){x.fillStyle='rgba(60,60,60,.7)';x.beginPath();x.arc(h.x,h.y,11,0,6.3);x.fill();x.beginPath();x.arc(h.x+8,h.y-6,8,0,6.3);x.fill();x.beginPath();x.arc(h.x-8,h.y-3,7,0,6.3);x.fill();}else emo(ITEM_B,h.x,h.y,16);});
  if(PLAYER==='🐝')sprite(S_BEE,px-16,py-10,{'#':'#1a1a1a','@':'#ffcf3f','o':'#1a1a1a','w':'#dff4ff'},2);else emo(PLAYER,px,py,20);
  if(WORLD.smog){smokes.forEach(s=>{s.x+=s.s;if(s.x>PW+20)s.x=-20;x.fillStyle='rgba(120,120,110,.35)';x.beginPath();x.arc(s.x,s.y,s.r,0,6.3);x.fill();});const g=x.createRadialGradient(px,py,20,px,py,75);g.addColorStop(0,'rgba(120,120,110,0)');g.addColorStop(1,'rgba(120,120,110,.9)');x.fillStyle=g;x.fillRect(0,0,PW,PH);}
}
function loop(){
  if(state==='play'){t++;px+=(tx-px)*0.12*mv;py+=(ty-py)*0.12*mv;px=Math.max(8,Math.min(PW-8,px));py=Math.max(24,Math.min(PH-16,py));
    for(let i=items.length-1;i>=0;i--){const it=items[i];if(Math.hypot(it.x-px,it.y-py)<14){items.splice(i,1);if(!WORLD.wilted)got++;else say('<b>'+GUEST_NAME+'</b>: 시들어서 꿀이 없어…');}}
    haz.forEach(h=>{h.x+=h.vx;h.y+=h.vy;if(h.x<0||h.x>PW)h.vx*=-1;if(h.y<24||h.y>PH-16)h.vy*=-1;if(Math.hypot(h.x-px,h.y-py)<13){px=PW/2;py=PH/2;tx=px;ty=py;}});
    const secs=Math.round(t/60);
    if(got>=GOAL)report({got,goal:GOAL,secs,time:SPECIAL,spread:RATE},true,got+'/'+GOAL,'꿀 가득! 🍯 숨도 잘 쉬어져','');
    else if((SPECIAL&&secs>=SPECIAL)||(!items.length&&WORLD.wilted))report({got,goal:GOAL,secs,time:SPECIAL,spread:RATE},false,got+'/'+GOAL,'',WORLD.wilted?'꽃이 다 시들어서 꿀이 하나도 없어…':'시간이… 너무 멀리 흩어져 있어');}
  else t++;
  scene();blit();
  if(state==='title')titleHud();else{const secs=Math.round(t/60);txt('🍯 '+got+' / '+GOAL+(SPECIAL?'   ⏱ '+Math.max(0,SPECIAL-secs):''),48,24,'#ffd75b');if(state==='over')overHud(document.title.startsWith('성공'));}
  requestAnimationFrame(loop);}
loop();
</script>
</body>
</html>
